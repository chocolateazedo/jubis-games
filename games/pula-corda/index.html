<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pula Corda</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1d335f, #0a0f1f 65%);
      color: #fff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .game {
      width: min(780px, 100%);
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(4px);
    }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 4vw, 36px); }
    p { margin: 0 0 12px; opacity: .9; }
    .hud { display:flex; gap:14px; font-weight:700; margin-bottom: 10px; }
    canvas {
      width: 100%;
      max-width: 740px;
      aspect-ratio: 16/9;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.2);
      background: linear-gradient(#7bd5ff 65%, #2d7d46 65%);
      display: block;
      margin-inline: auto;
    }
    .controls { margin-top: 10px; display:flex; gap: 10px; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 999px; padding: 10px 14px;
      background: #00d4ff; color: #001018; font-weight: 800; cursor: pointer;
    }
  </style>
</head>
<body>
  <section class="game">
    <h1>🪢 Pula Corda</h1>
    <p>Aperte <strong>ESPAÇO</strong>, clique ou toque para pular na hora certa.</p>
    <div class="hud">
      <span>Pontos: <strong id="score">0</strong></span>
      <span>Recorde: <strong id="best">0</strong></span>
      <span id="status">Toque em iniciar</span>
    </div>
    <canvas id="screen" width="740" height="416"></canvas>
    <div class="controls">
      <button id="start">Iniciar / Reiniciar</button>
    </div>
  </section>

<script>
(() => {
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const statusEl = document.getElementById('status');

  const GROUND_Y = 300;
  const player = { x: 160, y: GROUND_Y, vy: 0, r: 24, jumping: false };
  const rope = { angle: 0, speed: 0.11, thick: 6 };

  let score = 0;
  let best = Number(localStorage.getItem('pulaCordaBest') || 0);
  let playing = false;
  let gameOver = false;
  bestEl.textContent = best;

  function reset() {
    score = 0;
    scoreEl.textContent = score;
    player.y = GROUND_Y;
    player.vy = 0;
    player.jumping = false;
    rope.angle = 0;
    rope.speed = 0.11;
    playing = true;
    gameOver = false;
    statusEl.textContent = 'Valendo!';
  }

  function jump() {
    if (!playing || gameOver) return;
    if (!player.jumping) {
      player.vy = -12;
      player.jumping = true;
    }
  }

  function endGame() {
    gameOver = true;
    playing = false;
    statusEl.textContent = 'Ops! Você tropeçou. Reinicie!';
    if (score > best) {
      best = score;
      localStorage.setItem('pulaCordaBest', String(best));
      bestEl.textContent = best;
    }
  }

  function update() {
    if (!playing || gameOver) return;

    rope.angle += rope.speed;

    player.vy += 0.65;
    player.y += player.vy;
    if (player.y >= GROUND_Y) {
      player.y = GROUND_Y;
      player.vy = 0;
      player.jumping = false;
    }

    const ropeY = GROUND_Y + Math.sin(rope.angle) * 110;
    const ropeAtPlayer = Math.cos(rope.angle) > 0.97;

    if (ropeAtPlayer) {
      if (player.y > GROUND_Y - 34) {
        endGame();
      } else {
        score++;
        scoreEl.textContent = score;
        rope.speed = Math.min(rope.speed + 0.0018, 0.2);
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#e4f7ff';
    ctx.fillRect(0, GROUND_Y + 24, canvas.width, 8);

    const centerX = 400;
    const radius = 235;
    const y = GROUND_Y + Math.sin(rope.angle) * 110;

    ctx.lineWidth = rope.thick;
    ctx.strokeStyle = '#ff8a00';
    ctx.beginPath();
    ctx.moveTo(centerX - radius, y);
    ctx.lineTo(centerX + radius, y);
    ctx.stroke();

    ctx.fillStyle = '#572f18';
    ctx.fillRect(centerX - radius - 12, y - 16, 8, 32);
    ctx.fillRect(centerX + radius + 4, y - 16, 8, 32);

    ctx.fillStyle = '#ff4dd2';
    ctx.beginPath();
    ctx.arc(player.x, player.y - player.r, player.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = '700 22px Arial';
    if (!playing) {
      ctx.fillText('Clique em Iniciar para jogar', 232, 70);
    } else if (gameOver) {
      ctx.fillText('Fim de jogo! Clique em Iniciar', 245, 70);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  document.getElementById('start').addEventListener('click', reset);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (!playing) reset(); else jump();
    }
  });
  canvas.addEventListener('pointerdown', () => {
    if (!playing) reset(); else jump();
  });

  loop();
})();
</script>
</body>
</html>
