<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Defesa da Torre de Zumbi</title>
  <style>
    :root{--bg:#050709;--ui:#dbe3dc}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% -20%,#243129 0%,#101619 45%,#05070a 100%);color:var(--ui);min-height:100vh;display:flex;justify-content:center;padding:clamp(8px,2vw,14px)}

    canvas{display:block;width:100%;aspect-ratio:16/9;max-height:calc(100vh - 180px);height:auto;border-radius:clamp(16px,2vw,28px);border:2px solid rgba(183,255,99,.55);box-shadow:0 16px 48px rgba(0,0,0,.6),0 0 42px rgba(134,255,109,.18) inset;touch-action:manipulation}

    #towerBar{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}.tower-option{flex:0 0 132px;background:linear-gradient(180deg,#335f49,#203a2c);border:1px solid rgba(201,255,146,.5);border-radius:14px;padding:10px;cursor:pointer;color:#efffde;text-align:left}
    .xbtn{background:#263d30;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer}
    .panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9990;background:rgba(0,0,0,.72)}
    .card{width:min(92vw,560px);background:linear-gradient(180deg,#193928,#11271c);border:1px solid rgba(156,255,107,.5);border-radius:16px;padding:16px;position:relative}
    .row{display:flex;justify-content:space-between;gap:8px;margin:8px 0} button{background:linear-gradient(180deg,#325d45,#234030);color:#e9ffd8;border:1px solid #9cff6b;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
    .upgrade-close{position:absolute;right:10px;top:10px}
  </style>
</head>
<body>
<div class="game-shell">
  <a class="back" href="../../index.php">← Voltar</a>
  <div id="hud"><span id="vida" class="hud-chip"></span><span id="dinheiro" class="hud-chip"></span><span id="onda" class="hud-chip"></span><span id="towerInfo" class="hud-chip">Sem torre selecionada</span></div>
  <canvas id="game" width="960" height="540"></canvas>
  <div id="slotInfo">Toque em um slot <strong>＋</strong> para abrir a loja de torres.</div>
  <div id="shopTray"><div class="row"><span>Escolha uma torre</span><button id="closeShop" class="xbtn">✖</button></div><div id="towerBar"></div></div>
</div>
<div id="upgradePanel" class="panel"><div class="card"><button id="panelClose" class="xbtn upgrade-close">✖</button><h3>🔧 Upgrade da Torre</h3><div id="upgradeContent"></div><div class="row"><button id="panelUpgrade">⬆️ Upar</button><button id="panelSell">💸 Vender</button></div></div></div>
<div id="gameOverPanel" class="panel"></div>
<script>
(()=>{const cvs=game,ctx=cvs.getContext('2d');const els={vida,dinheiro,onda,towerInfo,towerBar,shopTray,closeShop,upgradePanel,upgradeContent,panelUpgrade,panelSell,panelClose,gameOverPanel};
let mode='playing',vidaVal=1000,money=220,wave=1,slotActive=-1,spawn=0,spawned=0,cool=0,sel=null;const MAX_TOWER_LEVEL=50;
const path=[{x:-20,y:275},{x:120,y:240},{x:230,y:300},{x:350,y:215},{x:510,y:270},{x:650,y:190},{x:780,y:295},{x:980,y:250}],slots=[{x:110,y:355},{x:210,y:180},{x:315,y:360},{x:420,y:155},{x:560,y:350},{x:640,y:110},{x:790,y:380},{x:840,y:160}],towers=[],zombies=[],fx=[];
const types=[{k:'water',n:'Oceano de 7 Ondas',c:45,r:165,dmg:8,rt:20,col:'#3cb5ff'},{k:'fire',n:'Torreta Infernal',c:47,r:130,dmg:11,rt:25,col:'#ff6f2e'},{k:'toxic',n:'Torreta Tóxica',c:48,r:145,dmg:6,rt:18,col:'#67e23f'},{k:'wind',n:'Vento dos Céus',c:43,r:180,dmg:5,rt:28,col:'#d9fcff'},{k:'light',n:'Tempestade de Júpiter',c:60,r:175,dmg:35,rt:44,col:'#f4df59'},{k:'ice',n:'Horizonte Congelado',c:46,r:140,dmg:4,rt:28,col:'#9deaff'},{k:'leaf',n:'Natureza de Árvores',c:39,r:135,dmg:8,rt:14,col:'#7ccd4f'}];
const AC=new(window.AudioContext||window.webkitAudioContext)(),cd={};
function tone(k){if(AC.state==='suspended')AC.resume();const t=AC.currentTime;if(cd[k]&&t-cd[k]<.04)return;cd[k]=t;const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.connect(f);f.connect(g);g.connect(AC.destination);g.gain.value=.0001;const s=(ty,a,b,d)=>{o.type=ty;o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(b,t+d)};if(k==='water'){s('sine',420,150,.2);f.type='lowpass';f.frequency.value=900;g.gain.exponentialRampToValueAtTime(.09,t+.03);o.stop(t+.21)}
if(k==='fire'){s('sawtooth',280,90,.16);f.type='bandpass';f.frequency.value=850;g.gain.exponentialRampToValueAtTime(.08,t+.03);o.stop(t+.18)}
if(k==='toxic'){s('triangle',320,180,.22);f.type='notch';f.frequency.value=700;g.gain.exponentialRampToValueAtTime(.06,t+.02);o.stop(t+.24)}
if(k==='wind'){s('triangle',520,160,.2);f.type='bandpass';f.frequency.value=580;g.gain.exponentialRampToValueAtTime(.07,t+.02);o.stop(t+.23)}
if(k==='light'){s('square',1300,260,.09);f.type='highpass';f.frequency.value=760;g.gain.exponentialRampToValueAtTime(.12,t+.01);o.stop(t+.1)}
if(k==='ice'){s('triangle',760,330,.14);f.type='highpass';f.frequency.value=500;g.gain.exponentialRampToValueAtTime(.06,t+.01);o.stop(t+.16)}
if(k==='leaf'){s('sine',500,210,.13);f.type='bandpass';f.frequency.value=640;g.gain.exponentialRampToValueAtTime(.06,t+.01);o.stop(t+.15)}
if(k==='hit'){s('square',180,95,.05);f.type='lowpass';f.frequency.value=520;g.gain.exponentialRampToValueAtTime(.05,t+.01);o.stop(t+.08)}
if(k==='death'){s('sawtooth',220,50,.18);f.type='lowpass';f.frequency.value=400;g.gain.exponentialRampToValueAtTime(.08,t+.01);o.stop(t+.2)} o.start(t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);}
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),isBoss=()=>wave%15===0,ws=()=>isBoss()?{amount:1,hp:2500+wave*180,speed:.35,reward:220+wave*8,gap:50}:{amount:12+wave*2,hp:90+wave*16,speed:1+wave*.05,reward:18+wave*4,gap:Math.max(8,28-wave/2)};
function startWave(){const s=ws();spawn=s.amount;spawned=0;cool=1;}startWave();
function spawnZombie(){const s=ws(),boss=isBoss(),runner=!boss&&spawned%3===0,base=s.hp*(boss?1:runner?.75:1);zombies.push({x:path[0].x,y:path[0].y,path,seg:0,isBoss:boss,runner,hp:base,maxHp:base,speed:s.speed*(boss?1:runner?2.4:1),reward:Math.round(s.reward*(runner?.8:1)),dead:false,step:Math.random()*10,burn:0,toxic:0,slow:0,slowF:1,freeze:0,stun:0,spin:0,hit:0,electro:0,push:0});spawned++;}
function fireTower(t,a){if(t.type==='light'){for(let i=0;i<3;i++){const z=zombies[Math.floor(Math.random()*zombies.length)]||a;if(z&&!z.dead){z.hp-=t.dmg*.75;z.electro=18;fx.push({type:'light',x:z.x,y:z.y,life:8});}}tone('light');return;}
const dx=a.x-t.x,dy=a.y-t.y,m=Math.hypot(dx,dy)||1;if(t.type==='water'){for(const z of zombies){if(z.seg>0&&d(z,t)<t.range){z.hp-=t.dmg;z.push=16;z.slow=45;z.slowF=.6;}}fx.push({type:'water',life:25});tone('water');}
if(t.type==='wind'){for(const z of zombies){if(z.seg>0&&d(z,t)<t.range){z.hp-=t.dmg*.7;z.push=20;z.stun=14;z.slow=50;z.slowF=.5;}}fx.push({type:'wind',life:26});tone('wind');}
if(t.type==='fire'){a.hp-=t.dmg;a.burn=160;fx.push({type:'flame',x:t.x,y:t.y,tx:a.x,ty:a.y,life:18});tone('fire');}
if(t.type==='toxic'){a.hp-=t.dmg*.6;a.toxic=220;fx.push({type:'toxic',x:a.x,y:a.y,life:30});tone('toxic');}
if(t.type==='ice'){a.hp-=t.dmg*.4;a.freeze=90;a.slow=130;a.slowF=.08;fx.push({type:'ice',x:t.x,y:t.y,tx:a.x,ty:a.y,life:18});tone('ice');}
if(t.type==='leaf'){for(const z of zombies){if(d(z,a)<44){z.hp-=t.dmg*.8;z.hit=1;}}fx.push({type:'leaf',x:a.x,y:a.y,life:15});tone('leaf');}}
function update(){if(mode!=='playing')return;cool--;if(spawn>0&&cool<=0){spawnZombie();spawn--;cool=ws().gap;}if(spawn===0&&!zombies.length){money+=28+wave*7;wave++;startWave();}
for(const t of towers){if(--t.cd<=0){const a=zombies.find(z=>!z.dead&&d(z,t)<=t.range);if(a){fireTower(t,a);t.cd=t.rate;}}}
for(const z of zombies){z.step+=z.runner?.48:.25;z.hit=Math.max(0,z.hit-.12);if(z.burn>0){z.burn--;z.hp-=.3;}if(z.toxic>0){z.toxic--;z.hp-=.17;}if(z.freeze>0)z.freeze--;if(z.slow>0)z.slow--;if(z.stun>0)z.stun--;if(z.electro>0)z.electro--;if(z.push>0){z.push--;if(z.seg>0&&Math.random()<.5)z.seg=Math.max(0,z.seg-1);}const n=z.path[z.seg+1];if(!n){z.dead=1;vidaVal-=z.isBoss?vidaVal:Math.max(2,Math.round(z.hp*.22));continue;}const mv=z.stun>0?0:(z.freeze>0?.02:(z.slow>0?z.slowF:1));const v=Math.max(.04,z.speed*mv),dx=n.x-z.x,dy=n.y-z.y,dd=Math.hypot(dx,dy);if(dd<v){z.x=n.x;z.y=n.y;z.seg++;}else{z.x+=dx/dd*v;z.y+=dy/dd*v;}if(z.hp<=0){z.dead=1;money+=z.reward;tone('death');}}
for(const arr of [zombies])for(let i=arr.length-1;i>=0;i--)if(arr[i].dead)arr.splice(i,1);for(let i=fx.length-1;i>=0;i--)if(--fx[i].life<=0)fx.splice(i,1);if(vidaVal<=0)mode='end';hud();}
function drawSym(t){const x=t.x,y=t.y-26;ctx.save();ctx.translate(x,y);ctx.strokeStyle='#fff';ctx.fillStyle='#fff';ctx.lineWidth=2.2; if(t.type==='water'){for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-8,-4+i*4);ctx.bezierCurveTo(-2,-8+i*4,2,0+i*4,8,-4+i*4);ctx.stroke();}}
if(t.type==='fire'){ctx.beginPath();ctx.moveTo(0,-9);ctx.quadraticCurveTo(7,-2,2,7);ctx.quadraticCurveTo(0,3,-2,8);ctx.quadraticCurveTo(-7,-1,0,-9);ctx.fill();}
if(t.type==='toxic'){ctx.beginPath();ctx.arc(0,0,2,0,7);ctx.fill();for(let a=0;a<3;a++){ctx.beginPath();ctx.arc(Math.cos(a*2.09)*5,Math.sin(a*2.09)*5,2,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a*2.09)*4,Math.sin(a*2.09)*4);ctx.stroke();}}
if(t.type==='wind'){for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,0,2+i*3,.4,5.3);ctx.stroke();}}
if(t.type==='light'){ctx.beginPath();ctx.moveTo(-3,-8);ctx.lineTo(3,-1);ctx.lineTo(-1,-1);ctx.lineTo(4,8);ctx.lineTo(-4,1);ctx.lineTo(0,1);ctx.closePath();ctx.fill();}
if(t.type==='ice'){ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*8,Math.sin(a)*8);}ctx.stroke();}
if(t.type==='leaf'){ctx.beginPath();ctx.ellipse(0,0,7,4,0,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(5,0);ctx.stroke();}ctx.restore();}
function dz(z){ctx.save();ctx.translate(z.x,z.y+Math.sin(z.step*.8)*1.5);const s=z.isBoss?4.6:(z.runner?1.18:1.58);ctx.scale(s,s);ctx.fillStyle='#0b0c10';ctx.beginPath();ctx.roundRect(-13,-18,26,45,5);ctx.fill();ctx.fillStyle='#8ba08e';ctx.beginPath();ctx.roundRect(-16,-43,32,26,12);ctx.fill();if(z.hit>0){ctx.save();ctx.beginPath();ctx.roundRect(-16,-43,32,71,12);ctx.clip();ctx.globalCompositeOperation='source-atop';ctx.fillStyle='rgb(255,30,30)';ctx.fillRect(-16,-43,32,71);ctx.restore();}
if(z.burn>0){ctx.fillStyle='rgba(255,100,30,.35)';ctx.fillRect(-13,-18,26,45);}if(z.toxic>0){ctx.fillStyle='rgba(80,255,50,.25)';ctx.fillRect(-13,-18,26,45);}if(z.freeze>0){ctx.fillStyle='rgba(110,220,255,.35)';ctx.fillRect(-16,-43,32,71);}if(z.electro>0){ctx.strokeStyle='rgba(220,190,255,.9)';ctx.beginPath();ctx.moveTo(-15,-8);ctx.lineTo(-6,-14);ctx.lineTo(1,-6);ctx.lineTo(8,-15);ctx.lineTo(16,-8);ctx.stroke();}ctx.restore();}
function drawTower(t){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(t.x,t.y+20,26,9,0,0,7);ctx.fill();ctx.fillStyle='#4b3828';ctx.beginPath();ctx.moveTo(t.x-16,t.y+22);ctx.lineTo(t.x-28,t.y+38);ctx.lineTo(t.x-20,t.y+40);ctx.lineTo(t.x-8,t.y+24);ctx.fill();ctx.beginPath();ctx.moveTo(t.x,t.y+22);ctx.lineTo(t.x-7,t.y+42);ctx.lineTo(t.x+7,t.y+42);ctx.fill();ctx.beginPath();ctx.moveTo(t.x+16,t.y+22);ctx.lineTo(t.x+28,t.y+38);ctx.lineTo(t.x+20,t.y+40);ctx.lineTo(t.x+8,t.y+24);ctx.fill();ctx.fillStyle='#1e222d';ctx.beginPath();ctx.roundRect(t.x-13,t.y-8,26,30,7);ctx.fill();ctx.shadowBlur=14;ctx.shadowColor=t.color;ctx.strokeStyle=t.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(t.x,t.y-26,16,0,7);ctx.stroke();ctx.fillStyle='#0d1220';ctx.beginPath();ctx.arc(t.x,t.y-26,13,0,7);ctx.fill();drawSym(t);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.fillText(`Lv${t.level}`,t.x-11,t.y+34);}
function drawFx(){for(const e of fx){if(e.type==='light'){ctx.strokeStyle='rgba(250,232,113,.95)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(e.x,-30);for(let i=0;i<8;i++)ctx.lineTo(e.x+(Math.random()-.5)*15,e.y*(i/7));ctx.stroke();ctx.strokeStyle='rgba(180,90,255,.65)';ctx.lineWidth=10;ctx.stroke();}
if(e.type==='water'){for(let p=6;p>0;p--){const t=(25-e.life+p*3)/25,x1=path[path.length-1].x-(path[path.length-1].x-path[0].x)*t,y1=path[path.length-1].y-(path[path.length-1].y-path[0].y)*t;ctx.strokeStyle=`rgba(60,180,255,${.15+p*.1})`;ctx.lineWidth=4+p;ctx.beginPath();ctx.moveTo(x1-40,y1);ctx.bezierCurveTo(x1-10,y1-20,x1+30,y1+18,x1+60,y1);ctx.stroke();}}
if(e.type==='wind'){for(let i=0;i<9;i++){const t=(26-e.life+i)/26,x1=path[path.length-1].x-(path[path.length-1].x-path[0].x)*t,y1=path[path.length-1].y-(path[path.length-1].y-path[0].y)*t;ctx.strokeStyle='rgba(220,250,255,.7)';ctx.beginPath();ctx.ellipse(x1,y1,10+i*4,5+i*2,e.life*.12+i*.2,0,7);ctx.stroke();}}
if(e.type==='flame'){ctx.strokeStyle='rgba(255,120,20,.9)';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(e.x,e.y-8);ctx.quadraticCurveTo((e.x+e.tx)/2,e.y-35,e.tx,e.ty);ctx.stroke();}
if(e.type==='toxic'){for(let i=0;i<8;i++){ctx.fillStyle=`rgba(90,255,60,${.08+i*.07})`;ctx.beginPath();ctx.arc(e.x+(Math.random()-.5)*22,e.y-8+Math.random()*16,10+i*1.8,0,7);ctx.fill();}}
if(e.type==='ice'){ctx.strokeStyle='rgba(170,240,255,.95)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(e.x,e.y-8);ctx.lineTo(e.tx,e.ty);ctx.stroke();}
if(e.type==='leaf'){for(let i=0;i<10;i++){const a=i*.63;ctx.strokeStyle='rgba(110,220,80,.9)';ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+Math.cos(a)*26,e.y+Math.sin(a)*26);ctx.stroke();}}}}
function draw(){ctx.fillStyle='#74c85b';ctx.fillRect(0,0,960,540);ctx.strokeStyle='#b38254';ctx.lineWidth=104;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(const p of path.slice(1))ctx.lineTo(p.x,p.y);ctx.stroke();ctx.strokeStyle='#d2a574';ctx.lineWidth=72;ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(const p of path.slice(1))ctx.lineTo(p.x,p.y);ctx.stroke();for(let i=0;i<slots.length;i++){if(towers.some(t=>t.slot===i))continue;const s=slots[i];ctx.fillStyle='rgba(37,58,48,.9)';ctx.beginPath();ctx.arc(s.x,s.y,21,0,7);ctx.fill();ctx.fillStyle='#dbe7ef';ctx.font='bold 22px Arial';ctx.fillText('+',s.x-7,s.y+8);}for(const t of towers)drawTower(t);drawFx();for(const z of zombies)dz(z);}
function nextStats(t){return{dmg:Math.round((t.dmg+2)*1.05),range:t.range+6,rate:Math.max(8,Math.round(t.rate*.95))};}
function showPanel(t){const cost=20+t.level*18,n=nextStats(t);els.panelUpgrade.textContent=t.level>=MAX_TOWER_LEVEL?'LV máximo':`⬆️ Upar (${cost}💰)`;els.upgradeContent.innerHTML=`<div class='row'><strong>${t.label}</strong><strong>Lv ${t.level}</strong></div><div>Dano: ${t.dmg} ${t.level<MAX_TOWER_LEVEL?`→ ${n.dmg}`:''}</div><div>Alcance: ${t.range} ${t.level<MAX_TOWER_LEVEL?`→ ${n.range}`:''}</div><div>Cadência: ${t.rate} ${t.level<MAX_TOWER_LEVEL?`→ ${n.rate}`:''}</div><div>Venda: ${Math.round(t.total*.7)}💰</div>`;}
function hud(){els.vida.textContent=`❤️ ${Math.max(0,Math.round(vidaVal))}/1000`;els.dinheiro.textContent=`💰 ${money}`;els.onda.textContent=`🌊 Onda ${wave}${isBoss()?' • BOSS':''}`;els.towerInfo.textContent=sel?`${sel.label} Lv ${sel.level}`:'Sem torre selecionada';}
cvs.addEventListener('click',e=>{const r=cvs.getBoundingClientRect(),x=(e.clientX-r.left)*960/r.width,y=(e.clientY-r.top)*540/r.height;if(mode!=='playing')return;const t=towers.find(tt=>d(tt,{x,y})<22);if(t){sel=t;els.upgradePanel.style.display='flex';showPanel(t);return;}const i=slots.findIndex((s,ix)=>d(s,{x,y})<24&&!towers.some(t=>t.slot===ix));if(i>=0){slotActive=i;els.shopTray.style.display='block';els.towerBar.innerHTML='';for(const tt of types){const b=document.createElement('button');b.className='tower-option';b.innerHTML=`<strong>${tt.n}</strong><small>${tt.c}💰 • alcance ${tt.r}</small>`;b.onclick=()=>{if(money<tt.c||slotActive<0)return;const s=slots[slotActive];towers.push({x:s.x,y:s.y,slot:slotActive,type:tt.k,label:tt.n,range:tt.r,dmg:tt.dmg,rate:tt.rt,cd:0,level:1,total:tt.c,color:tt.col});money-=tt.c;slotActive=-1;els.shopTray.style.display='none';};els.towerBar.appendChild(b);}return;}els.shopTray.style.display='none';slotActive=-1;});
els.panelUpgrade.onclick=()=>{if(!sel)return;const c=20+sel.level*18;if(sel.level>=MAX_TOWER_LEVEL)return;if(money<c)return;money-=c;sel.level++;sel.total+=c;const n=nextStats(sel);sel.dmg=n.dmg;sel.range=n.range;sel.rate=n.rate;showPanel(sel);};els.panelSell.onclick=()=>{if(!sel)return;money+=Math.round(sel.total*.7);towers.splice(towers.indexOf(sel),1);sel=null;els.upgradePanel.style.display='none';};els.panelClose.onclick=()=>els.upgradePanel.style.display='none';els.closeShop.onclick=()=>{slotActive=-1;els.shopTray.style.display='none';};
(function loop(){update();draw();requestAnimationFrame(loop)})();hud();})();
</script>
</body>
