<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>Defesa Zumbi VIP — Jubis Games</title>
  <style>
    :root{--bg:#070b18;--panel:rgba(9,14,34,.86);--line:rgba(138,237,255,.42);--txt:#e8f5ff;--muted:#9fc2dc;--gold:#ffd978;--ok:#6bffa8;--danger:#ff6e8e}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 30% -20%,#395ea7,#090f27 55%,#050814);font-family:Inter,system-ui,sans-serif;color:var(--txt)}
    .back{position:fixed;left:10px;top:max(10px,env(safe-area-inset-top));z-index:200;padding:.45rem .7rem;border-radius:11px;text-decoration:none;color:#dbf6ff;background:rgba(4,7,19,.6);border:1px solid rgba(139,234,255,.5)}
    .screen{height:100dvh;padding:calc(46px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
    .card{background:linear-gradient(160deg,rgba(20,27,58,.95),rgba(14,19,42,.92));border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.35),inset 0 0 45px rgba(130,89,255,.12)}
    #menu{margin:auto;max-width:1020px;padding:20px}.title{margin:0;text-align:center;font-size:clamp(2rem,4vw,3.2rem);text-shadow:0 0 20px #67f2ff}
    .subtitle{text-align:center;color:var(--muted);margin:.45rem 0 1rem}
    .worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    .world{padding:14px;border-radius:13px;background:linear-gradient(145deg,rgba(37,56,108,.9),rgba(41,24,75,.86));border:1px solid rgba(255,255,255,.26);cursor:pointer;color:#fff;text-align:left}
    .world strong{display:block;font-size:1.02rem}.world small{color:#cbe6ff}
    .hidden{display:none!important}
    .hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .hud-item{padding:10px;border-radius:12px;background:linear-gradient(160deg,rgba(15,28,64,.94),rgba(36,23,71,.9));border:1px solid rgba(140,233,255,.54);text-align:center}
    .hud-item b{display:block;font-size:.72rem;color:#a5d9ff}.hud-item span{font-size:1.05rem;text-shadow:0 0 10px #58f0ff}
    .main{display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
    .map-wrap{position:relative;flex:1;min-height:50dvh}
    canvas{width:100%;height:100%;display:block;border-radius:16px;border:1px solid var(--line);background:#10182d}
    .shop{display:grid;grid-template-columns:repeat(7,minmax(172px,1fr));gap:8px;overflow-x:auto;padding:3px}
    .tower{padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.24);background:linear-gradient(145deg,rgba(45,25,82,.93),rgba(11,41,86,.9));color:#fff;cursor:pointer;text-align:left;white-space:normal}
    .tower strong{display:block;font-size:.92rem}.tower small{display:block;color:#cae4ff;font-size:.75rem;line-height:1.2}
    .tower.active{border-color:var(--gold);box-shadow:0 0 16px rgba(255,217,120,.45)}
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:250;background:rgba(0,0,0,.45)}
    .modal.open{display:flex}.modal-box{width:min(420px,92vw);padding:16px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}.btn{flex:1;padding:10px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
    .up{background:linear-gradient(145deg,#64d9ff,#5fb4ff)}.sell{background:linear-gradient(145deg,#ff9c7a,#ff6f92)}.close{background:#2a335c;color:#fff}
    @media (max-width:960px){.hud{grid-template-columns:repeat(2,minmax(0,1fr))}.map-wrap{min-height:56dvh}.shop{grid-template-columns:repeat(7,220px)}}
  </style>
</head>
<body>
<a class="back" href="../../">← Voltar</a>
<main class="screen">
  <section id="menu" class="card">
    <h1 class="title">Defesa Zumbi VIP</h1>
    <p class="subtitle">Visual premium estilo cartoon, inspirado na referência <code>2ca166e5-d4cc-4855-ae66-a0b3e18ed420</code>.</p>
    <div id="worlds" class="worlds"></div>
  </section>
  <section id="game" class="hidden" style="height:100%;display:flex;flex-direction:column;gap:10px;">
    <header class="hud">
      <div class="hud-item"><b>🏰 Vida da Base</b><span id="life">100/100</span></div>
      <div class="hud-item"><b>💰 Dinheiro</b><span id="money">360</span></div>
      <div class="hud-item"><b>🌊 Onda</b><span id="wave">1/10</span></div>
      <div class="hud-item"><b>🗼 Torres</b><span id="qt">0</span></div>
    </header>
    <div class="main"><div class="map-wrap"><canvas id="cv"></canvas></div><footer id="shop" class="shop"></footer></div>
  </section>
</main>
<div id="upgradeModal" class="modal"><div class="modal-box card"><h3 id="tName">Torre</h3><p id="tInfo"></p><div class="actions"><button id="upBtn" class="btn up">Upgrade</button><button id="sellBtn" class="btn sell">Vender</button><button id="closeBtn" class="btn close">Fechar</button></div></div></div>
<script>
(()=>{const worlds=[{n:'Floresta Sombria',c1:'#24422c',c2:'#0f2016',path:'#b89f76'},{n:'Caverna Tóxica',c1:'#51642a',c2:'#202812',path:'#bba072'},{n:'Vila Assombrada',c1:'#5a3a50',c2:'#241826',path:'#c59a7d'}];
const towers=[{id:'gelo',n:'Torre de Gelo',preco:95,alc:160,dano:12,rate:54,c:'#97f3ff'},{id:'veneno',n:'Torre de Veneno',preco:115,alc:152,dano:9,rate:40,c:'#8fff61',dot:120},{id:'eletrica',n:'Torre Elétrica',preco:150,alc:158,dano:15,rate:50,c:'#bca2ff',chain:4},{id:'fogo',n:'Torre de Fogo',preco:135,alc:144,dano:15,rate:40,c:'#ff9162',burn:110},{id:'agua',n:'Torre de Água',preco:122,alc:156,dano:11,rate:38,c:'#63bcff',slow:46},{id:'vento',n:'Torre de Vento',preco:108,alc:168,dano:8,rate:34,c:'#e8f8ff',push:1},{id:'explosiva',n:'Torre Explosiva',preco:170,alc:145,dano:26,rate:68,c:'#ffd66c',splash:74}];
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');let S,dpr=1,selectedTower=null;
function resize(){dpr=Math.max(1,Math.min(2,devicePixelRatio||1));cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);
function pathPts(){const w=cv.clientWidth,h=cv.clientHeight,m=36;return [[m,h*.15],[w*.33,h*.15],[w*.33,h*.36],[w*.74,h*.36],[w*.74,h*.2],[w-m,h*.2],[w-m,h*.57],[w*.18,h*.57],[w*.18,h*.84],[w*.92,h*.84]]}
function start(world){$('menu').classList.add('hidden');$('game').classList.remove('hidden');resize();S={world,baseMax:100,life:100,money:360,w:1,maxW:10,towers:[],shots:[],z:[],spawn:0,tick:0,over:false,sel:null,path:pathPts()};loop()}
function spawn(){const hp=88+S.w*20;S.z.push({x:S.path[0][0],y:S.path[0][1],i:1,hp,max:hp,spd:.58+S.w*.03,size:24,slow:0,po:0,burn:0})}
function update(){if(S.over)return;S.path=pathPts();S.tick++;if(S.spawn--<=0){spawn();S.spawn=Math.max(24,75-S.w*4)}if(S.tick%760===0&&S.w<S.maxW)S.w++;
for(const z of S.z){const t=S.path[z.i];if(!t){S.life-=Math.max(1,Math.floor(z.hp));z.hp=0;continue}const sp=z.slow>0?z.spd*.55:z.spd;const dx=t[0]-z.x,dy=t[1]-z.y,d=Math.hypot(dx,dy);if(d<4)z.i++;else{z.x+=dx/d*sp;z.y+=dy/d*sp}z.slow=Math.max(0,z.slow-1);if(z.po>0){z.hp-=.24;z.po--}if(z.burn>0){z.hp-=.4;z.burn--}}
for(const t of S.towers){if(t.cd-->0)continue;const target=S.z.find(z=>z.hp>0&&Math.hypot(z.x-t.x,z.y-t.y)<t.tp.alc);if(!target)continue;t.cd=t.tp.rate-Math.min(16,(t.lv-1)*4);S.shots.push({x:t.x,y:t.y,trg:target,t})}
for(const s of S.shots){if(!s.trg||s.trg.hp<=0){s.dead=1;continue}const dx=s.trg.x-s.x,dy=s.trg.y-s.y,d=Math.hypot(dx,dy);if(d<11){impact(s);s.dead=1}else{s.x+=dx/d*5.4;s.y+=dy/d*5.4}}
S.shots=S.shots.filter(s=>!s.dead);S.z=S.z.filter(z=>{if(z.hp<=0){S.money+=14;return false}return true});if(S.life<=0&&!S.over){S.over=true;alert('Game Over')}}
function impact(s){const t=s.t.tp,lv=s.t.lv,d=t.dano+lv*2,z=s.trg;z.hp-=d;if(t.slow)z.slow=t.slow;if(t.dot)z.po=t.dot;if(t.burn)z.burn=t.burn;if(t.push&&z.i>1)z.i-=0.18;if(t.chain){for(const a of S.z){if(a!==z&&Math.hypot(a.x-z.x,a.y-z.y)<110)a.hp-=d*.45}}if(t.splash){for(const a of S.z){const dist=Math.hypot(a.x-z.x,a.y-z.y);if(dist<t.splash)a.hp-=d*(1-dist/t.splash)*.8}}}
function draw(){const g=ctx.createLinearGradient(0,0,0,cv.clientHeight);g.addColorStop(0,S.world.c1);g.addColorStop(1,S.world.c2);ctx.fillStyle=g;ctx.fillRect(0,0,cv.clientWidth,cv.clientHeight);
ctx.lineWidth=50;ctx.strokeStyle=S.world.path;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();S.path.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.lineWidth=4;ctx.strokeStyle='rgba(255,232,191,.7)';ctx.setLineDash([7,10]);ctx.stroke();ctx.setLineDash([]);
S.towers.forEach(t=>{ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(t.x+8,t.y+22,20,9,0,0,6.28);ctx.fill();ctx.strokeStyle=t.tp.c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(t.x,t.y,18,0,6.28);ctx.stroke();ctx.fillStyle=t.tp.c;ctx.globalAlpha=.35;ctx.beginPath();ctx.arc(t.x,t.y,14,0,6.28);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font='bold 11px Inter';ctx.fillText('Nv.'+t.lv,t.x-14,t.y+4)});
S.shots.forEach(s=>{ctx.fillStyle=s.t.tp.c;ctx.beginPath();ctx.arc(s.x,s.y,5,0,6.28);ctx.fill()});
S.z.forEach(z=>{ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(z.x+5,z.y+z.size*.8,z.size*.56,z.size*.22,0,0,6.28);ctx.fill();ctx.fillStyle='#62c56b';ctx.beginPath();ctx.roundRect(z.x-z.size/2,z.y-z.size/2,z.size,z.size,10);ctx.fill();ctx.fillStyle='#2a1320';ctx.fillRect(z.x-z.size/2,z.y-z.size/2-10,z.size,7);ctx.fillStyle='#74ff98';ctx.fillRect(z.x-z.size/2,z.y-z.size/2-10,Math.max(0,z.hp/z.max)*z.size,7)})}
function ui(){$('life').textContent=`${Math.max(0,Math.floor(S.life))}/${S.baseMax}`;$('money').textContent=Math.floor(S.money);$('wave').textContent=`${S.w}/${S.maxW}`;$('qt').textContent=S.towers.length}
function loop(){if(!S)return;update();draw();ui();requestAnimationFrame(loop)}
cv.addEventListener('pointerdown',e=>{if(!S||S.over)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;const tower=S.towers.find(t=>Math.hypot(t.x-x,t.y-y)<26);if(tower){selectedTower=tower;openUpgrade();return}const tp=towers.find(t=>t.id===S.sel);if(!tp||S.money<tp.preco)return;if(S.path.some(p=>Math.hypot(p[0]-x,p[1]-y)<66))return;S.money-=tp.preco;S.towers.push({x,y,lv:1,tp,cd:0,up:80})});
function openUpgrade(){if(!selectedTower)return;const t=selectedTower;$('tName').textContent=t.tp.n;$('tInfo').textContent=`Nível: ${t.lv} | Dano: ${t.tp.dano+t.lv*2} | Upgrade: 💰${t.up}`;$('upgradeModal').classList.add('open')}
$('upBtn').onclick=()=>{const t=selectedTower;if(!t)return;if(t.lv>=5)return alert('Nível máximo');if(S.money<t.up)return alert('Sem dinheiro');S.money-=t.up;t.lv++;t.up=Math.floor(t.up*1.45);openUpgrade()};
$('sellBtn').onclick=()=>{const t=selectedTower;if(!t)return;S.money+=Math.floor((t.tp.preco+t.up*.35)*.58);S.towers=S.towers.filter(x=>x!==t);$('upgradeModal').classList.remove('open')};
$('closeBtn').onclick=()=>$('upgradeModal').classList.remove('open');$('upgradeModal').addEventListener('click',e=>{if(e.target.id==='upgradeModal')$('upgradeModal').classList.remove('open')});
const wb=$('worlds');worlds.forEach((w,i)=>{const b=document.createElement('button');b.className='world';b.innerHTML=`<strong>${w.n}</strong><small>Mundo ${i+1} • estética premium</small>`;b.onclick=()=>start(w);wb.appendChild(b)});
const shop=$('shop');towers.forEach(tp=>{const c=document.createElement('button');c.className='tower';c.innerHTML=`<strong>${tp.n}</strong><small>💰 ${tp.preco} • 🎯 ${tp.alc}</small><small>⚔️ ${tp.dano} • toque para selecionar</small>`;c.onclick=()=>{S&&(S.sel=tp.id);[...shop.children].forEach(x=>x.classList.remove('active'));c.classList.add('active')};shop.appendChild(c)})
})();
</script>
</body>
</html>
