<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375" role="img" aria-label="Plantão dos Vovôs">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8e8"/>
      <stop offset="100%" stop-color="#bfe6a8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2c2"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </linearGradient>
  </defs>

  <!-- céu / jardim -->
  <rect width="600" height="375" fill="url(#sky)"/>
  <rect y="250" width="600" height="125" fill="#74b850"/>
  <path d="M0 250 Q150 232 300 250 T600 250 V375 H0 Z" fill="#6cae4a"/>
  <circle cx="520" cy="62" r="34" fill="#ffd76b"/>

  <!-- casa de repouso -->
  <rect x="58" y="120" width="270" height="150" rx="8" fill="#efdcb2"/>
  <rect x="58" y="120" width="270" height="26" fill="#c0392b"/>
  <polygon points="48,122 193,72 338,122" fill="#c0392b"/>
  <rect x="86" y="170" width="42" height="42" rx="4" fill="#bfe0f5" stroke="#fff" stroke-width="4"/>
  <rect x="170" y="170" width="42" height="42" rx="4" fill="#bfe0f5" stroke="#fff" stroke-width="4"/>
  <rect x="258" y="170" width="42" height="42" rx="4" fill="#bfe0f5" stroke="#fff" stroke-width="4"/>
  <rect x="170" y="222" width="42" height="48" rx="4" fill="#9c6b3f"/>
  <text x="193" y="108" font-size="22" text-anchor="middle">➕</text>

  <!-- árvore -->
  <rect x="406" y="196" width="16" height="46" fill="#6b4a2a"/>
  <circle cx="414" cy="188" r="40" fill="#2e8b3a"/>

  <!-- cuidador (esq) + vovô em cadeira de rodas (dir) -->
  <g transform="translate(360,238)">
    <ellipse cx="0" cy="62" rx="26" ry="8" fill="rgba(0,0,0,.15)"/>
    <circle cx="0" cy="0" r="20" fill="#f1c27d"/>
    <rect x="-7" y="-22" width="14" height="8" rx="3" fill="#5a3a1a"/>
    <rect x="-18" y="20" width="36" height="38" rx="10" fill="#eef4ff"/>
    <text x="0" y="6" font-size="20" text-anchor="middle">🙂</text>
  </g>
  <text x="470" y="250" font-size="64" text-anchor="middle">🧓</text>
  <text x="470" y="196" font-size="34" text-anchor="middle">❤️</text>

  <!-- título -->
  <rect x="60" y="296" width="480" height="60" rx="16" fill="rgba(20,40,18,.78)"/>
  <text x="300" y="338" font-family="Arial, sans-serif" font-size="40" font-weight="800"
        text-anchor="middle" fill="url(#title)">Plantão dos Vovôs</text>
</svg>
