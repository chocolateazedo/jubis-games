<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Defesa da Torre Zumbi — Cartoon Premium</title>
  <style>
    :root{--ink:#eaf7ff;--blue:#2cb6ff;--panel:#10203bde;--panel2:#1d3663ef;--gold:#ffd873;--danger:#ff6c86;--ok:#9fffc0}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 40% -20%,#2a5ea5,#101b39 45%,#060914);font-family:"Baloo 2","Nunito","Segoe UI",sans-serif;color:var(--ink)}
    .app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom))}
    .hud{display:grid;grid-template-columns:1.2fr repeat(5,1fr);gap:8px;z-index:3}
    .panel{border:2px solid #8fdfff;border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 10px 28px #0009,inset 0 2px 0 #ffffff4f;text-shadow:0 2px 0 #00172e;font-weight:900}
    .back{padding:9px 11px;text-align:center;color:#fff;text-decoration:none}
    .stat{padding:8px 10px;white-space:nowrap}
    .field{position:relative}
    canvas{width:100%;height:100%;display:block;border-radius:24px;border:3px solid #9de6ff;box-shadow:0 24px 70px #000c,inset 0 0 70px #ffffff26;background:#0f2a4f}
    .hint{position:absolute;left:12px;top:10px;background:#071529bf;border:1px solid #95e8ff;border-radius:12px;padding:6px 10px;font-size:.9rem;font-weight:700;backdrop-filter:blur(3px)}
    .shop{z-index:3;border:2px solid #9de5ff;border-radius:18px;padding:9px;background:linear-gradient(180deg,#13294af2,#0b1d35f2);box-shadow:0 14px 28px #0009,inset 0 2px 0 #ffffff40}
    .shopTop{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:8px}
    .cards{display:flex;gap:10px;overflow:auto;padding-bottom:4px}
    .card{min-width:240px;border:2px solid #b9efff;border-radius:16px;color:#fff;background:linear-gradient(160deg,#3f79b7,#233f66 58%,#192e4e);padding:10px;cursor:pointer;box-shadow:0 10px 18px #0008,inset 0 2px 0 #fff4;position:relative}
    .card.sel{outline:3px solid #ffe29b;transform:translateY(-3px)}
    .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .ico{width:50px;height:50px;image-rendering:auto;filter:drop-shadow(0 4px 8px #000a)}
    .tier{font-size:.75rem;padding:2px 8px;border-radius:999px;border:1px solid #fff7;background:#0004}
    .mini{display:flex;justify-content:space-between;font-size:.84rem;opacity:.95}
    @media (max-width:980px){.hud{grid-template-columns:repeat(3,1fr)}.app{gap:7px;padding:calc(6px + env(safe-area-inset-top)) 6px calc(6px + env(safe-area-inset-bottom))}.card{min-width:180px}}
  </style>
</head>
<body>
<div class="app">
  <div class="hud">
    <a class="panel back" href="../../index.php">← Voltar</a>
    <div id="life" class="panel stat"></div><div id="gold" class="panel stat"></div><div id="wave" class="panel stat"></div><div id="boss" class="panel stat"></div><div id="world" class="panel stat"></div>
  </div>
  <div class="field">
    <div class="hint">🎨 Referência obrigatória: 2ca166e5-d4cc-4855-ae66-a0b3e18ed420 · visual cartoon completo</div>
    <canvas id="game" width="1600" height="900"></canvas>
  </div>
  <div class="shop">
    <div class="shopTop"><span>🛡️ Deck de Torres Ilustradas</span><small>Clique na carta e construa nas áreas verdes</small></div>
    <div id="cards" class="cards"></div>
  </div>
</div>
<script>
(()=>{const cvs=game,ctx=cvs.getContext('2d');
const ui={life,gold,wave,boss,world};
const mkSVG=(s)=>'data:image/svg+xml;utf8,'+encodeURIComponent(s);
const spriteDefs={
 turret:mkSVG(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><ellipse cx='60' cy='102' rx='36' ry='12' fill='#000' opacity='.32'/><rect x='22' y='52' width='76' height='46' rx='18' fill='#845236'/><rect x='28' y='24' width='64' height='38' rx='14' fill='#c9d2e8'/><circle cx='60' cy='44' r='16' fill='#4de2ff'/><rect x='52' y='6' width='16' height='26' rx='8' fill='#5978ae'/></svg>`),
 zombie:mkSVG(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><ellipse cx='60' cy='108' rx='30' ry='10' fill='#000' opacity='.32'/><rect x='35' y='44' width='50' height='56' rx='16' fill='#475c76'/><rect x='30' y='16' width='60' height='40' rx='16' fill='#b9d99d'/><circle cx='48' cy='36' r='6' fill='#fff37a'/><circle cx='72' cy='36' r='6' fill='#fff37a'/><rect x='46' y='50' width='28' height='6' rx='3' fill='#2f2a2a'/></svg>`),
 boss:mkSVG(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><ellipse cx='90' cy='164' rx='52' ry='14' fill='#000' opacity='.36'/><rect x='46' y='70' width='88' height='78' rx='24' fill='#582f45'/><rect x='38' y='20' width='104' height='64' rx='28' fill='#d3a97b'/><circle cx='66' cy='56' r='10' fill='#ffef7e'/><circle cx='114' cy='54' r='10' fill='#ffef7e'/><rect x='62' y='74' width='56' height='10' rx='5' fill='#3a131f'/><path d='M44 36 L20 60 L38 66 Z' fill='#d28f5d'/><path d='M136 36 L160 58 L142 66 Z' fill='#d28f5d'/></svg>`),
 path:mkSVG(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#f2cd98'/><stop offset='1' stop-color='#b67945'/></linearGradient></defs><path d='M-20 740 C160 750 230 640 360 610 C480 580 590 640 700 510 C830 360 1030 320 1170 420 C1290 510 1430 480 1620 430' stroke='#6d3f22' stroke-width='126' fill='none' stroke-linecap='round'/><path d='M-20 740 C160 750 230 640 360 610 C480 580 590 640 700 510 C830 360 1030 320 1170 420 C1290 510 1430 480 1620 430' stroke='url(#g)' stroke-width='100' fill='none' stroke-linecap='round'/><path d='M-20 740 C160 750 230 640 360 610 C480 580 590 640 700 510 C830 360 1030 320 1170 420 C1290 510 1430 480 1620 430' stroke='#ffefce' stroke-dasharray='12 18' stroke-width='8' fill='none' stroke-linecap='round' opacity='.68'/></svg>`)
};
const imgs={}; Object.entries(spriteDefs).forEach(([k,v])=>{const i=new Image();i.src=v;imgs[k]=i;});
const towers=[{k:'solar',n:'Sentinela Solar',cost:140,d:24,r:260,rt:32,col:'#ffd76f'},{k:'frost',n:'Obelisco Glacial',cost:120,d:16,r:230,rt:24,col:'#89e6ff'},{k:'venom',n:'Totem Tóxico',cost:98,d:11,r:215,rt:16,col:'#9ff980'},{k:'storm',n:'Torre Tempestade',cost:170,d:32,r:250,rt:35,col:'#d4b0ff'}];
let sel=towers[0],lifeV=220,goldV=360,waveV=1,spawn=0,cd=0,mode='play',bossHP=0,bossMax=0;
const placed=[],z=[],shots=[],fx=[]; const path=[{x:-20,y:740},{x:160,y:750},{x:230,y:640},{x:360,y:610},{x:480,y:580},{x:590,y:640},{x:700,y:510},{x:830,y:360},{x:1030,y:320},{x:1170,y:420},{x:1290,y:510},{x:1430,y:480},{x:1620,y:430}];
function buildCards(){cards.innerHTML='';towers.forEach(t=>{const b=document.createElement('button');b.className='card'+(t===sel?' sel':'');b.innerHTML=`<div class='row'><img class='ico' src='${imgs.turret.src}'/><span class='tier'>${t.k.toUpperCase()}</span></div><b>${t.n}</b><div class='mini'><span>${t.cost} 💰</span><span>Alc ${t.r}</span></div><div class='mini'><span>Dano ${t.d}</span><span>Rec ${t.rt}</span></div>`;b.onclick=()=>{sel=t;buildCards()};cards.appendChild(b);});}
function startWave(){spawn=9+waveV*2;cd=18;if(waveV%5===0){bossMax=1600+waveV*180;bossHP=bossMax;}}
function spawnZ(){z.push({x:path[0].x,y:path[0].y,seg:0,hp:110+waveV*24+Math.random()*40,spd:2+Math.random()*.4,elite:Math.random()<.2,a:Math.random()*20});}
function h(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function upd(){if(mode!=='play')return;cd--;if(spawn>0&&cd<=0){spawnZ();spawn--;cd=18}if(spawn===0&&z.length===0){waveV++;goldV+=90;startWave();}
 for(const t of placed){if(--t.cd>0)continue;const target=z.find(o=>h(t,o)<t.r);if(!target)continue;t.cd=t.rt;shots.push({x:t.x,y:t.y,t:target,d:t.d,c:t.col,s:14});fx.push({k:'m',x:t.x,y:t.y,l:10,c:t.col});}
 shots.forEach(s=>{if(!s.t||s.t.hp<=0){s.dead=1;return;}const dx=s.t.x-s.x,dy=s.t.y-s.y,d=Math.hypot(dx,dy);if(d<16){s.t.hp-=s.d;if(sel.k==='storm')fx.push({k:'z',x:s.t.x,y:s.t.y,l:10});if(sel.k==='venom')s.t.hp-=6;s.dead=1;}else{s.x+=dx/d*s.s;s.y+=dy/d*s.s;}});
 z.forEach(o=>{o.a+=.2;const n=path[o.seg+1];if(!n){lifeV-=o.elite?20:12;o.dead=1;return;}const dx=n.x-o.x,dy=n.y-o.y,d=Math.hypot(dx,dy),spd=o.spd*(o.elite?1.2:1);if(d<spd){o.x=n.x;o.y=n.y;o.seg++;}else{o.x+=dx/d*spd;o.y+=dy/d*spd;}if(o.hp<=0){o.dead=1;goldV+=o.elite?22:15;bossHP=Math.max(0,bossHP-12);fx.push({k:'p',x:o.x,y:o.y,l:20});}});
 fx.forEach(f=>f.l--); [shots,z,fx].forEach(a=>{for(let i=a.length-1;i>=0;i--)if(a[i].dead||a[i].l<=0)a.splice(i,1)});
 if(lifeV<=0)mode='end'; ui.life.textContent=`❤️ Base ${Math.max(0,lifeV)}`;ui.gold.textContent=`💰 ${goldV}`;ui.wave.textContent=`🌊 Onda ${waveV}`;ui.world.textContent='🗺️ Vale Esmeralda';ui.boss.textContent=bossHP?`👹 Chefão ${Math.round(100*bossHP/bossMax)}%`:'👹 Sem chefão';}
 function drawBG(){const g=ctx.createLinearGradient(0,0,0,900);g.addColorStop(0,'#8be0ff');g.addColorStop(.45,'#4d8ec8');g.addColorStop(1,'#1c3f53');ctx.fillStyle=g;ctx.fillRect(0,0,1600,900);for(let i=0;i<16;i++){ctx.fillStyle=`rgba(255,255,255,${0.05+i*0.004})`;ctx.beginPath();ctx.arc((i*101)%1600,120+(i*51)%220,80+(i*7)%40,0,7);ctx.fill();}
 ctx.fillStyle='#4cbf71';ctx.fillRect(0,590,1600,320);ctx.fillStyle='#3ea35f';for(let i=0;i<170;i++)ctx.fillRect((i*41)%1600,620+((i*17)%250),2,22+((i*11)%18));ctx.drawImage(imgs.path,0,0,1600,900);}
 function draw(){drawBG();placed.forEach(t=>{ctx.globalAlpha=.32;ctx.fillStyle=t.col;ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,7);ctx.fill();ctx.globalAlpha=1;ctx.drawImage(imgs.turret,t.x-42,t.y-72,84,84);});shots.forEach(s=>{ctx.shadowColor=s.c;ctx.shadowBlur=18;ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,7,0,7);ctx.fill();ctx.shadowBlur=0;});
 z.forEach(o=>{const s=o.elite?1.2:1;ctx.save();ctx.translate(o.x,o.y+Math.sin(o.a)*2);ctx.scale(s,s);ctx.drawImage(imgs.zombie,-40,-80,80,80);ctx.fillStyle='#fd7f95';ctx.fillRect(-26,-58,52*(o.hp/(110+waveV*24+40)),6);ctx.restore();});
 if(bossHP){ctx.drawImage(imgs.boss,1310,530,250,250);ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(230,24,1140,26);ctx.fillStyle='#ff6486';ctx.fillRect(230,24,1140*(bossHP/bossMax),26);ctx.strokeStyle='#ffe2e8';ctx.strokeRect(230,24,1140,26);}fx.forEach(f=>{if(f.k==='m'){ctx.globalAlpha=f.l/10;ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,22-f.l,0,7);ctx.fill();ctx.globalAlpha=1;}if(f.k==='z'){ctx.strokeStyle='#e8fbff';ctx.beginPath();ctx.moveTo(f.x-12,f.y-22);ctx.lineTo(f.x+8,f.y);ctx.lineTo(f.x-4,f.y+18);ctx.stroke();}if(f.k==='p'){ctx.fillStyle='rgba(255,215,130,.75)';ctx.beginPath();ctx.arc(f.x,f.y,24-f.l,0,7);ctx.fill();}});
 if(mode==='end'){ctx.fillStyle='rgba(4,7,16,.7)';ctx.fillRect(0,0,1600,900);ctx.fillStyle='#fff';ctx.font='900 96px Baloo 2';ctx.fillText('BASE PERDIDA',500,430);ctx.font='700 34px Baloo 2';ctx.fillText('Toque para reiniciar',650,490);} }
 cvs.onclick=e=>{if(mode==='end'){lifeV=220;goldV=360;waveV=1;spawn=0;cd=0;bossHP=0;bossMax=0;placed.length=z.length=shots.length=fx.length=0;mode='play';startWave();return;}const r=cvs.getBoundingClientRect(),x=(e.clientX-r.left)*1600/r.width,y=(e.clientY-r.top)*900/r.height;if(y>600||goldV<sel.cost)return;placed.push({...sel,x,y,cd:0});goldV-=sel.cost;};
 buildCards();startWave();(function lp(){upd();draw();requestAnimationFrame(lp)})();})();
</script>
</body>
</html>
