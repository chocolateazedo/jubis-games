<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Defesa da Torre Zumbi — Edição Premium</title>
  <style>
    :root{--ink:#eff6ff;--gold:#f9d47f;--panel:#12243de6;--card:#1c3150f2}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% -20%,#6dc6ff 0,#29465f 36%,#111e35 72%,#050912 100%);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    .shell{width:min(100vw,1200px);margin:auto;position:relative;padding:10px}
    .back{position:absolute;left:12px;top:12px;z-index:60;background:#1d3555;border:2px solid #8ad7ff;border-radius:12px;padding:8px 10px;color:#fff;text-decoration:none;font-weight:800}
    #hud{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:8px;z-index:50;width:min(97%,1100px)}
    .chip{background:linear-gradient(180deg,#385e8f,#203754);border:2px solid #8ed7ff;border-radius:16px;padding:8px 10px;font-weight:900;box-shadow:inset 0 2px 0 #ffffff44,0 8px 18px #0008;text-shadow:0 2px 0 #0007;white-space:nowrap}
    canvas{display:block;width:100%;height:min(70vh,760px);border-radius:24px;border:3px solid #9ee6ff;box-shadow:0 20px 60px #0009, inset 0 0 80px #ffffff22}
    #shop{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(98%,1120px);z-index:55;background:linear-gradient(180deg,#12243df2,#0a1a2ef2);border:2px solid #82d0ff;border-radius:18px;padding:10px}
    #towerCards{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
    .card{min-width:152px;background:linear-gradient(180deg,#375f91,#223d62);border:2px solid #a9e8ff;border-radius:14px;padding:8px;cursor:pointer;box-shadow:0 8px 14px #0007}
    .card b{display:block}
    .toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    button{background:#365a8a;border:1px solid #a9e8ff;color:#fff;border-radius:10px;padding:6px 10px;font-weight:800;cursor:pointer}
    #maps{position:absolute;right:12px;top:12px;z-index:60;display:flex;gap:6px}
    @media (max-width:850px){#hud{grid-template-columns:repeat(2,1fr);top:54px}.shell{padding:6px}.back{top:8px}canvas{height:66vh}}
  </style>
</head>
<body>
<div class="shell">
  <a class="back" href="../../index.php">← Voltar</a>
  <div id="maps"></div>
  <div id="hud">
    <div id="hLife" class="chip"></div><div id="hCash" class="chip"></div><div id="hWave" class="chip"></div><div id="hMap" class="chip"></div><div id="hBoss" class="chip"></div>
  </div>
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="shop"><div class="toprow"><strong>Loja de Torres Premium</strong><small>toque no terreno para posicionar</small></div><div id="towerCards"></div></div>
</div>
<script>
(()=>{const cvs=game,ctx=cvs.getContext('2d');const HUD={life:hLife,cash:hCash,wave:hWave,map:hMap,boss:hBoss};
const maps=[{n:'Floresta Encantada',bg:['#7ee4ff','#3d9bd0','#2a6445'],path:[{x:-20,y:620},{x:180,y:560},{x:270,y:430},{x:470,y:410},{x:540,y:230},{x:760,y:180},{x:920,y:290},{x:1160,y:260},{x:1320,y:320}]},{n:'Ruínas Vulcânicas',bg:['#ffb377','#b4472b','#3e2020'],path:[{x:-20,y:430},{x:170,y:370},{x:260,y:520},{x:430,y:580},{x:610,y:470},{x:700,y:300},{x:930,y:250},{x:1080,y:360},{x:1320,y:340}]}];
const towers=[{k:'ice',n:'Torre de Gelo',e:'❄️',c:80,col:'#96e5ff',d:11,r:180,rt:34,sp:11},{k:'poison',n:'Torre de Veneno',e:'☣️',c:90,col:'#8dff75',d:8,r:175,rt:20,sp:9},{k:'wind',n:'Torre de Vento',e:'🌪️',c:100,col:'#d8ecff',d:9,r:220,rt:28,sp:10},{k:'electric',n:'Torre Elétrica',e:'⚡',c:140,col:'#d8b3ff',d:30,r:230,rt:44,sp:16},{k:'fire',n:'Torre de Fogo',e:'🔥',c:110,col:'#ff9d5f',d:16,r:190,rt:26,sp:10},{k:'water',n:'Torre de Água',e:'💧',c:95,col:'#7dd9ff',d:14,r:200,rt:24,sp:10},{k:'explosive',n:'Torre Explosiva',e:'💣',c:170,col:'#ffd374',d:45,r:175,rt:52,sp:8}];
let mapId=0,life=260,cash=280,wave=1,spawnTimer=0,spawnLeft=0,boss=null,selected=towers[0],mode='play';const placed=[],enemies=[],bullets=[],particles=[];
const ac=new (AudioContext||webkitAudioContext)();const tone=(f,d,t='sine',v=.06)=>{if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.value=.0001;const n=ac.currentTime;g.gain.exponentialRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.start();o.stop(n+d+.02)};
function startWave(){spawnLeft=8+wave*2+(wave%5===0?4:0);spawnTimer=20;if(wave%6===0)boss={hp:1400+wave*130,max:1400+wave*130};}
function spawnEnemy(){const p=maps[mapId].path[0];const elite=Math.random()<.2;enemies.push({x:p.x,y:p.y,seg:0,hp:elite?140+wave*26:95+wave*18,max:elite?140+wave*26:95+wave*18,s:elite?1.5:2.2,elite,anim:Math.random()*10,poison:0,burn:0,slow:0});}
function buildShop(){towerCards.innerHTML='';towers.forEach(t=>{const c=document.createElement('button');c.className='card';c.innerHTML=`<b>${t.e} ${t.n}</b><small>${t.c}💰 • Alc ${t.r}</small>`;c.onclick=()=>selected=t;towerCards.appendChild(c)});}
function drawWorld(){const m=maps[mapId],g=ctx.createLinearGradient(0,0,0,720);g.addColorStop(0,m.bg[0]);g.addColorStop(.5,m.bg[1]);g.addColorStop(1,m.bg[2]);ctx.fillStyle=g;ctx.fillRect(0,0,1280,720);for(let i=0;i<180;i++){ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.arc((i*89)%1280,(i*47)%720,2+((i*7)%3),0,7);ctx.fill();}
ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=94;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(m.path[0].x,m.path[0].y);m.path.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();ctx.strokeStyle='#d8ae79';ctx.lineWidth=78;ctx.stroke();ctx.strokeStyle='#f4d7ac';ctx.lineWidth=55;ctx.setLineDash([15,9]);ctx.stroke();ctx.setLineDash([]);
}
function drawTower(t){ctx.save();ctx.translate(t.x,t.y);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,24,30,11,0,0,7);ctx.fill();ctx.fillStyle='#7f5d39';ctx.beginPath();ctx.roundRect(-20,-4,40,30,10);ctx.fill();ctx.fillStyle='#243750';ctx.beginPath();ctx.roundRect(-17,-22,34,24,8);ctx.fill();ctx.shadowBlur=14;ctx.shadowColor=t.col;ctx.strokeStyle=t.col;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-10,12,0,7);ctx.stroke();ctx.shadowBlur=0;ctx.font='22px serif';ctx.fillText(t.e,-12,-2);ctx.restore();}
function drawEnemy(z){ctx.save();ctx.translate(z.x,z.y+Math.sin(z.anim)*2);ctx.scale(z.elite?1.22:1, z.elite?1.22:1);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,30,20,8,0,0,7);ctx.fill();ctx.fillStyle='#35424f';ctx.beginPath();ctx.roundRect(-14,-22,28,48,8);ctx.fill();ctx.fillStyle='#a4bb8f';ctx.beginPath();ctx.roundRect(-15,-44,30,24,9);ctx.fill();ctx.fillStyle='#ffef86';ctx.shadowBlur=8;ctx.shadowColor='#ffe761';ctx.beginPath();ctx.arc(-6,-34,4,0,7);ctx.arc(6,-33,4,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#2d1a11';ctx.fillRect(-7,-27,14,4);if(z.poison>0){ctx.strokeStyle='#82ff67';ctx.strokeRect(-20,-50,40,80);}ctx.restore();}
function update(){if(mode!=='play')return;spawnTimer--;if(spawnLeft>0&&spawnTimer<=0){spawnEnemy();spawnLeft--;spawnTimer=20;}if(spawnLeft===0&&enemies.length===0){wave++;cash+=85;startWave();}
placed.forEach(t=>{t.cd--;if(t.cd>0)return;const target=enemies.find(e=>Math.hypot(e.x-t.x,e.y-t.y)<t.r);if(!target)return;t.cd=t.rt;if(t.k==='electric'){target.hp-=t.d;particles.push({k:'bolt',x:target.x,y:target.y,life:8});tone(890,.08,'square',.08);} else {bullets.push({x:t.x,y:t.y,t:target,d:t.d,s:t.sp,k:t.k,col:t.col});tone(330+Math.random()*420,.06,'triangle',.05);}});
for(const b of bullets){if(!b.t||b.t.hp<=0){b.dead=1;continue;}const dx=b.t.x-b.x,dy=b.t.y-b.y,dd=Math.hypot(dx,dy);if(dd<b.s+8){if(b.k==='explosive'){enemies.forEach(e=>{if(Math.hypot(e.x-b.t.x,e.y-b.t.y)<80)e.hp-=b.d});particles.push({k:'boom',x:b.t.x,y:b.t.y,life:20});tone(120,.2,'sawtooth',.1);}else{b.t.hp-=b.d;if(b.k==='poison')b.t.poison=90;if(b.k==='fire')b.t.burn=80;if(b.k==='ice')b.t.slow=60;}b.dead=1;}else{b.x+=dx/dd*b.s;b.y+=dy/dd*b.s;}}
for(const z of enemies){z.anim+=.24;if(z.poison>0){z.poison--;z.hp-=.35;}if(z.burn>0){z.burn--;z.hp-=.55;particles.push({k:'fire',x:z.x+(Math.random()*16-8),y:z.y-16,life:10});}const p=maps[mapId].path[z.seg+1];if(!p){life-=22;z.dead=1;continue;}const slow=z.slow>0?(z.slow--,.45):1;const sp=z.s*slow,dx=p.x-z.x,dy=p.y-z.y,dd=Math.hypot(dx,dy);if(dd<sp){z.x=p.x;z.y=p.y;z.seg++;}else{z.x+=dx/dd*sp;z.y+=dy/dd*sp;}if(z.hp<=0){z.dead=1;cash+=z.elite?24:16;}}
if(boss){boss.hp-=enemies.filter(e=>e.dead).length*2;if(boss.hp<=0)boss=null;}
[bullets,enemies,particles].forEach(arr=>{for(let i=arr.length-1;i>=0;i--)if(arr[i].dead||(--arr[i].life===0))arr.splice(i,1)});
if(life<=0)mode='end';HUD.life.textContent=`❤️ Base ${Math.max(0,life)}`;HUD.cash.textContent=`💰 ${cash}`;HUD.wave.textContent=`🌊 Onda ${wave}`;HUD.map.textContent=`🗺️ ${maps[mapId].n}`;HUD.boss.textContent=boss?`👹 Chefão ${Math.round(100*boss.hp/boss.max)}%`:'👹 Sem chefão';}
function draw(){drawWorld();placed.forEach(drawTower);bullets.forEach(b=>{ctx.fillStyle=b.col;ctx.shadowColor=b.col;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(b.x,b.y,6,0,7);ctx.fill();ctx.shadowBlur=0});particles.forEach(p=>{if(p.k==='boom'){ctx.fillStyle='rgba(255,170,70,.4)';ctx.beginPath();ctx.arc(p.x,p.y,40-p.life,0,7);ctx.fill();}if(p.k==='bolt'){ctx.strokeStyle='rgba(210,245,255,.9)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x,-20);ctx.lineTo(p.x+8,p.y);ctx.stroke();}if(p.k==='fire'){ctx.fillStyle='rgba(255,120,40,.7)';ctx.beginPath();ctx.arc(p.x,p.y,5,0,7);ctx.fill();}});enemies.forEach(drawEnemy);if(boss){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(220,20,840,22);ctx.fillStyle='#ff5874';ctx.fillRect(220,20,840*(boss.hp/boss.max),22);ctx.strokeStyle='#ffd9e0';ctx.strokeRect(220,20,840,22);}if(mode==='end'){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,1280,720);ctx.fillStyle='#fff';ctx.font='bold 72px Arial';ctx.fillText('GAME OVER',430,350);ctx.font='28px Arial';ctx.fillText('Toque para reiniciar',500,400);}}
cvs.onclick=e=>{if(mode==='end')return location.reload();const r=cvs.getBoundingClientRect(),x=(e.clientX-r.left)*1280/r.width,y=(e.clientY-r.top)*720/r.height;if(cash<selected.c)return;placed.push({...selected,x,y,cd:0});cash-=selected.c;};
maps.forEach((m,i)=>{const b=document.createElement('button');b.textContent=`${i+1}`;b.title=m.n;b.onclick=()=>{mapId=i;placed.length=enemies.length=bullets.length=particles.length=0;life=260;cash=280;wave=1;boss=null;startWave();};maps.appendChild(b)});
buildShop();startWave();(function loop(){update();draw();requestAnimationFrame(loop)})();})();
</script>
</body>
</html>
