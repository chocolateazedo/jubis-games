<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bate Martelo Arcade 3D — Jubis Games</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;overflow:hidden;background:radial-gradient(circle at top,#24114d,#090916);font-family:Arial,sans-serif;color:#fff;touch-action:manipulation}a{position:fixed;top:14px;left:14px;color:#00f0ff;font-weight:bold;text-decoration:none;z-index:20}.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}.screen.active{display:flex}h1{font-size:clamp(26px,5vw,52px);color:#c2ff3d;text-shadow:0 0 12px #c2ff3d,4px 4px 0 #7a3dff}button{border:0;border-radius:999px;padding:14px 24px;background:linear-gradient(135deg,#00f0ff,#ff2bd6);font-size:18px;font-weight:800;cursor:pointer}#game{position:fixed;inset:0;display:none}#game.active{display:block}.hud{position:absolute;top:52px;left:10px;right:10px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;z-index:10}.hud div{background:rgba(0,0,0,.45);padding:10px 14px;border-radius:14px;border:2px solid rgba(0,240,255,.4)}.world{position:absolute;left:50%;top:56%;width:min(92vw,620px);height:min(68vh,620px);transform:translate(-50%,-50%) perspective(760px) rotateX(18deg);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:14px;padding:20px;border-radius:30px;border:5px solid #00f0ff;background:linear-gradient(135deg,#18356b,#401069);box-shadow:0 0 30px rgba(0,240,255,.4),0 26px 0 #050517}.hole{position:relative;border-radius:50%;overflow:hidden;background:radial-gradient(circle,#050517,#160b2e 60%,#000);cursor:pointer}.animal{position:absolute;left:50%;bottom:-75%;width:76%;height:86%;transform:translateX(-50%);border-radius:50% 50% 42% 42%;background:linear-gradient(#c98645,#8a4a20);transition:bottom .14s ease-out,transform .08s}.animal.show{bottom:-10%}.animal.hit{transform:translateX(-50%) scale(.88) rotate(-8deg)}.animal.gold{background:linear-gradient(#fff56d,#ffae00);box-shadow:0 0 20px #ffd23f}.animal:before,.animal:after{content:"";position:absolute;top:16%;width:24%;height:24%;border-radius:50%;background:#5b2b12}.animal:before{left:13%}.animal:after{right:13%}.face{position:absolute;left:50%;top:32%;width:58%;height:42%;transform:translateX(-50%);border-radius:50%;background:#f6c27a}.face:before,.face:after{content:"";position:absolute;top:25%;width:12px;height:12px;border-radius:50%;background:#111}.face:before{left:22%}.face:after{right:22%}.nose{position:absolute;left:50%;top:55%;width:18px;height:12px;transform:translateX(-50%);border-radius:50%;background:#44200e}#hammer{position:fixed;width:90px;height:90px;pointer-events:none;z-index:99;transform:translate(-45px,-45px) rotate(-25deg);display:none}.swing{transform:translate(-45px,-45px) rotate(30deg) scale(1.05)!important}.hammer-head{position:absolute;width:58px;height:32px;background:linear-gradient(#fff,#777);border-radius:10px;left:5px;top:5px}.hammer-stick{position:absolute;width:18px;height:72px;background:linear-gradient(#ffd23f,#8a4a20);border-radius:10px;left:49px;top:20px;transform:rotate(-35deg)}.combo{position:fixed;left:50%;top:110px;transform:translateX(-50%);background:linear-gradient(135deg,#ffd23f,#ff2bd6);padding:12px 22px;border-radius:20px;font-weight:900;color:#111;animation:fade 1s forwards;z-index:100}@keyframes fade{0%{opacity:0;transform:translateX(-50%) scale(.5)}20%{opacity:1;transform:translateX(-50%) scale(1.1)}100%{opacity:0;transform:translateX(-50%) scale(.9)}}.pop{position:fixed;font-size:28px;font-weight:900;pointer-events:none;animation:up .7s forwards}@keyframes up{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-120%)}}
</style>
</head>
<body>
<a href="../../">← Voltar</a>
<div id="menu" class="screen active"><h1>Bate Martelo Arcade 3D</h1><p>Faça combos e bata seu recorde.</p><button id="play">Jogar</button><p>Recorde: <span id="menuBest">0</span></p></div>
<div id="over" class="screen"><h1>Tempo acabou!</h1><p id="final"></p><p id="record"></p><button id="again">Reiniciar</button><button id="back">Menu</button></div>
<div id="game"><div class="hud"><div>Pontos: <span id="score">0</span></div><div>Tempo: <span id="time">45</span></div><div>Recorde: <span id="best">0</span></div></div><div class="world" id="world"></div></div>
<div id="hammer"><div class="hammer-stick"></div><div class="hammer-head"></div></div>
<script>
const menu=document.getElementById('menu'),game=document.getElementById('game'),over=document.getElementById('over'),world=document.getElementById('world'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),menuBest=document.getElementById('menuBest'),final=document.getElementById('final'),record=document.getElementById('record'),hammer=document.getElementById('hammer');let score=0,time=45,combo=0,best=+localStorage.getItem('bm3d_best')||0,running=false,spawnTimer,clockTimer,speed=900,comboTimeout;menuBest.textContent=best;bestEl.textContent=best;document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;document.getElementById('back').onclick=goMenu;function board(){world.innerHTML='';for(let i=0;i<9;i++){const h=document.createElement('div');h.className='hole';const a=document.createElement('div');a.className='animal';a.dataset.active='false';const f=document.createElement('div');f.className='face';const n=document.createElement('div');n.className='nose';f.appendChild(n);a.appendChild(f);h.appendChild(a);h.onpointerdown=e=>hit(e,a);world.appendChild(h)}}function start(){score=0;time=45;combo=0;speed=900;running=true;scoreEl.textContent=0;timeEl.textContent=45;menu.classList.remove('active');over.classList.remove('active');game.classList.add('active');hammer.style.display='block';clearInterval(spawnTimer);clearInterval(clockTimer);board();spawn();spawnTimer=setInterval(spawn,speed);clockTimer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)end();if(time%10===0&&speed>430){speed-=90;clearInterval(spawnTimer);spawnTimer=setInterval(spawn,speed)}},1000)}function spawn(){if(!running)return;const animals=[...document.querySelectorAll('.animal')].filter(a=>a.dataset.active==='false');if(!animals.length)return;const a=animals[Math.floor(Math.random()*animals.length)];a.classList.remove('gold','hit');if(Math.random()<.22)a.classList.add('gold');a.dataset.active='true';a.classList.add('show');setTimeout(()=>hide(a),Math.max(420,speed-80+Math.random()*420))}function hide(a){a.classList.remove('show','hit');a.dataset.active='false'}function hit(e,a){move(e.clientX,e.clientY,true);if(a.dataset.active!=='true'){combo=0;return}combo++;clearTimeout(comboTimeout);comboTimeout=setTimeout(()=>combo=0,1400);const mult=Math.min(6,1+combo*.2),gain=Math.floor((a.classList.contains('gold')?10:2)*mult);score+=gain;scoreEl.textContent=score;a.classList.add('hit');pop(e.clientX,e.clientY,'+'+gain,a.classList.contains('gold')?'#ffd23f':'#fff');if(combo>=2)blast(combo,mult);hide(a)}function end(){running=false;clearInterval(spawnTimer);clearInterval(clockTimer);hammer.style.display='none';if(score>best){best=score;localStorage.setItem('bm3d_best',best)}menuBest.textContent=best;bestEl.textContent=best;final.textContent='Pontuação: '+score;record.textContent='Recorde: '+best;game.classList.remove('active');over.classList.add('active')}function goMenu(){running=false;clearInterval(spawnTimer);clearInterval(clockTimer);hammer.style.display='none';game.classList.remove('active');over.classList.remove('active');menu.classList.add('active')}function move(x,y,s){hammer.style.left=x+'px';hammer.style.top=y+'px';if(s){hammer.classList.add('swing');setTimeout(()=>hammer.classList.remove('swing'),90)}}document.addEventListener('pointermove',e=>running&&move(e.clientX,e.clientY));function pop(x,y,t,c){const p=document.createElement('div');p.className='pop';p.textContent=t;p.style.left=x+'px';p.style.top=y+'px';p.style.color=c;document.body.appendChild(p);setTimeout(()=>p.remove(),700)}function blast(c,m){document.querySelectorAll('.combo').forEach(e=>e.remove());const b=document.createElement('div');b.className='combo';b.textContent='COMBO '+c+'x • '+m.toFixed(1)+'x';document.body.appendChild(b);setTimeout(()=>b.remove(),1000)}
</script>
</body>
</html>
