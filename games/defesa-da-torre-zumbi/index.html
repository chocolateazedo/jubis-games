<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Defesa da Torre Zumbi — Cartoon Premium</title>
  <style>
    :root{
      --sky:#0b1d35;--ink:#eef9ff;--line:#9feaff;--panel:#102744ea;--panel2:#1f4068ee;
      --gold:#ffdc7d;--ok:#9cff9f;--danger:#ff8ea0;--deep:#040b16;
      --shadow:0 16px 40px #0009,inset 0 2px 0 #ffffff4a;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 40% -40%,#2a5688,#0b1c34 45%,#060d18 100%);font-family:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink)}
    .frame{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));}
    .hud{display:grid;grid-template-columns:1.1fr repeat(5,1fr) auto;gap:8px;z-index:10}
    .ui{border:2px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:var(--shadow);text-shadow:0 2px 0 #001326;font-weight:900}
    .back{padding:10px 12px;color:#fff;text-decoration:none;text-align:center}
    .chip{padding:8px 10px;white-space:nowrap}
    .badge{grid-column:1/-1;padding:8px 12px}
    .worlds{display:flex;gap:6px}
    .worldBtn{min-width:44px;padding:8px;color:#fff;cursor:pointer}
    canvas{width:100%;height:100%;display:block;border:3px solid #86deff;border-radius:22px;box-shadow:0 24px 80px #000c,inset 0 0 90px #fff2;background:#0f2744}

    .shop{z-index:10;border:2px solid #abecff;border-radius:18px;padding:10px;background:linear-gradient(180deg,#152e4ef2,#0d2038f2);box-shadow:var(--shadow)}
    .shopHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-weight:900}
    .cards{display:flex;gap:10px;overflow:auto;padding:2px 2px 6px}
    .card{min-width:210px;border:2px solid #b7f0ff;border-radius:16px;padding:10px;color:#fff;background:
      radial-gradient(circle at 75% 10%,#ffffff2f 0 30%,transparent 32%),
      linear-gradient(180deg,#3e6da6,#274669);
      box-shadow:0 12px 24px #0009,inset 0 2px 0 #fff5;cursor:pointer;position:relative;}
    .card.sel{outline:3px solid #ffe59b;transform:translateY(-2px)}
    .iconWrap{display:flex;justify-content:space-between;align-items:flex-start}
    .icon{font-size:34px;filter:drop-shadow(0 4px 0 #00142f)}
    .tier{font-size:.75rem;padding:3px 8px;border-radius:999px;border:1px solid #fff7;background:#0003}
    .mini{display:flex;justify-content:space-between;font-size:.84rem;opacity:.95}
    .stat{margin-top:2px;border-top:1px dashed #ffffff5e;padding-top:4px}

    @media (max-width:980px){
      .hud{grid-template-columns:repeat(3,1fr)}
      .worlds{grid-column:span 2;justify-content:flex-end}
      .card{min-width:170px}
      .frame{gap:7px;padding:calc(6px + env(safe-area-inset-top)) 6px calc(6px + env(safe-area-inset-bottom))}
    }
  </style>
</head>
<body>
<div class="frame">
  <div class="hud">
    <a class="ui back" href="../../index.php">← Voltar</a>
    <div id="hLife" class="ui chip"></div><div id="hGold" class="ui chip"></div><div id="hWave" class="ui chip"></div><div id="hWorld" class="ui chip"></div><div id="hBoss" class="ui chip"></div>
    <div id="worldBtns" class="worlds"></div>
    <div class="ui badge">🎯 Referência visual ID: <b>2ca166e5-d4cc-4855-ae66-a0b3e18ed420</b> • Menu, gameplay, inimigos, caminho, grama e torres refinados</div>
  </div>
  <canvas id="game" width="1600" height="900"></canvas>
  <div class="shop">
    <div class="shopHead"><span>🛒 Arsenal de Defesa</span><small>Selecione uma torre e toque na grama para construir</small></div>
    <div id="towerCards" class="cards"></div>
  </div>
</div>
<script>
(()=>{
const REFERENCE_IMAGE_ID='2ca166e5-d4cc-4855-ae66-a0b3e18ed420';
const cvs=game,ctx=cvs.getContext('2d');
const HUD={life:hLife,gold:hGold,wave:hWave,world:hWorld,boss:hBoss};
const worlds=[
 {n:'Bosque Neon',sky:['#90e3ff','#4e95ca','#24533f'],grass:['#5fbf72','#469b59'],path:[{x:-30,y:760},{x:210,y:700},{x:310,y:555},{x:540,y:530},{x:690,y:350},{x:920,y:325},{x:1110,y:430},{x:1400,y:390},{x:1640,y:450}]},
 {n:'Pântano Lunar',sky:['#bebdff','#6273b8','#3b3156'],grass:['#77896e','#65795d'],path:[{x:-40,y:560},{x:220,y:510},{x:340,y:680},{x:560,y:730},{x:810,y:600},{x:910,y:430},{x:1140,y:360},{x:1320,y:470},{x:1640,y:430}]},
 {n:'Ruínas de Lava',sky:['#ffc18f','#cc6240','#3f2020'],grass:['#966147','#7a4e37'],path:[{x:-20,y:700},{x:220,y:650},{x:340,y:500},{x:560,y:460},{x:760,y:580},{x:940,y:500},{x:1080,y:320},{x:1320,y:305},{x:1640,y:340}]}
];
const towers=[
 {k:'sniper',n:'Sentinela Solar',tier:'Lendária',icon:'☀️',cost:130,col:'#ffd77e',d:24,r:300,rt:44,spd:19,fx:'crit'},
 {k:'frost',n:'Obelisco Glacial',tier:'Épica',icon:'❄️',cost:110,col:'#a4edff',d:14,r:220,rt:26,spd:12,fx:'slow'},
 {k:'venom',n:'Totem Tóxico',tier:'Rara',icon:'☣️',cost:95,col:'#98ff7f',d:10,r:205,rt:19,spd:10,fx:'dot'},
 {k:'flame',n:'Canhão Dracônico',tier:'Lendária',icon:'🔥',cost:150,col:'#ff9f62',d:28,r:210,rt:34,spd:13,fx:'burn'},
 {k:'storm',n:'Torre Tempestade',tier:'Mítica',icon:'⚡',cost:180,col:'#dcb5ff',d:36,r:250,rt:41,spd:16,fx:'chain'}
];
let worldId=0,life=300,gold=330,wave=1,spawnLeft=0,spawnCd=0,boss=null,selected=towers[0],state='play';
const placed=[],zombies=[],shots=[],parts=[];
function mkShop(){towerCards.innerHTML='';towers.forEach(t=>{const b=document.createElement('button');b.className='card'+(selected===t?' sel':'');b.innerHTML=`<div class='iconWrap'><span class='icon'>${t.icon}</span><span class='tier'>${t.tier}</span></div><b>${t.n}</b><div class='mini'><span>${t.cost} 💰</span><span>Alc ${t.r}</span></div><div class='mini stat'><span>Dano ${t.d}</span><span>Rec ${t.rt}</span></div>`;b.onclick=()=>{selected=t;mkShop();};towerCards.appendChild(b);});}
function mkWorlds(){worldBtns.innerHTML='';worlds.forEach((w,i)=>{const bt=document.createElement('button');bt.className='ui worldBtn';bt.textContent=i+1;bt.title=w.n;bt.onclick=()=>reset(i);worldBtns.appendChild(bt)});}
function reset(i=worldId){worldId=i;life=300;gold=330;wave=1;boss=null;spawnLeft=0;spawnCd=0;placed.length=zombies.length=shots.length=parts.length=0;state='play';startWave();}
function startWave(){spawnLeft=9+wave*2+(wave%4===0?5:0);spawnCd=17;if(wave%5===0)boss={hp:1800+wave*170,max:1800+wave*170};}
function spawnZ(){const p=worlds[worldId].path[0],elite=Math.random()<.28,giant=wave%5===0&&Math.random()<.2;const hp=(elite?190:120)+wave*22+(giant?260:0);zombies.push({x:p.x,y:p.y,seg:0,hp,max:hp,spd:elite?1.8:2.3,elite,giant,anim:Math.random()*20,slow:0,burn:0,poison:0});}
function hit(b,z){z.hp-=b.d;if(b.k==='frost')z.slow=70;if(b.k==='venom')z.poison=95;if(b.k==='flame')z.burn=85;if(b.k==='storm'){zombies.forEach(o=>{if(o!==z&&Math.hypot(o.x-z.x,o.y-z.y)<102)o.hp-=b.d*.52});parts.push({k:'zap',x:z.x,y:z.y,life:10});}if(b.k==='sniper'&&Math.random()<.23){z.hp-=b.d;parts.push({k:'crit',x:z.x,y:z.y,life:14});}}
function update(){if(state!=='play')return;spawnCd--;if(spawnLeft>0&&spawnCd<=0){spawnZ();spawnLeft--;spawnCd=17;}if(spawnLeft===0&&zombies.length===0){wave++;gold+=95;startWave();}
for(const t of placed){if(--t.cd>0)continue;const target=zombies.find(z=>Math.hypot(z.x-t.x,z.y-t.y)<t.r);if(!target)continue;t.cd=t.rt;shots.push({x:t.x,y:t.y,t:target,d:t.d,s:t.spd,k:t.k,col:t.col});parts.push({k:'muzzle',x:t.x,y:t.y,life:10,col:t.col});}
for(const s of shots){if(!s.t||s.t.hp<=0){s.dead=1;continue;}const dx=s.t.x-s.x,dy=s.t.y-s.y,d=Math.hypot(dx,dy);if(d<s.s+8){hit(s,s.t);s.dead=1;}else{s.x+=dx/d*s.s;s.y+=dy/d*s.s;}}
for(const z of zombies){z.anim+=.25;if(z.slow>0)z.slow--;if(z.burn>0){z.burn--;z.hp-=.62;parts.push({k:'ember',x:z.x+(Math.random()*20-10),y:z.y-30,life:10});}if(z.poison>0){z.poison--;z.hp-=.46;parts.push({k:'poison',x:z.x+(Math.random()*16-8),y:z.y-18,life:12});}
const p=worlds[worldId].path[z.seg+1];if(!p){life-=z.giant?34:22;z.dead=1;continue;}const f=z.slow>0?.52:1,spd=z.spd*f,dx=p.x-z.x,dy=p.y-z.y,d=Math.hypot(dx,dy);if(d<spd){z.x=p.x;z.y=p.y;z.seg++;}else{z.x+=dx/d*spd;z.y+=dy/d*spd;}if(z.hp<=0){z.dead=1;gold+=z.giant?40:z.elite?24:16;if(boss)boss.hp-=z.giant?45:18;}}
if(boss&&boss.hp<=0)boss=null;
for(const p of parts){if(--p.life<=0)p.dead=1}
[zombies,shots,parts].forEach(a=>{for(let i=a.length-1;i>=0;i--)if(a[i].dead)a.splice(i,1)});
if(life<=0)state='end';
HUD.life.textContent=`❤️ Base ${Math.max(0,life)}`;HUD.gold.textContent=`💰 ${gold}`;HUD.wave.textContent=`🌊 Onda ${wave}`;HUD.world.textContent=`🗺️ ${worlds[worldId].n}`;HUD.boss.textContent=boss?`👹 Chefão ${Math.max(0,Math.round(100*boss.hp/boss.max))}%`:'👹 Sem chefão';HUD.boss.title=`Ref visual: ${REFERENCE_IMAGE_ID}`;
}
function drawWorld(){const w=worlds[worldId],g=ctx.createLinearGradient(0,0,0,900);g.addColorStop(0,w.sky[0]);g.addColorStop(.5,w.sky[1]);g.addColorStop(1,w.sky[2]);ctx.fillStyle=g;ctx.fillRect(0,0,1600,900);
for(let i=0;i<70;i++){ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.arc((i*93)%1600,(i*49)%360,2+((i*7)%3),0,7);ctx.fill();}
ctx.fillStyle=w.grass[0];ctx.fillRect(0,650,1600,260);
for(let i=0;i<90;i++){const x=(i*37)%1600,y=650+((i*19)%220),h=14+((i*13)%26);ctx.strokeStyle=w.grass[1];ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+4,y-h*.65,x+2,y-h);ctx.stroke();}
const p=w.path;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=110;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);p.slice(1).forEach(v=>ctx.lineTo(v.x,v.y));ctx.stroke();ctx.strokeStyle='#a8774d';ctx.lineWidth=92;ctx.stroke();ctx.strokeStyle='#edc18b';ctx.lineWidth=66;ctx.setLineDash([14,9]);ctx.stroke();ctx.setLineDash([]);
}
function drawTower(t){ctx.save();ctx.translate(t.x,t.y);ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(0,26,36,13,0,0,7);ctx.fill();ctx.fillStyle='#8f6a46';ctx.beginPath();ctx.roundRect(-24,-4,48,34,11);ctx.fill();ctx.fillStyle='#29425f';ctx.beginPath();ctx.roundRect(-22,-30,44,30,9);ctx.fill();ctx.fillStyle=t.col;ctx.shadowColor=t.col;ctx.shadowBlur=16;ctx.beginPath();ctx.arc(0,-14,12,0,7);ctx.fill();ctx.shadowBlur=0;ctx.font='26px serif';ctx.fillText(t.icon,-14,-4);ctx.restore();}
function drawZombie(z){ctx.save();ctx.translate(z.x,z.y+Math.sin(z.anim)*2);const sc=z.giant?1.7:z.elite?1.24:1;ctx.scale(sc,sc);ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(0,37,22,9,0,0,7);ctx.fill();ctx.fillStyle=z.giant?'#533737':'#425462';ctx.beginPath();ctx.roundRect(-16,-22,32,58,9);ctx.fill();ctx.fillStyle=z.giant?'#b9d391':'#a9c58f';ctx.beginPath();ctx.roundRect(-17,-49,34,30,10);ctx.fill();ctx.fillStyle='#fff179';ctx.shadowColor='#fff7a0';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(-7,-37,4,0,7);ctx.arc(7,-36,4,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#2f1c15';ctx.fillRect(-8,-28,16,5);ctx.fillStyle='rgba(255,0,0,.2)';ctx.fillRect(-18,-60,36*(z.hp/z.max),4);ctx.restore();}
function drawFx(){for(const p of parts){if(p.k==='muzzle'){ctx.fillStyle=p.col;ctx.globalAlpha=p.life/10;ctx.beginPath();ctx.arc(p.x,p.y,15-p.life*.6,0,7);ctx.fill();ctx.globalAlpha=1;}if(p.k==='ember'){ctx.fillStyle='rgba(255,128,64,.75)';ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();}if(p.k==='poison'){ctx.fillStyle='rgba(120,255,120,.5)';ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,7);ctx.fill();}if(p.k==='zap'){ctx.strokeStyle='rgba(220,244,255,.95)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x-8,p.y-30);ctx.lineTo(p.x+5,p.y);ctx.lineTo(p.x-2,p.y+15);ctx.stroke();}if(p.k==='crit'){ctx.fillStyle='rgba(255,215,90,.95)';ctx.font='bold 22px sans-serif';ctx.fillText('CRIT!',p.x-22,p.y-30);}}
}
function draw(){drawWorld();placed.forEach(drawTower);for(const s of shots){ctx.fillStyle=s.col;ctx.shadowColor=s.col;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(s.x,s.y,6,0,7);ctx.fill();ctx.shadowBlur=0;}drawFx();zombies.forEach(drawZombie);
if(boss){ctx.fillStyle='rgba(0,0,0,.52)';ctx.fillRect(250,24,1100,28);ctx.fillStyle='#ff6079';ctx.fillRect(250,24,1100*(boss.hp/boss.max),28);ctx.strokeStyle='#ffe4eb';ctx.lineWidth=2;ctx.strokeRect(250,24,1100,28);ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.fillText('CHEFÃO TITÃ',715,45);}if(state==='end'){ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,1600,900);ctx.fillStyle='#fff';ctx.font='bold 96px sans-serif';ctx.fillText('GAME OVER',515,420);ctx.font='bold 36px sans-serif';ctx.fillText('Toque para recomeçar',615,486);}}

cvs.onclick=e=>{if(state==='end')return reset(worldId);const r=cvs.getBoundingClientRect(),x=(e.clientX-r.left)*1600/r.width,y=(e.clientY-r.top)*900/r.height;if(y>690||gold<selected.cost)return;placed.push({...selected,x,y,cd:0});gold-=selected.cost;};
mkShop();mkWorlds();reset(0);(function loop(){update();draw();requestAnimationFrame(loop)})();
})();
</script>
</body>
</html>
