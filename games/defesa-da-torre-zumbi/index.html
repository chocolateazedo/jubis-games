<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Defesa da Torre de Zumbi</title>
  <style>
    :root{--lime:#b7ff63;--bg:#07110d;--card:#11251d;--gold:#ffd76a}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% -20%,#3f7f59 0%,#13261e 45%,#050b08 100%);color:#f2ffe5;min-height:100vh;display:flex;justify-content:center;padding:12px}
    .game-shell{width:min(96vw,1040px);position:relative}
    .back{position:absolute;top:10px;left:10px;z-index:99;color:#d8ffbe;text-decoration:none;font-weight:700;background:rgba(5,18,10,.82);padding:8px 10px;border:1px solid rgba(183,255,99,.55);border-radius:12px}
    #hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(94%,960px)}
    .hud-chip{background:linear-gradient(180deg,rgba(24,46,37,.9),rgba(12,28,21,.92));border:1px solid rgba(190,255,124,.4);padding:8px 12px;border-radius:999px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.35);backdrop-filter:blur(4px);animation:hudPulse 3.8s ease-in-out infinite}
    @keyframes hudPulse{0%,100%{box-shadow:0 8px 20px rgba(0,0,0,.35)}50%{box-shadow:0 12px 26px rgba(171,255,116,.28)}}
    canvas{display:block;width:100%;aspect-ratio:16/9;height:auto;border-radius:28px;border:2px solid rgba(183,255,99,.55);box-shadow:0 16px 48px rgba(0,0,0,.6),0 0 42px rgba(134,255,109,.18) inset}
    #slotInfo{margin-top:8px;text-align:center;font-weight:700;opacity:.95}
    #shopTray{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(95%,980px);z-index:60;background:linear-gradient(180deg,rgba(21,35,28,.95),rgba(12,24,18,.97));border:1px solid rgba(183,255,99,.45);border-radius:22px;padding:12px;display:none;box-shadow:0 20px 35px rgba(0,0,0,.55)}
    #shopHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
    #towerBar{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
    .tower-option{flex:0 0 132px;background:linear-gradient(180deg,#335f49,#203a2c);border:1px solid rgba(201,255,146,.5);border-radius:14px;padding:10px;cursor:pointer;color:#efffde;text-align:left}
    .tower-option small{opacity:.85;display:block}
    .tower-option:hover{transform:translateY(-2px)}
    .xbtn{background:#263d30;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:16px}
    .panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9990;background:rgba(0,0,0,.72)}
    .card{width:min(92vw,540px);background:linear-gradient(180deg,#193928,#11271c);border:1px solid rgba(156,255,107,.5);border-radius:16px;padding:16px;box-shadow:0 20px 40px rgba(0,0,0,.55);position:relative}
    .card h3{margin:6px 0 10px 0}
    .row{display:flex;justify-content:space-between;gap:8px;margin:8px 0}
    .stats-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
    .tower-big{font-size:54px;text-align:center;filter:drop-shadow(0 0 8px rgba(184,255,127,.6))}
    button{background:linear-gradient(180deg,#325d45,#234030);color:#e9ffd8;border:1px solid #9cff6b;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
    .upgrade-close{position:absolute;right:10px;top:10px}

    .zombie{
      position:absolute;
      transform:translate(-50%,-50%);
      width:auto;
      height:auto;
      display:block;
      font-size:42px;
      background:none !important;
      border:0 !important;
      border-radius:0 !important;
      box-shadow:none !important;
      filter:drop-shadow(0 0 10px #55ff77);
      animation:zombieWalk .55s infinite ease-in-out;
    }

    .zombie::before{
      content:"";
      position:absolute;
      left:50%;
      bottom:-4px;
      width:42px;
      height:12px;
      transform:translateX(-50%);
      background:#0008;
      border-radius:50%;
      filter:blur(2px);
      z-index:-1;
    }

    .zombie::after{
      display:none !important;
    }

    @keyframes zombieWalk{
      0%,100%{transform:translate(-50%,-50%) rotate(-5deg) translateY(0)}
      50%{transform:translate(-50%,-50%) rotate(5deg) translateY(-5px)}
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <a class="back" href="../../index.php">← Voltar</a>
    <div id="hud"><span id="vida" class="hud-chip"></span><span id="dinheiro" class="hud-chip"></span><span id="onda" class="hud-chip"></span><span id="towerInfo" class="hud-chip">Sem torre selecionada</span></div>
    <canvas id="game" width="960" height="540"></canvas>
    <div id="slotInfo">Toque em um slot <strong>＋</strong> para abrir a loja de torres.</div>

    <div id="shopTray">
      <div id="shopHeader"><span id="shopTitle">Escolha uma torre para construir</span><button id="closeShop" class="xbtn">✖</button></div>
      <div id="towerBar"></div>
    </div>
  </div>

  <div id="upgradePanel" class="panel"><div class="card"><button id="panelClose" class="xbtn upgrade-close">✖</button><h3>🔧 Upgrade da Torre</h3><div id="upgradeContent"></div><div class="row"><button id="panelUpgrade">⬆️ Melhorar</button><button id="panelSell">💸 Vender</button></div></div></div>
  <div id="gameOverPanel" class="panel"><div class="card" style="text-align:center;background:#000"><h2 style="font-size:52px;color:#fff">GAME OVER</h2><button id="restartBtn" style="background:#fff;color:#000;border-color:#fff">Reiniciar</button></div></div>
<script>
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
const vidaEl=document.getElementById('vida'),dinheiroEl=document.getElementById('dinheiro'),ondaEl=document.getElementById('onda'),towerInfo=document.getElementById('towerInfo');
const path=[{x:0,y:260},{x:180,y:260},{x:180,y:130},{x:420,y:130},{x:420,y:400},{x:670,y:400},{x:670,y:220},{x:960,y:220}];
const buildSlots=[{x:120,y:350},{x:250,y:190},{x:300,y:350},{x:510,y:210},{x:560,y:455},{x:730,y:320},{x:830,y:170},{x:860,y:320}];
let vida=1000,dinheiro=180,onda=1,kills=0,gameOver=false,activeSlot=-1;const MAX_TOWERS=15,MAX_TOWER_LEVEL=50;
const torres=[],zumbis=[],tiros=[],particles=[],mistParticles=[],sparkTrails=[],fx=[];let selectedTower=null,spawnLeft=0,spawnedInWave=0,spawnCooldown=0,tick=0;
for(let i=0;i<36;i++)mistParticles.push({x:Math.random()*960,y:Math.random()*540,r:16+Math.random()*32,alpha:.04+Math.random()*.06,vx:.15+Math.random()*.25,vy:-.08-Math.random()*.22});
const els={vida:vidaEl,dinheiro:dinheiroEl,onda:ondaEl,towerInfo,towerBar:document.getElementById('towerBar'),slotInfo:document.getElementById('slotInfo'),shopTray:document.getElementById('shopTray'),shopTitle:document.getElementById('shopTitle'),closeShop:document.getElementById('closeShop'),upgradePanel:document.getElementById('upgradePanel'),upgradeContent:document.getElementById('upgradeContent'),panelUpgrade:document.getElementById('panelUpgrade'),panelSell:document.getElementById('panelSell'),panelClose:document.getElementById('panelClose'),gameOverPanel:document.getElementById('gameOverPanel'),restartBtn:document.getElementById('restartBtn')};
const towerTypes=[
{key:'fire',emoji:'🔥',name:'Fogo',cost:42,range:120,dmg:10,rate:30,projSpeed:4.8,color:'#ff8f4a',core:'#5d2109'},
{key:'ice',emoji:'❄️',name:'Gelo',cost:46,range:118,dmg:2,rate:24,projSpeed:5.2,color:'#8ee7ff',core:'#0f3b52'},
{key:'water',emoji:'💧',name:'Água',cost:36,range:150,dmg:7,rate:18,projSpeed:6,color:'#6dd9ff',core:'#0f4560'},
{key:'wind',emoji:'🌪️',name:'Vento',cost:40,range:180,dmg:9,rate:28,projSpeed:6.3,color:'#dff6ff',core:'#41656f'},
{key:'venom',emoji:'☣️',name:'Veneno',cost:38,range:125,dmg:5,rate:20,projSpeed:5.5,color:'#8bff6e',core:'#29561e'},
{key:'light',emoji:'⚡',name:'Raio',cost:56,range:165,dmg:34,rate:40,projSpeed:7,color:'#fff085',core:'#74670a'}];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const audio={ctx:null,master:null};
function ensureAudio(){if(audio.ctx)return;audio.ctx=new (window.AudioContext||window.webkitAudioContext)();audio.master=audio.ctx.createGain();audio.master.gain.value=.2;audio.master.connect(audio.ctx.destination)}
function beep(type,freq,dur=.08,vol=.1){ensureAudio();const t=audio.ctx.currentTime,o=audio.ctx.createOscillator(),g=audio.ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(audio.master);o.start();o.stop(t+dur)}
const SFX={shoot:()=>beep('square',520,.05,.06),hit:()=>beep('triangle',230,.05,.05),explode:()=>{beep('sawtooth',85,.2,.12);beep('triangle',120,.15,.08)},upgrade:()=>{beep('sine',600,.08,.09);beep('sine',860,.1,.08)},sell:()=>beep('triangle',300,.09,.08),boss:()=>{beep('sawtooth',120,.2,.11);setTimeout(()=>beep('sawtooth',95,.25,.11),80)},baseHit:()=>beep('square',150,.1,.1),gameOver:()=>{beep('sawtooth',180,.3,.13);setTimeout(()=>beep('sawtooth',100,.4,.1),140)},click:()=>beep('sine',700,.03,.05)};
function waveStats(w){return{amount:9+w*3,hp:100+(w-1)*10,speed:1+w*.06,spawnGap:Math.max(10,30-w),reward:18+w*4}};
function startWave(){const s=waveStats(onda);spawnLeft=s.amount;spawnedInWave=0;spawnCooldown=1;}
function spawnZombie(){const s=waveStats(onda),isBoss=onda%15===0&&spawnedInWave===0;const kinds=['normal','fast','tank','explosive'];let type=isBoss?'boss':kinds[spawnedInWave%kinds.length];
let mult={normal:1,fast:.75,tank:2.2,explosive:1.2,boss:8}[type],spd={normal:1,fast:1.8,tank:.65,explosive:1.2,boss:.45}[type];
zumbis.push({x:path[0].x,y:path[0].y,seg:0,type,isBoss,hp:Math.floor(s.hp*mult),maxHp:Math.floor(s.hp*mult),speed:s.speed*spd,reward:Math.floor(s.reward*mult*1.2),dead:false,step:Math.random()*6,hitFlash:0,deathAnim:0,deathScale:1,deadDone:false}); if(isBoss)SFX.boss(); spawnedInWave++;}
const towerUpgradeCost=t=>20+t.level*18; const towerSellValue=t=>Math.max(1,Math.round(t.totalCost*.74*(1+(t.level-1)*.025)));
function nextTowerStats(t){return{dmg:Math.round((t.dmg+3)*1.05),range:t.range+7,rate:Math.max(8,Math.round(t.rate*.95))}}
function upgradeTower(t){const c=towerUpgradeCost(t);if(t.level>=MAX_TOWER_LEVEL||dinheiro<c)return false;const n=nextTowerStats(t);dinheiro-=c;t.totalCost+=c;t.level++;t.dmg=n.dmg;t.range=n.range;t.rate=n.rate;SFX.upgrade();return true}
function updateHUD(){els.vida.textContent=`❤️ ${Math.max(0,Math.round(vida))}/1000`;els.dinheiro.textContent=`💰 ${dinheiro}`;els.onda.textContent=`🌊 Onda ${onda} • ☠️ ${kills}`;els.towerInfo.textContent=selectedTower?`${selectedTower.label} Lv ${selectedTower.level}`:'Sem torre selecionada';}
function openShop(slotIndex){activeSlot=slotIndex;els.shopTray.style.display='block';els.shopTitle.textContent=`Construir no slot ${slotIndex+1}`;renderBar();}
function closeShop(){activeSlot=-1;els.shopTray.style.display='none';}
function renderBar(){els.towerBar.innerHTML='';towerTypes.forEach((t)=>{const b=document.createElement('button');b.className='tower-option';b.innerHTML=`<strong>${t.emoji} ${t.name}</strong><small>${t.cost}💰 • alcance ${t.range}</small>`;b.onclick=()=>{SFX.click();buildTowerInSlot(t)};els.towerBar.appendChild(b);});}
function buildTowerInSlot(type){if(activeSlot<0||torres.length>=MAX_TOWERS||dinheiro<type.cost)return;const slot=buildSlots[activeSlot];if(torres.some(t=>t.slot===activeSlot))return;const t={x:slot.x,y:slot.y,slot:activeSlot,range:type.range,dmg:type.dmg,rate:type.rate,cd:0,level:1,type:type.key,label:`${type.emoji} ${type.name}`,emoji:type.emoji,name:type.name,color:type.color,core:type.core,projSpeed:type.projSpeed,totalCost:type.cost};torres.push(t);dinheiro-=type.cost;selectedTower=t;closeShop();}
function makeExplosion(x,y,isBoss=false){const qtd=isBoss?24:12;for(let i=0;i<qtd;i++){const ang=Math.random()*Math.PI*2,sp=1+Math.random()*3+(isBoss?1.5:0);particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:28+Math.random()*20,size:2+Math.random()*4,dead:false,color:isBoss?'#ff63ba':'#a4ff70'})}SFX.explode()}
function openUpgradePanel(t){selectedTower=t;renderUpgradePanel();els.upgradePanel.style.display='flex'}
function renderUpgradePanel(){if(!selectedTower)return;const t=selectedTower,n=nextTowerStats(t),c=towerUpgradeCost(t);els.upgradeContent.innerHTML=`<div class='tower-big'>${t.emoji}</div>
<div class='row'><strong>${t.name}</strong><strong>Nível ${t.level}</strong></div>
<div class='stats-grid'><span>Dano</span><strong>${t.dmg}</strong><strong>→ ${n.dmg}</strong></div>
<div class='stats-grid'><span>Range</span><strong>${t.range}</strong><strong>→ ${n.range}</strong></div>
<div class='stats-grid'><span>Tempo tiro</span><strong>${t.rate}</strong><strong>→ ${n.rate}</strong></div>
<div class='row'><span>Upgrade</span><strong>${c}💰</strong></div>
<div class='row'><span>Vender</span><strong>${towerSellValue(t)}💰</strong></div>`;}
function update(){if(gameOver)return;tick++;spawnCooldown--;if(spawnLeft>0&&spawnCooldown<=0){spawnZombie();spawnLeft--;spawnCooldown=waveStats(onda).spawnGap;}if(spawnLeft===0&&zumbis.length===0){dinheiro+=30+onda*8;onda++;startWave();}
for(const t of torres){t.cd--;if(t.cd<=0){const a=zumbis.find(z=>!z.dead&&dist(z,t)<=t.range);if(a){
const base={x:t.x,y:t.y,target:a,dmg:t.dmg,speed:t.projSpeed,effect:t.type,life:0};
if(t.type==='water'){for(let i=0;i<3;i++)tiros.push({...base,spread:(i-1)*8,delay:i*2});}
else tiros.push(base);
if(t.type==='light'){a.hp-=t.dmg;a.hitFlash=1;fx.push({type:'lightning',x:a.x,y:a.y,life:7});tiros.push({x:a.x,y:0,target:a,dmg:0,speed:0,effect:'light',life:0,dead:true});SFX.hit();}
if(t.type==='fire'){a.burnTime=Math.max(a.burnTime||0,140);a.burnDps=Math.max(a.burnDps||0,0.22+t.dmg*0.02);}
if(t.type==='ice'){a.freezeTime=Math.max(a.freezeTime||0,42);a.slowTime=Math.max(a.slowTime||0,56);a.slowFactor=Math.min(a.slowFactor||1,0.18);}
if(t.type==='venom'){a.poisonTime=Math.max(a.poisonTime||0,150);a.poisonDps=Math.max(a.poisonDps||0,0.16+t.dmg*0.015);a.slowTime=Math.max(a.slowTime||0,90);a.slowFactor=Math.min(a.slowFactor||1,0.62);fx.push({type:'gas',x:a.x,y:a.y,life:24});}
if(t.type==='wind'){fx.push({type:'tornado',x:t.x,y:t.y,tx:a.x,ty:a.y,life:20,spin:0});}
sparkTrails.push({x:t.x,y:t.y,life:16,color:t.color,size:12});t.cd=t.rate;SFX.shoot();}}}
for(const pr of tiros){pr.life=(pr.life||0)+1;if(pr.delay&&pr.delay>0){pr.delay--;continue;}if(!pr.target||pr.target.dead){pr.dead=true;continue;}const tx=pr.target.x+(pr.spread||0),ty=pr.target.y+(pr.spread||0)*0.35;const dx=tx-pr.x,dy=ty-pr.y,d=Math.hypot(dx,dy);if(d<pr.speed+4){if(pr.effect!=='light'){pr.target.hp-=pr.dmg;pr.target.hitFlash=1;}
if(pr.effect==='fire'){pr.target.burnTime=Math.max(pr.target.burnTime||0,120);pr.target.burnDps=Math.max(pr.target.burnDps||0,0.22+pr.dmg*0.02);fx.push({type:'fire',x:pr.target.x,y:pr.target.y,life:22});}
if(pr.effect==='ice'){pr.target.freezeTime=Math.max(pr.target.freezeTime||0,40);pr.target.slowTime=Math.max(pr.target.slowTime||0,60);pr.target.slowFactor=Math.min(pr.target.slowFactor||1,0.2);fx.push({type:'ice',x:pr.target.x,y:pr.target.y,life:20});}
if(pr.effect==='venom'){pr.target.poisonTime=Math.max(pr.target.poisonTime||0,140);pr.target.poisonDps=Math.max(pr.target.poisonDps||0,0.18+pr.dmg*0.01);pr.target.slowTime=Math.max(pr.target.slowTime||0,70);pr.target.slowFactor=Math.min(pr.target.slowFactor||1,0.65);fx.push({type:'gas',x:pr.target.x,y:pr.target.y,life:24});}
if(pr.effect==='water')fx.push({type:'drop',x:pr.target.x,y:pr.target.y,life:16});
if(pr.effect==='wind')fx.push({type:'tornado',x:pr.x,y:pr.y,tx:pr.target.x,ty:pr.target.y,life:18,spin:0});
pr.dead=true;SFX.hit();} else {pr.x+=dx/d*pr.speed;pr.y+=dy/d*pr.speed;}}
for(const z of zumbis){z.step+=0.22;z.hitFlash=Math.max(0,z.hitFlash-0.06);z.burnTime=Math.max(0,(z.burnTime||0)-1);z.poisonTime=Math.max(0,(z.poisonTime||0)-1);z.freezeTime=Math.max(0,(z.freezeTime||0)-1);z.slowTime=Math.max(0,(z.slowTime||0)-1);if(z.burnTime>0){z.hp-=(z.burnDps||0.2);if(tick%8===0)fx.push({type:'fire',x:z.x,y:z.y,life:14});}if(z.poisonTime>0){z.hp-=(z.poisonDps||0.14);if(tick%10===0)fx.push({type:'gas',x:z.x,y:z.y,life:16});}if(z.freezeTime>0&&tick%12===0)fx.push({type:'ice',x:z.x,y:z.y,life:14});if(z.dead){if(z.deathAnim>0){z.deathAnim=Math.max(0,z.deathAnim-0.03);z.deathScale*=0.94;if(z.deathAnim===0)z.deadDone=true;}continue;}const nxt=path[z.seg+1];if(!nxt){z.dead=true;z.deadDone=true;vida-=Math.max(1,Math.round(z.hp));SFX.baseHit();continue;}const moveScale=z.freezeTime>0?0.06:(z.slowTime>0?(z.slowFactor||0.7):1);const v=Math.max(.12,z.speed*moveScale);const dx=nxt.x-z.x,dy=nxt.y-z.y,d=Math.hypot(dx,dy);if(d<v){z.x=nxt.x;z.y=nxt.y;z.seg++;}else{z.x+=dx/d*v;z.y+=dy/d*v;}if(z.hp<=0&&!z.dead){z.dead=true;z.deathAnim=1;z.deathScale=1;kills++;dinheiro+=z.reward;makeExplosion(z.x,z.y,z.isBoss);} }
for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.life--;if(p.life<=0)p.dead=true;}
for(const m of mistParticles){m.x+=m.vx;m.y+=m.vy; if(m.x>990)m.x=-40; if(m.y<-40){m.y=580;m.x=Math.random()*960;}}
for(const s of sparkTrails){s.life--;s.size*=.93;if(s.life<=0)s.dead=true;}
for(const e of fx){e.life--;if(e.type==='tornado'){e.spin=(e.spin||0)+0.45;e.x+=(e.tx-e.x)*0.18;e.y+=(e.ty-e.y)*0.18;}if(e.life<=0)e.dead=true;}
for(const arr of [zumbis,tiros,particles,sparkTrails,fx])for(let i=arr.length-1;i>=0;i--){if(arr===zumbis?arr[i].deadDone:arr[i].dead)arr.splice(i,1);}if(vida<=0&&!gameOver){gameOver=true;els.gameOverPanel.style.display='flex';SFX.gameOver();}if(els.upgradePanel.style.display==='flex')renderUpgradePanel();updateHUD();}
function drawZombie(z){
const isDead=z.dead&&z.deathAnim>0,walk=Math.sin(z.step*1.5),sway=Math.sin(z.step*.75),scale=(z.deathScale||1)*(z.isBoss?1.34:1.22);
ctx.save();ctx.translate(z.x+sway*(z.isBoss?7:4),z.y+walk*(z.isBoss?4.2:2.6));ctx.rotate(Math.sin(z.step*2.1)*(z.isBoss?.12:.08));ctx.scale(scale,scale);
ctx.globalAlpha=isDead?Math.max(.06,z.deathAnim):1;
ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(0,z.isBoss?34:24,z.isBoss?31:23,z.isBoss?9:7,0,0,Math.PI*2);ctx.fill();
ctx.shadowColor='rgba(90,255,140,.72)';ctx.shadowBlur=z.isBoss?22:14;
ctx.filter='saturate(1.15) contrast(1.08)';
if(z.hitFlash>0){const f=Math.min(1,z.hitFlash*.95);ctx.shadowColor=`rgba(255,48,48,${.5*f})`;ctx.shadowBlur=(z.isBoss?18:13)+(7*f);ctx.filter=`saturate(${1.1-0.35*f}) contrast(${1.06+0.12*f}) brightness(${1-0.24*f})`;}
ctx.font=`${z.isBoss?66:56}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(z.isBoss?'👹':'🧟',0,-6+Math.sin(z.step*3)*(z.isBoss?2.2:1.5));
if(z.hitFlash>0){ctx.filter='none';ctx.shadowBlur=0;ctx.globalCompositeOperation='source-atop';ctx.fillStyle=`rgba(255,40,40,${Math.min(.16,z.hitFlash*.14)})`;ctx.beginPath();ctx.ellipse(0,-6,z.isBoss?31:25,z.isBoss?29:23,0,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';}
ctx.filter='none';
if(z.burnTime>0){ctx.font=z.isBoss?'22px Arial':'18px Arial';ctx.fillText('🔥',-18,-30);ctx.fillText('🔥',18,-24);}
if(z.freezeTime>0){ctx.fillStyle='rgba(130,220,255,.22)';ctx.beginPath();ctx.arc(0,-6,z.isBoss?36:28,0,Math.PI*2);ctx.fill();ctx.font=z.isBoss?'18px Arial':'15px Arial';ctx.fillText('❄️',0,-34);}
ctx.restore();
const w=z.isBoss?176:94,h=z.isBoss?18:13,x=z.x-w/2,yBar=z.y-(z.isBoss?96:64),pct=Math.max(0,z.hp)/z.maxHp;
ctx.fillStyle='rgba(10,16,12,.72)';ctx.beginPath();ctx.roundRect(x,yBar,w,h,10);ctx.fill();
const grad=ctx.createLinearGradient(x,yBar,x+w,yBar);grad.addColorStop(0,z.isBoss?'#ff6f7e':'#86ff8d');grad.addColorStop(1,z.isBoss?'#ff334a':'#2ec96a');
ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(x+1.5,yBar+1.5,Math.max(0,w*pct-3),h-3,9);ctx.fill();
ctx.strokeStyle=z.isBoss?'rgba(255,146,156,.95)':'rgba(225,255,236,.72)';ctx.lineWidth=1.6;ctx.beginPath();ctx.roundRect(x,yBar,w,h,10);ctx.stroke();
ctx.fillStyle='#f4fff4';ctx.font=z.isBoss?'bold 13px Arial':'bold 11px Arial';ctx.textAlign='center';ctx.fillText(`${Math.max(0,Math.ceil(z.hp))}/${z.maxHp}`,z.x,yBar-6);
if(z.isBoss){ctx.fillStyle='rgba(255,85,112,.96)';ctx.font='bold 14px Arial';ctx.fillText('👹 BOSS',z.x,yBar-22);} }

const projectileStyles={
fire:{core:'#ff7b3f',glow:'rgba(255,125,70,.85)',size:4.8,trail:'#ff9e5d'},
ice:{core:'#b8f4ff',glow:'rgba(125,230,255,.85)',size:4.6,trail:'#7de6ff'},
water:{core:'#6dd9ff',glow:'rgba(109,217,255,.82)',size:4.4,trail:'#7de4ff'},
wind:{core:'#ebfbff',glow:'rgba(220,246,255,.8)',size:4.2,trail:'#dff6ff'},
venom:{core:'#9bff76',glow:'rgba(155,255,118,.84)',size:4.5,trail:'#b9ff96'},
light:{core:'#fff39b',glow:'rgba(255,241,133,.9)',size:5.1,trail:'#ffe86e'}
};

function draw(){ctx.clearRect(0,0,960,540);
const g=ctx.createLinearGradient(0,0,0,540);g.addColorStop(0,'#3b7e4f');g.addColorStop(.55,'#28563a');g.addColorStop(1,'#193e2a');ctx.fillStyle=g;ctx.fillRect(0,0,960,540);
for(let i=0;i<180;i++){const x=(i*53+tick*.6)%960,y=(i*97+tick*.4)%540,a=.05+((i*17)%10)/220;ctx.fillStyle=`rgba(120,200,100,${a})`;ctx.fillRect(x,y,3,3)}
for(const m of mistParticles){const mg=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r);mg.addColorStop(0,`rgba(168,255,156,${m.alpha})`);mg.addColorStop(1,'rgba(90,180,120,0)');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,7);ctx.fill();}
ctx.strokeStyle='#5f3f24';ctx.lineWidth=70;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(const p of path.slice(1))ctx.lineTo(p.x,p.y);ctx.stroke();ctx.strokeStyle='#d8a56e';ctx.lineWidth=54;ctx.stroke();ctx.strokeStyle='rgba(255,235,210,.35)';ctx.lineWidth=2;ctx.setLineDash([6,8]);ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle='#4f6e90';ctx.beginPath();ctx.roundRect(900,190,52,60,10);ctx.fill();ctx.fillStyle='#eff8ff';ctx.font='26px Arial';ctx.fillText('🏠',910,228);
for(let i=0;i<buildSlots.length;i++){const s=buildSlots[i];const taken=torres.some(t=>t.slot===i);if(taken)continue;ctx.shadowColor='rgba(170,255,115,.8)';ctx.shadowBlur=12;ctx.fillStyle='rgba(20,35,28,.9)';ctx.beginPath();ctx.arc(s.x,s.y,21,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(194,255,132,.9)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#d9ff9c';ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.fillText('+',s.x,s.y+8);}ctx.textAlign='start';
for(const t of torres){ctx.save();const pulse=1+Math.sin((tick+t.slot*10)*0.09)*0.05,aura=projectileStyles[t.type]||projectileStyles.fire;
ctx.translate(t.x,t.y);ctx.scale(pulse,pulse);
ctx.fillStyle='rgba(0,0,0,.32)';ctx.beginPath();ctx.ellipse(0,18,16,5,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='rgba(16,22,20,.95)';ctx.beginPath();ctx.roundRect(-11,-13,22,20,7);ctx.fill();
ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1.1;ctx.beginPath();ctx.roundRect(-11,-13,22,20,7);ctx.stroke();
ctx.shadowColor=t.color;ctx.shadowBlur=9;
ctx.strokeStyle=t===selectedTower?'#ffffff':t.color;ctx.lineWidth=2.6;ctx.beginPath();ctx.arc(0,-3,11.2,0,Math.PI*2);ctx.stroke();
ctx.globalAlpha=.2+Math.sin((tick+t.slot*7)*0.1)*.06;ctx.fillStyle=aura.trail;ctx.beginPath();ctx.arc(0,-3,12.7,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
ctx.shadowBlur=0;ctx.fillStyle='rgba(10,14,12,.92)';ctx.beginPath();ctx.arc(0,-3,8.2,0,Math.PI*2);ctx.fill();
ctx.font='14px Arial';ctx.textAlign='center';ctx.fillStyle='#f7ffed';ctx.fillText(t.emoji,0,1.5);
ctx.fillStyle='rgba(8,12,10,.9)';ctx.beginPath();ctx.roundRect(6.5,7.5,9.5,8.5,3);ctx.fill();
ctx.fillStyle='#dfffe8';ctx.font='bold 9px Arial';ctx.fillText(`${t.level}`,11.2,14.2);ctx.restore();}
for(const z of zumbis)drawZombie(z);
for(const p of particles){ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.life/40);ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();ctx.globalAlpha=1}
for(const s of sparkTrails){ctx.globalAlpha=Math.max(0,s.life/16);ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,7);ctx.fill();ctx.globalAlpha=1}
for(const b of tiros){const st=projectileStyles[b.effect]||projectileStyles.fire;if(b.effect==='light')continue; if(b.effect==='wind'){ctx.save();ctx.translate(b.x,b.y);ctx.rotate((tick+b.life)*0.35);ctx.font='24px Arial';ctx.fillText('🌪️',-12,8);ctx.restore();continue;}if(b.effect==='water'){ctx.fillStyle='rgba(130,220,255,.85)';ctx.beginPath();ctx.ellipse(b.x,b.y,4,7,0,0,7);ctx.fill();continue;}if(b.effect==='venom'){ctx.fillStyle='rgba(130,255,110,.45)';ctx.beginPath();ctx.arc(b.x,b.y,8,0,7);ctx.fill();continue;}const flick=Math.sin((tick+b.life*4)*0.35)*.6;ctx.fillStyle=st.trail;ctx.globalAlpha=.4;ctx.beginPath();ctx.arc(b.x,b.y,st.size+2.2+flick,0,7);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle=st.core;ctx.shadowColor=st.glow;ctx.shadowBlur=14;ctx.beginPath();ctx.arc(b.x,b.y,st.size,0,7);ctx.fill();ctx.shadowBlur=0;}
for(const e of fx){ctx.save();const a=Math.max(0,e.life/24);if(e.type==='lightning'){ctx.strokeStyle=`rgba(255,235,80,${a})`;ctx.lineWidth=4;ctx.shadowColor='rgba(255,235,80,.9)';ctx.shadowBlur=16;ctx.beginPath();ctx.moveTo(e.x-5,0);ctx.lineTo(e.x+2,e.y*0.35);ctx.lineTo(e.x-4,e.y*0.7);ctx.lineTo(e.x,e.y);ctx.stroke();}if(e.type==='drop'){ctx.fillStyle=`rgba(90,190,255,${a})`;ctx.beginPath();ctx.ellipse(e.x,e.y,4,8,0,0,7);ctx.fill();}if(e.type==='tornado'){ctx.translate(e.x,e.y);ctx.rotate(e.spin||0);ctx.globalAlpha=a;ctx.font='28px Arial';ctx.fillText('🌪️',-14,10);}if(e.type==='gas'){ctx.fillStyle=`rgba(110,255,120,${a*0.55})`;ctx.beginPath();ctx.arc(e.x+(Math.random()*8-4),e.y-12,12,0,7);ctx.fill();}if(e.type==='fire'){ctx.globalAlpha=a;ctx.font='18px Arial';ctx.fillText('🔥',e.x-8,e.y-14);}if(e.type==='ice'){ctx.strokeStyle=`rgba(150,235,255,${a})`;ctx.beginPath();ctx.arc(e.x,e.y-6,12,0,7);ctx.stroke();ctx.font='14px Arial';ctx.fillText('❄️',e.x-6,e.y-14);}ctx.restore();}
ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(190,255,140,.04)';ctx.fillRect(0,0,960,540);ctx.globalCompositeOperation='source-over';}
function loop(){update();draw();requestAnimationFrame(loop)}
cvs.addEventListener('click',e=>{ensureAudio();if(gameOver)return;SFX.click();const r=cvs.getBoundingClientRect(),x=(e.clientX-r.left)*cvs.width/r.width,y=(e.clientY-r.top)*cvs.height/r.height;
const ct=torres.find(t=>dist(t,{x,y})<18);if(ct){openUpgradePanel(ct);return;}
const si=buildSlots.findIndex((s,i)=>dist(s,{x,y})<24&&!torres.some(t=>t.slot===i));if(si>=0){openShop(si);return;}closeShop();selectedTower=null;});
els.closeShop.onclick=()=>{SFX.click();closeShop();};
els.panelUpgrade.onclick=()=>{if(selectedTower&&upgradeTower(selectedTower))renderUpgradePanel();};
els.panelSell.onclick=()=>{if(!selectedTower)return;dinheiro+=towerSellValue(selectedTower);SFX.sell();torres.splice(torres.indexOf(selectedTower),1);selectedTower=null;els.upgradePanel.style.display='none';};
els.panelClose.onclick=()=>{SFX.click();els.upgradePanel.style.display='none';};
els.restartBtn.onclick=()=>location.reload();
startWave();updateHUD();loop();
</script>
