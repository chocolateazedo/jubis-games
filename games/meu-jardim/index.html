<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Jardim</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(180deg, #a8e6a2 0%, #6bcf7f 100%);
      color: #123;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      background: rgba(255,255,255,.9);
      border-radius: 16px;
      padding: 24px;
      max-width: 560px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
      text-align: center;
    }
    h1 { margin-top: 0; }
    .garden { font-size: 2rem; margin: 16px 0; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 700;
      cursor: pointer;
      background: #2d9d4c;
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🌼 Meu Jardim</h1>
    <p>Jogo criado no Chat e publicado com sucesso no Jubis Games!</p>
    <p>Clique para regar suas plantinhas e ver o jardim crescer.</p>
    <div id="garden" class="garden">🌱 🌱 🌱</div>
    <button id="water">Regar 💧</button>
  </main>

  <script>
    const stages = [
      '🌱 🌱 🌱',
      '🌿 🌱 🌿',
      '🌷 🌿 🌷',
      '🌸 🌼 🌸',
      '🌳 🌺 🌳'
    ];
    let level = 0;
    const garden = document.getElementById('garden');
    document.getElementById('water').addEventListener('click', () => {
      level = Math.min(level + 1, stages.length - 1);
      garden.textContent = stages[level];
    });
  </script>
</body>
</html>
