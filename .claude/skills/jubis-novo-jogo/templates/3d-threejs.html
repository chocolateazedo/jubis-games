<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Nome do Jogo 3D</title>
  <!--
    TEMPLATE 3D do Jubis Games — Three.js via CDN (importmap, sem build).
    Demo: mova o cubo (WASD/setas ou arraste o dedo na tela) e colete as moedas douradas.
    Mantenha: link Voltar, tema escuro, responsivo (100dvh), recorde no localStorage.
  -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden;
      font-family: Arial, system-ui, sans-serif; color: #fff;
      background: radial-gradient(circle at 30% -10%, #2a3a7a, #0a0f1d 70%); }
    a.back {
      position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; z-index: 10;
      color: #c9b3ff; text-decoration: none; font-weight: 700;
      background: rgba(4,7,19,.55); padding: 6px 10px; border-radius: 10px;
    }
    .hud {
      position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 10;
      display: flex; gap: 14px; font-weight: 700; text-shadow: 0 0 8px rgba(0,0,0,.6);
    }
    .hint {
      position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%;
      transform: translateX(-50%); z-index: 10; opacity: .85; font-size: 14px; text-align: center;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <a class="back" href="../../">← Voltar</a>
  <div class="hud">
    <span id="score">Moedas: 0</span>
    <span id="best">Recorde: 0</span>
  </div>
  <p class="hint">Use WASD / setas ou arraste na tela para mover o cubo.</p>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const BEST_KEY = 'nome-do-jogo-3d-best'; // <-- troque pelo slug do seu jogo
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    let best = Number(localStorage.getItem(BEST_KEY) || 0);
    let score = 0;
    bestEl.textContent = `Recorde: ${best}`;

    // ----- Cena, câmera, renderer -----
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0a0f1d, 18, 40);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 12, 14);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); // performance no celular
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // ----- Luz -----
    scene.add(new THREE.AmbientLight(0x90a0ff, 0.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.1);
    sun.position.set(8, 16, 8);
    sun.castShadow = true;
    scene.add(sun);

    // ----- Chão -----
    const FIELD = 18;
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(FIELD * 2, FIELD * 2),
      new THREE.MeshStandardMaterial({ color: 0x18244a })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ======================= LÓGICA DO JOGO =======================
    // Jogador
    const player = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 1.4, 1.4),
      new THREE.MeshStandardMaterial({ color: 0x65e8ff, emissive: 0x0a3a55 })
    );
    player.position.y = 0.7;
    player.castShadow = true;
    scene.add(player);

    // Moedas
    const coins = [];
    function spawnCoin() {
      const coin = new THREE.Mesh(
        new THREE.CylinderGeometry(0.6, 0.6, 0.18, 20),
        new THREE.MeshStandardMaterial({ color: 0xffd978, emissive: 0x554000 })
      );
      coin.rotation.x = Math.PI / 2;
      coin.position.set((Math.random() * 2 - 1) * (FIELD - 2), 0.6, (Math.random() * 2 - 1) * (FIELD - 2));
      coin.castShadow = true;
      scene.add(coin);
      coins.push(coin);
    }
    for (let i = 0; i < 6; i++) spawnCoin();

    function updateGame(dt) {
      // mover jogador
      const speed = 9 * dt;
      const dir = new THREE.Vector3((keys.right ? 1 : 0) - (keys.left ? 1 : 0), 0,
                                    (keys.down ? 1 : 0) - (keys.up ? 1 : 0));
      if (dir.lengthSq() > 0) {
        dir.normalize().multiplyScalar(speed);
        player.position.x = THREE.MathUtils.clamp(player.position.x + dir.x, -FIELD + 1, FIELD - 1);
        player.position.z = THREE.MathUtils.clamp(player.position.z + dir.z, -FIELD + 1, FIELD - 1);
      }

      // câmera segue o jogador suavemente
      camera.position.x += (player.position.x - camera.position.x) * 0.05;
      camera.lookAt(player.position.x, 0, player.position.z);

      // moedas giram e são coletadas
      for (const coin of coins) {
        coin.rotation.z += dt * 3;
        if (player.position.distanceTo(coin.position) < 1.4) {
          coin.position.set((Math.random() * 2 - 1) * (FIELD - 2), 0.6, (Math.random() * 2 - 1) * (FIELD - 2));
          score += 1;
          scoreEl.textContent = `Moedas: ${score}`;
          if (score > best) { best = score; localStorage.setItem(BEST_KEY, String(best)); bestEl.textContent = `Recorde: ${best}`; }
        }
      }
    }
    // ===================== FIM DA LÓGICA DO JOGO ===================

    // ----- Entrada (teclado + arrastar) -----
    const keys = { up: false, down: false, left: false, right: false };
    const map = { ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down',
                  ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right' };
    addEventListener('keydown', (e) => { if (map[e.key]) keys[map[e.key]] = true; });
    addEventListener('keyup',   (e) => { if (map[e.key]) keys[map[e.key]] = false; });

    let dragX = null, dragY = null;
    function dragStart(x, y) { dragX = x; dragY = y; }
    function dragMove(x, y) {
      if (dragX === null) return;
      const dx = x - dragX, dy = y - dragY, T = 12;
      keys.left = dx < -T; keys.right = dx > T; keys.up = dy < -T; keys.down = dy > T;
    }
    function dragEnd() { dragX = dragY = null; keys.up = keys.down = keys.left = keys.right = false; }
    addEventListener('touchstart', (e) => dragStart(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    addEventListener('touchmove',  (e) => dragMove(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    addEventListener('touchend', dragEnd);

    // ----- Resize -----
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ----- Loop -----
    let last = performance.now();
    function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      updateGame(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
