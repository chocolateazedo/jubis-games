<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Jubis Fire</title>
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: Arial, system-ui, sans-serif; color: #fff; }
    body { background: radial-gradient(circle at 30% -10%, #2a3a7a, #0a0f1d 70%); }
    a.back { position: fixed; top: 12px; left: 12px; z-index: 50; color: #c9b3ff; text-decoration: none; font-weight: 700;
             background: rgba(4,7,19,.55); padding: 6px 10px; border-radius: 10px; }
    .hidden { display: none !important; }
    button { font-family: inherit; }

    /* ---------- LOBBY ---------- */
    #screen-lobby { position: fixed; inset: 0; overflow: auto; display: grid; place-items: start center; padding: 56px 14px 24px; }
    .panel { width: min(94vw, 680px); background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16);
             border-radius: 16px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.35); text-align: center; }
    h1 { margin: 0 0 4px; font-size: clamp(1.8rem, 5vw, 2.6rem); text-shadow: 0 0 14px rgba(101,232,255,.6); }
    .sub { opacity: .85; margin: 0 0 14px; }
    input { padding: 11px; border-radius: 9px; border: 1px solid rgba(255,255,255,.3); background: #0f1f3b; color: #fff; font-size: 16px; }
    .lbl { text-align: left; font-weight: 700; margin: 14px 0 8px; }
    .char-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    @media (max-width: 520px) { .char-grid { grid-template-columns: repeat(3, 1fr); } }
    .char { background: #11183f; border: 2px solid transparent; border-radius: 12px; padding: 8px 4px; cursor: pointer; color: #fff;
            display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .char.sel { border-color: #65e8ff; box-shadow: 0 0 14px rgba(101,232,255,.5); }
    .char .ava { position: relative; width: 46px; height: 46px; border-radius: 10px; overflow: hidden; }
    .char .hair { position: absolute; left: 6px; right: 6px; top: 4px; height: 14px; border-radius: 6px; }
    .char .face { position: absolute; left: 11px; right: 11px; top: 16px; height: 18px; border-radius: 5px; }
    .char .cname { font-size: 13px; font-weight: 700; }
    .char .cg { font-size: 12px; opacity: .8; }
    .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    .btn { border: none; border-radius: 9px; padding: 12px 16px; font-weight: 700; cursor: pointer; background: #e8513b; color: #fff; font-size: 15px; }
    .btn.alt { background: #2a335c; }
    .btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,.3); }
    .btn:disabled { opacity: .5; cursor: default; }
    .divider { margin: 16px 0; border-top: 1px dashed rgba(255,255,255,.2); }
    .msg { min-height: 20px; margin-top: 10px; font-weight: 700; }
    .msg.error { color: #ff6e8e; }
    #roomPlayers { list-style: none; padding: 0; margin: 10px 0; font-weight: 700; }
    #roomPlayers li { padding: 4px; }

    /* ---------- JOGO ---------- */
    #glmount { position: fixed; inset: 0; }
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%,-50%);
                 border: 2px solid rgba(255,255,255,.85); border-radius: 50%; }
    #crosshair::after { content:''; position:absolute; left:50%; top:50%; width:3px; height:3px; background:#fff; transform:translate(-50%,-50%); border-radius:50%; }
    .hudtop { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; font-weight: 700;
              background: rgba(0,0,0,.35); padding: 6px 14px; border-radius: 12px; }
    #hpwrap { position: fixed; left: 14px; bottom: 14px; width: min(40vw, 240px); }
    #hpbar { height: 16px; background: rgba(0,0,0,.5); border-radius: 9px; overflow: hidden; border: 1px solid rgba(255,255,255,.3); }
    #hpFill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5252, #69f0ae); transition: width .1s; }
    #hpLabel { font-weight: 700; margin-bottom: 4px; }
    #deadTag { position: fixed; top: 44%; left: 50%; transform: translate(-50%,-50%); font-size: 1.6rem; font-weight: 800; color: #ff6e8e; }
    #endBox { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; background: rgba(0,0,0,.6); pointer-events: auto; }
    #endBox .box { background: #141b3a; border: 1px solid rgba(255,255,255,.2); border-radius: 16px; padding: 22px; text-align: center; width: min(90vw, 440px); }
    #endText { font-size: 1.2rem; font-weight: 800; margin-bottom: 14px; }

    /* ---------- controles de toque ---------- */
    #touchControls { position: fixed; inset: 0; z-index: 15; pointer-events: none; }
    #joystick { position: fixed; left: 26px; bottom: 26px; width: 110px; height: 110px; border-radius: 50%;
                background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3); pointer-events: auto; }
    #stick { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px; border-radius: 50%; background: rgba(255,255,255,.6); }
    .tbtn { position: fixed; pointer-events: auto; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); font-weight: 800; color: #fff; }
    #btnShoot { right: 26px; bottom: 40px; width: 92px; height: 92px; background: rgba(232,81,59,.65); font-size: 16px; }
    #btnJump { right: 130px; bottom: 30px; width: 70px; height: 70px; background: rgba(40,90,200,.6); font-size: 14px; }
  </style>
</head>
<body>
  <a class="back" href="../../">← Voltar</a>

  <!-- ================= LOBBY ================= -->
  <section id="screen-lobby">
    <div class="panel">
      <h1>🔥 Jubis Fire</h1>
      <p class="sub">Battle royale 3D — até 4 jogadores. Último de pé vence!</p>
      <p id="buildTag" style="opacity:.55;font-size:11px;margin:0 0 6px">build: no-zone-1</p>

      <div class="row"><input id="pname" type="text" placeholder="Seu nome" maxlength="16" style="width:240px" /></div>

      <p class="lbl">Escolha seu personagem</p>
      <div id="charGrid" class="char-grid"></div>

      <div id="joinPanel">
        <div class="divider"></div>
        <div class="row">
          <button id="btnQuick" class="btn" disabled>🎮 Procurar partida</button>
          <button id="btnTrain" class="btn alt">🤖 Modo treino</button>
        </div>
        <p class="sub" style="margin:8px 0 0">Partida online com outros jogadores, ou treino offline contra bots.</p>
        <div class="divider"></div>
        <p class="lbl" style="text-align:center">Jogar com amigos</p>
        <div class="row">
          <button id="btnCreate" class="btn alt" disabled>🔒 Criar sala</button>
          <input id="joinCode" type="text" placeholder="Senha (6)" maxlength="6" style="width:130px" />
          <button id="btnJoin" class="btn alt" disabled>Entrar</button>
        </div>
        <p id="lobbyMsg" class="msg"></p>
      </div>

      <div id="roomBox" class="hidden">
        <div class="divider"></div>
        <p id="roomCode" style="font-weight:700"></p>
        <ul id="roomPlayers"></ul>
        <p id="roomStatus" class="sub"></p>
        <div class="row">
          <button id="btnStart" class="btn hidden">▶ Iniciar partida</button>
          <button id="btnLeaveRoom" class="btn ghost">Sair</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= JOGO ================= -->
  <section id="screen-game" class="hidden">
    <div id="glmount"></div>
    <div id="hud">
      <div id="crosshair"></div>
      <div class="hudtop">
        <span id="aliveCount">Vivos: —</span>
        <span id="zoneInfo">Zona</span>
      </div>
      <button id="btnExit" class="btn ghost" style="position:fixed; top:10px; right:12px; pointer-events:auto;">Sair</button>
      <div id="hpwrap">
        <div id="hpLabel">Vida: <span id="hpText">100</span></div>
        <div id="hpbar"><div id="hpFill"></div></div>
      </div>
      <div id="deadTag" class="hidden">☠ Você foi eliminado</div>
    </div>

    <div id="touchControls" class="hidden">
      <div id="joystick"><div id="stick"></div></div>
      <button id="btnJump" class="tbtn">PULAR</button>
      <button id="btnShoot" class="tbtn">ATIRAR</button>
    </div>

    <div id="endBox" class="hidden">
      <div class="box">
        <div id="endText"></div>
        <button id="btnBackLobby" class="btn">Voltar ao lobby</button>
      </div>
    </div>
  </section>

  <!-- PeerJS (WebRTC) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- Three.js -->
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="game.js?v=3"></script>
</body>
</html>
