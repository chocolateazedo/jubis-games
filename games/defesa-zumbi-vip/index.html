<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Defesa Zumbi VIP</title>
<style>
body{margin:0;background:#070b18;color:#fff;font-family:Inter,system-ui}.screen{padding:12px;display:flex;flex-direction:column;gap:10px;height:100vh}.hidden{display:none}
#menu{margin:auto;max-width:920px;background:#12203ccc;border:1px solid #74dfff;border-radius:14px;padding:18px} .world{padding:12px;margin:6px;border-radius:10px;background:#203a62;border:1px solid #85d6ff;color:#fff}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.hud-item{position:relative;padding:10px 14px;background:url('./assets/hud-frame.svg') center/100% 100% no-repeat;min-height:62px}
.hud-item b{display:block;font-size:.8rem;color:#9ce5ff}.hud-item span{font-size:1.25rem}
.main{display:grid;grid-template-columns:1fr 280px;gap:10px;flex:1}.panel{background:#0d1730d9;border:1px solid #71d9ff;border-radius:12px;padding:10px}.shop{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow:auto}
.tower{background:url('./assets/shop-card.svg') center/100% 100% no-repeat;border:none;color:#fff;min-height:92px;padding:8px;text-align:left}.tower.active{outline:2px solid #ffd166}.btn{background:url('./assets/button-gold.svg') center/100% 100% no-repeat;border:none;color:#2b1900;font-weight:700;padding:12px 16px}
canvas{width:100%;height:100%;border-radius:12px}
</style></head><body><main class='screen'>
<section id='menu'><h1>Defesa Zumbi VIP</h1><p>Referência obrigatória: <b>2ca166e5-d4cc-4855-ae66-a0b3e18ed420</b></p><div id='worlds'></div></section>
<section id='game' class='hidden'><header class='hud'><div class='hud-item'><b>Vida</b><span id='life'>100</span></div><div class='hud-item'><b>Dinheiro</b><span id='money'>300</span></div><div class='hud-item'><b>Onda</b><span id='wave'>1/10</span></div><button id='restart' class='btn hidden'>Reiniciar</button></header><div class='main'><canvas id='cv'></canvas><aside id='panel' class='panel'></aside></div><footer id='shop' class='shop'></footer></section></main>
<script>
(()=>{const imgs={map:new Image(),z:new Image(),boss:new Image(),tower:new Image()};imgs.map.src='./assets/map-track.svg';imgs.z.src='./assets/zombie.svg';imgs.boss.src='./assets/boss.svg';imgs.tower.src='./assets/tower-arcane.svg';
const worlds=[{n:'Floresta Sombria'},{n:'Caverna Tóxica'},{n:'Vila Assombrada'}],towers=[{id:'gelo',n:'Torre de Gelo',preco:95,alc:130,dano:11,rate:56},{id:'fogo',n:'Torre de Fogo',preco:130,alc:118,dano:15,rate:50},{id:'explosiva',n:'Torre Explosiva',preco:165,alc:120,dano:25,rate:72}];
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');let S,dpr=1;function resize(){dpr=Math.max(1,Math.min(2,devicePixelRatio||1));cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);
function start(){ $('menu').classList.add('hidden');$('game').classList.remove('hidden');S={life:100,money:320,w:1,maxW:10,sel:null,towers:[],shots:[],z:[],tick:0,over:false,path:[[30,95],[250,95],[250,230],[430,230],[430,120],[710,120],[710,320],[150,320],[150,455],[930,455]]};resize();loop();}
function spawn(boss=false){const hp=boss?760:52+S.w*16;S.z.push({x:S.path[0][0],y:S.path[0][1],i:1,hp,max:hp,spd:boss?.36:.58+S.w*.035,size:boss?68:46,boss});}
function update(){if(S.over)return;S.tick++;if(S.tick%80===0)spawn(false);if(S.w===S.maxW&&S.tick%520===0&&!S.z.some(v=>v.boss))spawn(true);if(S.tick%850===0&&S.w<S.maxW)S.w++;S.z.forEach(z=>{const t=S.path[z.i];if(!t){S.life-=z.boss?20:8;z.hp=0;return;}const dx=t[0]-z.x,dy=t[1]-z.y,d=Math.hypot(dx,dy);if(d<3)z.i++;else{z.x+=dx/d*z.spd;z.y+=dy/d*z.spd;}});S.towers.forEach(t=>{if(t.cd-->0)return;const trg=S.z.find(z=>z.hp>0&&Math.hypot(z.x-t.x,z.y-t.y)<t.tp.alc);if(!trg)return;t.cd=t.tp.rate;trg.hp-=t.tp.dano;});S.z=S.z.filter(z=>z.hp>0);if(S.life<=0)S.over=true;}
function draw(){ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);ctx.drawImage(imgs.map,0,0,cv.clientWidth,cv.clientHeight);S.towers.forEach(t=>ctx.drawImage(imgs.tower,t.x-28,t.y-50,56,56));S.z.forEach(z=>{const sprite=z.boss?imgs.boss:imgs.z;ctx.drawImage(sprite,z.x-z.size/2,z.y-z.size/2,z.size,z.size);ctx.fillStyle='#fff';ctx.fillRect(z.x-z.size/2,z.y-z.size/2-8,z.size,4);ctx.fillStyle=z.boss?'#ff5178':'#67ff8d';ctx.fillRect(z.x-z.size/2,z.y-z.size/2-8,Math.max(0,z.hp/z.max)*z.size,4)});} 
function ui(){ $('life').textContent=Math.max(0,Math.floor(S.life));$('money').textContent=Math.floor(S.money);$('wave').textContent=`${S.w}/${S.maxW}`;$('panel').innerHTML='<h3>Painel VIP ilustrado</h3><p>Use cartas da loja para colocar torres ilustradas.</p>';}
function loop(){if(!S)return;update();draw();ui();requestAnimationFrame(loop)}
cv.addEventListener('pointerdown',e=>{if(!S||S.over)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;const tp=towers.find(t=>t.id===S.sel);if(!tp||S.money<tp.preco)return;if(S.path.some(p=>Math.hypot(p[0]-x,p[1]-y)<56))return;S.money-=tp.preco;S.towers.push({x,y,tp,cd:0});});
$('restart').onclick=()=>location.reload();const wb=$('worlds');worlds.forEach((w,i)=>{const b=document.createElement('button');b.className='world';b.textContent=`${w.n} · Mundo ${i+1}`;b.onclick=start;wb.appendChild(b)});const shop=$('shop');towers.forEach(tp=>{const c=document.createElement('button');c.className='tower';c.innerHTML=`<strong>${tp.n}</strong><br><small>💰${tp.preco}</small>`;c.onclick=()=>{S&&(S.sel=tp.id);[...shop.children].forEach(x=>x.classList.remove('active'));c.classList.add('active')};shop.appendChild(c)});
})();
</script></body></html>
