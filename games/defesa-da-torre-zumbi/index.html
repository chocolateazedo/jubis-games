<!doctype html>
<html lang="pt-BR">
<head>

  <title>Defesa da Torre de Zumbi</title>
  <style>
    :root{--bg:#050709;--card:#13181b;--gold:#ffd76a;--ui:#dbe3dc}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% -20%,#243129 0%,#101619 45%,#05070a 100%);color:var(--ui);min-height:100vh;display:flex;justify-content:center;padding:12px}
    .game-shell{width:min(96vw,1040px);position:relative}
    .back{position:absolute;top:10px;left:10px;z-index:99;color:#d8ffbe;text-decoration:none;font-weight:700;background:rgba(5,18,10,.82);padding:8px 10px;border:1px solid rgba(183,255,99,.55);border-radius:12px}
    #hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(94%,960px)}
    .hud-chip{background:linear-gradient(180deg,rgba(24,46,37,.9),rgba(12,28,21,.92));border:1px solid rgba(190,255,124,.4);padding:8px 12px;border-radius:999px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.35)}
    canvas{display:block;width:100%;aspect-ratio:16/9;height:auto;border-radius:28px;border:2px solid rgba(183,255,99,.55);box-shadow:0 16px 48px rgba(0,0,0,.6),0 0 42px rgba(134,255,109,.18) inset;touch-action:manipulation}
    #slotInfo{margin-top:8px;text-align:center;font-weight:700;opacity:.95}
    #shopTray{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(95%,980px);z-index:60;background:linear-gradient(180deg,rgba(21,35,28,.95),rgba(12,24,18,.97));border:1px solid rgba(183,255,99,.45);border-radius:22px;padding:12px;display:none;box-shadow:0 20px 35px rgba(0,0,0,.55)}
    #shopHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
    #towerBar{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
    .tower-option{flex:0 0 132px;background:linear-gradient(180deg,#335f49,#203a2c);border:1px solid rgba(201,255,146,.5);border-radius:14px;padding:10px;cursor:pointer;color:#efffde;text-align:left}
    .tower-option:hover{transform:translateY(-2px)} .tower-option small{opacity:.85;display:block}
    .xbtn{background:#263d30;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:16px}
    .panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9990;background:rgba(0,0,0,.72)}
    .card{width:min(92vw,540px);background:linear-gradient(180deg,#193928,#11271c);border:1px solid rgba(156,255,107,.5);border-radius:16px;padding:16px;box-shadow:0 20px 40px rgba(0,0,0,.55);position:relative}
    .row{display:flex;justify-content:space-between;gap:8px;margin:8px 0} button{background:linear-gradient(180deg,#325d45,#234030);color:#e9ffd8;border:1px solid #9cff6b;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
    .upgrade-close{position:absolute;right:10px;top:10px}
    @keyframes signDrop{0%{transform:translateY(-260px) scale(.9)}70%{transform:translateY(26px) scale(1.04)}100%{transform:translateY(0) scale(1)}}
    @keyframes burnPulse{0%{opacity:.15}50%{opacity:.42}100%{opacity:.2}}
    @media (max-width:720px){.hud-chip{font-size:12px;padding:6px 10px}.back{font-size:12px;padding:6px 8px}}
  </style>
</head>
<body>
  <div class="game-shell">
    <a class="back" href="../../index.php">← Voltar</a>
    <div id="hud"><span id="vida" class="hud-chip"></span><span id="dinheiro" class="hud-chip"></span><span id="onda" class="hud-chip"></span><span id="towerInfo" class="hud-chip">Sem torre selecionada</span></div>
    <canvas id="game" width="960" height="540"></canvas>
    <div id="slotInfo">Toque em um slot <strong>＋</strong> para abrir a loja de torres.</div>
    <div id="shopTray"><div id="shopHeader"><span id="shopTitle">Escolha uma torre para construir</span><button id="closeShop" class="xbtn">✖</button></div><div id="towerBar"></div></div>
  </div>
  <div id="upgradePanel" class="panel"><div class="card"><button id="panelClose" class="xbtn upgrade-close">✖</button><h3>🔧 Upgrade da Torre</h3><div id="upgradeContent"></div><div class="row"><button id="panelUpgrade">⬆️ Melhorar</button><button id="panelSell">💸 Vender</button></div></div></div>
  <div id="gameOverPanel" class="panel"></div>
<script>
(()=>{
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
const els={vida:vida,dinheiro:dinheiro,onda:onda,towerInfo:towerInfo,towerBar:document.getElementById('towerBar'),shopTray:document.getElementById('shopTray'),closeShop:document.getElementById('closeShop'),upgradePanel:document.getElementById('upgradePanel'),upgradeContent:document.getElementById('upgradeContent'),panelUpgrade:document.getElementById('panelUpgrade'),panelSell:document.getElementById('panelSell'),panelClose:document.getElementById('panelClose'),gameOverPanel:document.getElementById('gameOverPanel')};
const PHASE_WAVES=[15,20,25,30,40],MAX_PHASES=5,MAX_TOWER_LEVEL=50,key='zombie_td_unlock_v5';let unlocked=Math.max(1,parseInt(localStorage.getItem(key)||'1',10));
let mode='menu',phase=1,path=[],slots=[],vidaVal=1000,money=180,wave=1,sel=null,slotActive=-1,spawn=0,cool=0,spawned=0;
const towers=[],zombies=[],shots=[],fx=[];const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const phases=[
{name:'Floresta',theme:'#4b8e55',ground:'#6f9b5a',path:[{x:0,y:260},{x:170,y:260},{x:170,y:140},{x:420,y:140},{x:420,y:360},{x:700,y:360},{x:700,y:220},{x:960,y:220}],slots:[{x:90,y:355},{x:230,y:205},{x:320,y:315},{x:500,y:220},{x:540,y:430},{x:760,y:300},{x:820,y:165},{x:885,y:330}]},
{name:'Pantano',theme:'#3f5d43',ground:'#4f6f47',path:[{x:0,y:330},{x:190,y:330},{x:190,y:170},{x:420,y:170},{x:420,y:390},{x:710,y:390},{x:710,y:210},{x:960,y:210}],slots:[{x:95,y:230},{x:240,y:260},{x:300,y:95},{x:510,y:300},{x:560,y:445},{x:760,y:315},{x:810,y:135},{x:905,y:290}]},
{name:'Castelo',theme:'#66605b',ground:'#797169',path:[{x:0,y:300},{x:160,y:300},{x:160,y:140},{x:430,y:140},{x:430,y:370},{x:680,y:370},{x:680,y:200},{x:960,y:200}],slots:[{x:80,y:200},{x:140,y:410},{x:300,y:210},{x:360,y:450},{x:520,y:250},{x:590,y:90},{x:780,y:280},{x:860,y:80}]},
{name:'Cidade',theme:'#4c5a64',ground:'#616f7b',path:[{x:0,y:170},{x:180,y:170},{x:180,y:300},{x:470,y:300},{x:470,y:420},{x:760,y:420},{x:760,y:250},{x:960,y:250}],slots:[{x:90,y:260},{x:110,y:80},{x:280,y:270},{x:350,y:420},{x:520,y:300},{x:620,y:160},{x:780,y:330},{x:870,y:170}]},
{name:'O Fim',theme:'#3c3436',ground:'#574d4f',path:[{x:0,y:270},{x:180,y:270},{x:180,y:90},{x:500,y:90},{x:500,y:430},{x:760,y:430},{x:760,y:180},{x:960,y:180}],slots:[{x:60,y:390},{x:230,y:190},{x:330,y:330},{x:380,y:30},{x:560,y:250},{x:620,y:470},{x:820,y:320},{x:860,y:90}]}
];
const types=[{k:'fire',n:'Fogo',c:44,r:125,dmg:12,rt:30,sp:6,col:'#c94b31'},{k:'ice',n:'Gelo',c:46,r:130,dmg:4,rt:32,sp:6,col:'#75b8e8'},{k:'water',n:'Água',c:38,r:155,dmg:8,rt:17,sp:7,col:'#3f8bc8'},{k:'wind',n:'Vento',c:40,r:185,dmg:4,rt:22,sp:6,col:'#b7d0ef'},{k:'leaf',n:'Folha',c:37,r:132,dmg:9,rt:15,sp:7,col:'#6fad67'},{k:'light',n:'Raio',c:58,r:170,dmg:38,rt:42,sp:7,col:'#ceb7ff'}];
const ac=new (window.AudioContext||window.webkitAudioContext)();
function snd(k){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);const n=ac.currentTime;const m={die:[90,.26,'triangle'],light:[1180,.12,'square'],wave:[320,.18,'sine'],ice:[210,.22,'triangle'],fire:[140,.24,'sawtooth'],wind:[680,.2,'triangle'],over:[70,.5,'square'],hit:[520,.06,'square'],boss:[55,.45,'sawtooth']};const t=m[k]||[330,.1,'sine'];o.type=t[2];o.frequency.setValueAtTime(t[0],n);o.frequency.exponentialRampToValueAtTime(Math.max(40,t[0]*.45),n+t[1]);g.gain.setValueAtTime(.09,n);g.gain.exponentialRampToValueAtTime(.0001,n+t[1]);o.start(n);o.stop(n+t[1]);}
const maxWave=()=>PHASE_WAVES[phase-1];
function ws(){const p=phase-1;return{amount:wave===maxWave()?1:10+wave*2,hp:90+(wave-1)*14+p*35,speed:1+wave*.045+p*.05,spawnGap:Math.max(8,30-wave),reward:18+wave*4};}
function zType(i,b){if(b)return'chefe';if(i%7===0)return'congelador';if(i%3===0)return'corredor';return'normal';}
function startWave(){snd('wave');const s=ws();spawn=s.amount;spawned=0;cool=1;}
function spawnZombie(){const s=ws(),boss=wave===maxWave(),t=zType(spawned,boss),m={normal:1,corredor:.5,congelador:1.3,chefe:14}[t],v={normal:1,corredor:2.35,congelador:.9,chefe:.3}[t];const base=path;zombies.push({x:base[0].x,y:base[0].y,path:base,seg:0,type:t,isBoss:boss,hp:Math.floor(s.hp*m),maxHp:Math.floor(s.hp*m),speed:s.speed*v,reward:Math.floor(s.reward*(boss?3:(t==='corredor'?.8:1))),dead:false,step:Math.random()*6,hit:0,burn:0,slow:0,slowF:1,freeze:0,shock:0,wet:0,poison:0,stun:0,spin:0,death:0,lean:t==='corredor'?-0.32:0});if(t==='chefe')snd('boss');spawned++;}
function hud(){els.vida.textContent=`❤️ ${Math.max(0,Math.round(vidaVal))}/1000`;els.dinheiro.textContent=`💰 ${money}`;els.onda.textContent=`🌊 Onda ${wave}/${maxWave()} • Fase ${phase}`;els.towerInfo.textContent=sel?`${sel.label} Lv ${sel.level}`:'Sem torre selecionada';}
function build(tt){if(slotActive<0||money<tt.c||towers.some(t=>t.slot===slotActive))return;const s=slots[slotActive];towers.push({x:s.x,y:s.y,slot:slotActive,type:tt.k,label:tt.n,range:tt.r,dmg:tt.dmg,rate:tt.rt,cd:0,sp:tt.sp,level:1,total:tt.c,color:tt.col,disabled:0});money-=tt.c;slotActive=-1;els.shopTray.style.display='none';}
function update(){if(mode!=='playing')return;cool--;if(spawn>0&&cool<=0){spawnZombie();spawn--;cool=ws().spawnGap;}if(spawn===0&&!zombies.length){if(wave>=maxWave()){end(true);return;}money+=30+wave*8;wave++;startWave();}
for(const t of towers){if(t.disabled>0){t.disabled--;continue;}if(--t.cd<=0){const a=zombies.find(z=>!z.dead&&d(z,t)<=t.range);if(a){if(t.type==='light'){a.hp-=t.dmg;a.hit=1;snd('light');for(let i=0;i<3;i++)fx.push({type:'lightning',target:a,life:7,off:(i-1)*12});}else shots.push({x:t.x,y:t.y,target:a,dmg:t.dmg,speed:t.sp,e:t.type,life:80});t.cd=t.rate;}}}
for(const p of shots){if(!p.target||p.target.dead){p.dead=1;continue;}const dx=p.target.x-p.x,dy=p.target.y-p.y,dd=Math.hypot(dx,dy);if(dd<p.speed+8){p.target.hp-=p.dmg;p.target.hit=1;snd('hit');if(p.e==='fire'){snd('fire');p.target.burn=130;fx.push({type:'fireSpray',x:p.x,y:p.y,tx:p.target.x,ty:p.target.y,life:16});fx.push({type:'fireAura',target:p.target,life:36});fx.push({type:'smoke',x:p.target.x,y:p.target.y,life:42});}if(p.e==='ice'){snd('ice');p.target.freeze=80;p.target.slow=120;p.target.slowF=.05;fx.push({type:'iceSpray',x:p.x,y:p.y,tx:p.target.x,ty:p.target.y,life:15});fx.push({type:'iceAura',target:p.target,life:20});}if(p.e==='water'){snd('wave');p.target.slow=90;p.target.slowF=.55;fx.push({type:'waterWave',x:p.target.x,y:p.target.y,life:26});}if(p.e==='wind'){snd('wind');p.target.stun=20;p.target.spin=26;fx.push({type:'tornado',target:p.target,life:26});}if(p.e==='leaf'){p.target.poison=90;fx.push({type:'thorns',x:p.target.x,y:p.target.y,life:24});}p.dead=1;}else{p.x+=dx/dd*p.speed;p.y+=dy/dd*p.speed;if(--p.life<=0)p.dead=1;}}
for(const z of zombies){z.step+=z.type==='corredor'?.45:.26;z.hit=Math.max(0,z.hit-.18);if(z.burn>0){z.burn--;z.hp-=.3;}if(z.poison>0){z.poison--;z.hp-=.12;}if(z.freeze>0)z.freeze--;if(z.slow>0)z.slow--;if(z.stun>0)z.stun--;if(z.spin>0)z.spin--;const n=z.path[z.seg+1];if(!n){z.dead=1;vidaVal-=z.isBoss?vidaVal:Math.max(1,Math.round(z.hp));continue;}if(z.type==='congelador'&&z.stun===0){const near=towers.find(t=>d(t,z)<50&&t.disabled<=0);if(near){near.disabled=300;z.stun=80;}}const mv=z.stun>0?0:(z.freeze>0?.02:(z.slow>0?z.slowF:1)),v=Math.max(.05,z.speed*mv),dx=n.x-z.x,dy=n.y-z.y,dd=Math.hypot(dx,dy);if(dd<v){z.x=n.x;z.y=n.y;z.seg++;}else{z.x+=dx/dd*v;z.y+=dy/dd*v;}if(z.hp<=0){z.dead=1;snd('die');for(let i=0;i<10;i++)fx.push({type:'gib',x:z.x,y:z.y,vx:(Math.random()-.5)*3,vy:-Math.random()*2.2,life:20});money+=z.reward;}}
for(const a of [zombies,shots])for(let i=a.length-1;i>=0;i--)if(a[i].dead)a.splice(i,1);for(let i=fx.length-1;i>=0;i--){const e=fx[i];if(e.target&&e.target.dead)e.life=0;if(--e.life<=0)fx.splice(i,1);}if(vidaVal<=0)end(false);hud();}
function dz(z){
const boss=z.type==='chefe',runner=z.type==='corredor',walk=Math.sin(z.step*0.42),flash=z.hit>0;
const s=boss?3.9:(runner?1.08:1.34),bodyW=boss?16:(runner?10.2:12.5),bodyH=boss?27:(runner?23:24);
ctx.save();ctx.translate(z.x,z.y);
if(z.spin>0)ctx.rotate(z.step*.4);
if(runner)ctx.rotate(-0.38);
ctx.scale(s,s);

ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,33,boss?23:17,boss?8:6.5,0,0,7);ctx.fill();

// braços estendidos clássicos
ctx.strokeStyle=boss?'#70866f':'#6d8569';ctx.lineWidth=boss?4.2:3.2;ctx.lineCap='round';
ctx.beginPath();
ctx.moveTo(-bodyW+1,-13);ctx.lineTo(-bodyW-11,-17+walk*1.2);
ctx.moveTo(bodyW-1,-13);ctx.lineTo(bodyW+11,-18-walk*1.2);
ctx.stroke();

// pernas em animação de caminhada
ctx.strokeStyle='#28342c';ctx.lineWidth=boss?4.6:3.8;
ctx.beginPath();
ctx.moveTo(-4,bodyH-1);ctx.lineTo(-7+walk*2.8,bodyH+13);
ctx.moveTo(4,bodyH-1);ctx.lineTo(7-walk*2.8,bodyH+13);
ctx.stroke();

// roupa preta/cinza rasgada
ctx.fillStyle=runner?'#1f2226':'#24272d';ctx.beginPath();ctx.roundRect(-bodyW,-20,bodyW*2,bodyH,runner?5:7);ctx.fill();
ctx.fillStyle='rgba(120,126,138,.3)';
ctx.beginPath();ctx.moveTo(-3,2);ctx.lineTo(2,2);ctx.lineTo(-1,12);ctx.closePath();ctx.fill();
ctx.beginPath();ctx.moveTo(6,8);ctx.lineTo(11,9);ctx.lineTo(8,16);ctx.closePath();ctx.fill();

// cabeça zumbi clássica + pele verde acinzentada
ctx.fillStyle=boss?'#8ba488':'#839d80';
ctx.beginPath();ctx.roundRect(-11,-37,22,17,7);ctx.fill();

// poucos fios de cabelo
ctx.strokeStyle='#2c372f';ctx.lineWidth=1.6;
ctx.beginPath();ctx.moveTo(-5,-36);ctx.lineTo(-6,-41);ctx.moveTo(0,-36);ctx.lineTo(0,-42);ctx.moveTo(5,-36);ctx.lineTo(6,-40);ctx.stroke();

// olhos grandes arregalados com pupilas pequenas
ctx.fillStyle=boss?'#e4ffd6':'#f0f8e9';
ctx.beginPath();ctx.ellipse(-4.8,-29,4.2,3.6,0,0,7);ctx.ellipse(4.8,-29,4.2,3.6,0,0,7);ctx.fill();
ctx.fillStyle=boss?'#b7ff7a':'#232323';
ctx.beginPath();ctx.arc(-4.3,-28.7,boss?1.2:0.95,0,7);ctx.arc(4.3,-28.7,boss?1.2:0.95,0,7);ctx.fill();
if(boss){ctx.fillStyle='rgba(167,255,117,.42)';ctx.beginPath();ctx.arc(-4.8,-29,6.2,0,7);ctx.arc(4.8,-29,6.2,0,7);ctx.fill();}

// boca aberta + dentes quebrados/tortos
ctx.fillStyle='#2e1c1b';ctx.beginPath();ctx.roundRect(-6.8,-22,13.6,6.4,2.6);ctx.fill();
ctx.fillStyle='#d6d0bd';
ctx.fillRect(-5.5,-22,2.2,2.1);ctx.fillRect(-1.8,-22,1.7,1.6);ctx.fillRect(2.7,-22,2.4,1.8);
ctx.fillRect(-4.7,-16.6,1.9,1.8);ctx.fillRect(1.1,-16.4,2.3,1.5);

if(flash){ctx.fillStyle='rgba(255,0,0,.26)';ctx.fillRect(-16,-39,32,58);}
if(z.burn>0){ctx.fillStyle='rgba(255,110,30,.25)';ctx.beginPath();ctx.arc(0,-3,20+Math.sin(z.step)*2,0,7);ctx.fill();}
if(z.freeze>0){ctx.fillStyle='rgba(130,210,255,.33)';ctx.beginPath();ctx.arc(0,-2,22,0,7);ctx.fill();}
ctx.restore();}
function draw(){ctx.clearRect(0,0,960,540);if(mode==='menu'){ctx.fillStyle='#111d24';ctx.fillRect(0,0,960,540);ctx.fillStyle='#fff';ctx.font='bold 42px Arial';ctx.fillText('Defesa da Torre Zumbi',230,100);for(let i=1;i<=MAX_PHASES;i++){const x=90+(i-1)*170,y=230,l=i>unlocked;ctx.fillStyle=l?'#3a3a3a':'#2f5f43';ctx.fillRect(x,y,150,110);ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.fillText(`Fase ${i}`,x+25,y+40);ctx.font='14px Arial';ctx.fillText(phases[i-1].name,x+34,y+65);ctx.fillText(`${PHASE_WAVES[i-1]} ondas`,x+35,y+88);if(l)ctx.fillText('🔒 bloqueada',x+28,y+104);}return;}
const ph=phases[phase-1];ctx.fillStyle=ph.theme;ctx.fillRect(0,0,960,540);ctx.fillStyle=ph.ground;for(let i=0;i<70;i++)ctx.fillRect((i*131)%960,(i*97)%540,18,12);
ctx.strokeStyle='#6b4e39';ctx.lineWidth=90;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(const p of path.slice(1))ctx.lineTo(p.x,p.y);ctx.stroke();
for(let i=0;i<slots.length;i++){if(towers.some(t=>t.slot===i))continue;const s=slots[i];ctx.fillStyle='rgba(37,58,48,.9)';ctx.beginPath();ctx.arc(s.x,s.y,21,0,7);ctx.fill();ctx.fillStyle='#dbe7ef';ctx.font='bold 22px Arial';ctx.fillText('+',s.x-7,s.y+8);}for(const t of towers){ctx.fillStyle='#6b655d';ctx.beginPath();ctx.roundRect(t.x-13,t.y-8,26,20,6);ctx.fill();ctx.strokeStyle=t.color;ctx.beginPath();ctx.arc(t.x,t.y-14,8,0,7);ctx.stroke();}
for(const p of shots){ctx.fillStyle=p.e==='fire'?'#ff6b35':p.e==='water'?'rgba(120,220,255,.7)':p.e==='leaf'?'#9ae070':'#d9f5ff';ctx.beginPath();ctx.arc(p.x,p.y,p.e==='water'?8:4,0,7);ctx.fill();}
for(const e of fx){if(e.type==='lightning'&&e.target){ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(e.target.x+e.off,0);ctx.lineTo(e.target.x,e.target.y);ctx.stroke();}if(e.type==='fireSpray'){ctx.strokeStyle='rgba(255,120,40,.85)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.tx,e.ty);ctx.stroke();}if(e.type==='fireAura'&&e.target){ctx.fillStyle='rgba(255,90,30,.34)';ctx.beginPath();ctx.arc(e.target.x,e.target.y-12,20,0,7);ctx.fill();}if(e.type==='iceSpray'){ctx.strokeStyle='rgba(180,235,255,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.tx,e.ty);ctx.stroke();}if(e.type==='iceAura'&&e.target){ctx.strokeStyle='rgba(160,220,255,.9)';ctx.beginPath();ctx.arc(e.target.x,e.target.y-6,22,0,7);ctx.stroke();}if(e.type==='waterWave'){ctx.strokeStyle='rgba(130,220,255,.8)';ctx.beginPath();ctx.arc(e.x,e.y,34-e.life*.8,0,7);ctx.stroke();}if(e.type==='tornado'&&e.target){ctx.strokeStyle='rgba(240,250,255,.9)';for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(e.target.x,e.target.y-22+i*10,8+i*6,3+i*2,e.life*.15,0,7);ctx.stroke();}}if(e.type==='thorns'){ctx.strokeStyle='rgba(132,208,88,.9)';ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+Math.cos(a)*18,e.y+Math.sin(a)*18);}ctx.stroke();}if(e.type==='smoke'){ctx.fillStyle='rgba(130,130,130,.25)';ctx.beginPath();ctx.arc(e.x,e.y-(42-e.life)*.5,16,0,7);ctx.fill();}if(e.type==='gib'){e.x+=e.vx;e.y+=e.vy;e.vy+=.15;ctx.fillStyle='rgba(120,20,20,.7)';ctx.fillRect(e.x,e.y,3,3);}}
for(const z of zombies)dz(z);
}
function end(win){mode='end';snd('over');els.gameOverPanel.style.display='flex';els.gameOverPanel.innerHTML=`<div id='gameOverSign' style='cursor:pointer;user-select:none;padding:20px 34px;border-radius:18px;background:${win?'linear-gradient(180deg,#0b2a12,#041007)':'linear-gradient(180deg,#2a0b0b,#130303)'};border:3px solid #ffd5a0;color:#fff;text-align:center;box-shadow:0 18px 42px rgba(0,0,0,.65);animation:signDrop .75s ease-out'><h2 style='font-size:56px;letter-spacing:2px;margin:0;color:${win?'#4dff83':'#ff3d3d'}'>${win?'FASE CONCLUÍDA':'GAME OVER'}</h2><p style='margin:8px 0 0;color:#ffd9b1'>Toque para voltar ao menu</p></div>`;document.getElementById('gameOverSign').onclick=()=>{els.gameOverPanel.style.display='none';mode='menu';if(win&&phase===unlocked&&unlocked<MAX_PHASES){unlocked++;localStorage.setItem(key,unlocked);}hud();};}
function loop(){update();draw();requestAnimationFrame(loop);} 
cvs.addEventListener('click',e=>{if(ac.state==='suspended')ac.resume();const r=cvs.getBoundingClientRect(),x=(e.clientX-r.left)*960/r.width,y=(e.clientY-r.top)*540/r.height;if(mode==='menu'){for(let i=1;i<=MAX_PHASES;i++){const bx=90+(i-1)*170,by=230;if(x>bx&&x<bx+150&&y>by&&y<by+110&&i<=unlocked){phase=i;const ph=phases[i-1];path=ph.path;slots=ph.slots;vidaVal=1000;money=180;wave=1;towers.length=zombies.length=shots.length=fx.length=0;mode='playing';startWave();}}return;}if(mode!=='playing')return;const t=towers.find(tt=>d(tt,{x,y})<20);if(t){sel=t;els.upgradePanel.style.display='flex';els.upgradeContent.innerHTML=`<div class='row'><strong>${t.label}</strong><strong>Lv ${t.level}</strong></div>`;return;}const i=slots.findIndex((s,ix)=>d(s,{x,y})<24&&!towers.some(t=>t.slot===ix));if(i>=0){slotActive=i;els.shopTray.style.display='block';els.towerBar.innerHTML='';for(const tt of types){const b=document.createElement('button');b.className='tower-option';b.innerHTML=`<strong>${tt.n}</strong><small>${tt.c}💰 • alcance ${tt.r}</small>`;b.onclick=()=>build(tt);els.towerBar.appendChild(b);}return;}els.shopTray.style.display='none';slotActive=-1;});
els.closeShop.onclick=()=>{els.shopTray.style.display='none';slotActive=-1;};els.panelUpgrade.onclick=()=>{if(!sel)return;const c=20+sel.level*18;if(sel.level>=MAX_TOWER_LEVEL||money<c)return;money-=c;sel.level++;sel.total+=c;sel.dmg=Math.round((sel.dmg+2)*1.05);sel.range+=6;sel.rate=Math.max(8,Math.round(sel.rate*.95));};els.panelSell.onclick=()=>{if(!sel)return;money+=Math.round(sel.total*.7);towers.splice(towers.indexOf(sel),1);sel=null;els.upgradePanel.style.display='none';};els.panelClose.onclick=()=>els.upgradePanel.style.display='none';
hud();loop();
})();
</script>
