<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xadrez — Jubis Games</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #1b1245, #090716 60%);
      color: #f5f5ff;
      text-align: center;
      padding: 20px;
    }
    main {
      width: min(620px, 94vw);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 70px -45px rgba(0, 0, 0, 0.8);
    }
    a { color: #3de2ff; }
    .emoji { font-size: 52px; margin: 0 0 10px; }
  </style>
</head>
<body>
  <main>
    <p class="emoji">♞</p>
    <h1>Xadrez</h1>
    <p>Seu jogo <strong>Xadrez</strong> já está publicado na lista da Jubis Games.</p>
    <p>Use este espaço para evoluir o jogo com regras completas, IA e cronômetro.</p>
    <p><a href="../../">← Voltar para o catálogo</a></p>
  </main>
</body>
</html>
