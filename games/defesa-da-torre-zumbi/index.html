<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Defesa da Torre de Zumbi</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:radial-gradient(circle at top, #163725 0%, #09120d 64%); color:#f4ffe8; display:grid; place-items:center; min-height:100vh; padding:46px 0 16px; }
    h1{margin:14px 0 8px; letter-spacing:.5px; text-shadow:0 3px 10px rgba(0,0,0,.45);}
    #hud { display:flex; gap:16px; justify-content:center; margin:10px 0; font-weight:bold; flex-wrap:wrap; background:rgba(6,20,12,.55); border:1px solid #75c35d; border-radius:12px; padding:8px 14px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
    #actions{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:8px;background:rgba(8,24,15,.45);padding:10px 12px;border-radius:12px;border:1px solid rgba(158,255,107,.35);}
    button{background:linear-gradient(180deg,#325d45,#234030);color:#e9ffd8;border:1px solid #9cff6b;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);}
    button:disabled{opacity:.5;cursor:not-allowed;}
    canvas { background:#1a2e20; border:2px solid #9cff6b; width:min(95vw,960px); aspect-ratio:16/9; height:auto; border-radius:14px; box-shadow:0 12px 34px rgba(0,0,0,.45); }
    .help{opacity:.95; font-size:14px; text-align:center; margin-top:10px; max-width:960px; background:rgba(7,18,11,.55); border:1px solid rgba(156,255,107,.32); padding:8px 10px; border-radius:10px;}
    .back{position:fixed;top:12px;left:12px;z-index:20;color:#d8ffbe;text-decoration:none;font-weight:700;background:rgba(5,18,10,.72);padding:8px 10px;border:1px solid #9cff6b;border-radius:10px;}
    .back:hover{text-decoration:underline;}
  </style>
</head>
<body>
  <a class="back" href="../../index.php">← Voltar</a>
  <h1>🧟 Defesa da Torre de Zumbi</h1>
  <div id="hud">
    <span id="vida"></span>
    <span id="dinheiro"></span>
    <span id="onda"></span>
  </div>
  <div id="actions">
    <button id="towerCycleBtn">Torre: 🔫 Básica</button>
    <button id="upgradeBtn" disabled>Selecione uma torre para melhorar</button>
    <span id="towerInfo">Sem torre selecionada</span>
  </div>
  <canvas id="game" width="960" height="540"></canvas>
  <div class="help">Clique no gramado para construir torres (custo 30). Clique em uma torre para selecionar e melhorar. Sobreviva a ondas cada vez maiores e mais rápidas.</div>

<script>
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const path = [
  {x:0,y:260},{x:180,y:260},{x:180,y:130},{x:420,y:130},{x:420,y:400},{x:670,y:400},{x:670,y:220},{x:960,y:220}
];

let vida=20, dinheiro=120, onda=1, kills=0;
const torres=[]; const zumbis=[]; const tiros=[];
let spawnLeft = 0;
let spawnedInWave = 0;
let spawnCooldown = 0;
let selectedTower = null;

const vidaEl=document.getElementById('vida');
const dinheiroEl=document.getElementById('dinheiro');
const ondaEl=document.getElementById('onda');
const towerInfoEl=document.getElementById('towerInfo');
const upgradeBtn=document.getElementById('upgradeBtn');
const towerCycleBtn=document.getElementById('towerCycleBtn');
const towerTypes = [
  { key:'basic', name:'🔫 Básica', cost:30, range:145, dmg:12, rate:30, projSpeed:5.5, color:'#4fc3f7', core:'#15374e' },
  { key:'fire', name:'🔥 Fogo', cost:42, range:128, dmg:18, rate:36, projSpeed:4.8, color:'#ff9b42', core:'#5a1f08' },
  { key:'ice', name:'❄️ Gelo', cost:40, range:165, dmg:9, rate:28, projSpeed:5.2, color:'#8ae2ff', core:'#0e3b4d' },
  { key:'poison', name:'☠️ Veneno', cost:46, range:150, dmg:8, rate:32, projSpeed:5, color:'#b8ff6e', core:'#335918' }
];
let selectedTowerType = 0;

function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

function waveStats(w) {
  const amount = 8 + w * 3;
  const hp = 26 + w * 8 + Math.floor(w * w * 0.8);
  const speed = 0.95 + w * 0.09;
  const spawnGap = Math.max(14, 36 - w);
  const reward = 18 + w * 4;
  return { amount, hp, speed, spawnGap, reward };
}

function startWave(){
  const stats = waveStats(onda);
  spawnLeft = stats.amount;
  spawnedInWave = 0;
  spawnCooldown = 1;
}

function spawnZombie(){
  const stats = waveStats(onda);
  const variety = (spawnedInWave % 5 === 0 && onda >= 3) ? 1.6 : 1;
  zumbis.push({
    x:path[0].x,y:path[0].y,seg:0,
    hp:Math.floor(stats.hp * variety),
    maxHp:Math.floor(stats.hp * variety),
    speed:stats.speed * (variety > 1 ? 0.85 : 1),
    reward:Math.floor(stats.reward * variety),
    dead:false
  });
  spawnedInWave++;
}

function updateZombie(z){
  const next = path[z.seg+1]; if(!next){vida--; z.dead=true; return;}
  const velocity = z.speed * (1 - (z.slowAmount || 0));
  const dx=next.x-z.x, dy=next.y-z.y; const d=Math.hypot(dx,dy);
  if(d<velocity){z.x=next.x; z.y=next.y; z.seg++;}
  else {z.x += dx/d*velocity; z.y += dy/d*velocity;}
}

function towerUpgradeCost(t){ return 25 + t.level * 20; }

function upgradeTower(t){
  const cost = towerUpgradeCost(t);
  if(dinheiro < cost) return false;
  dinheiro -= cost;
  t.level++;
  t.dmg = Math.round((t.dmg + 4) * 1.06);
  t.range += 10;
  t.rate = Math.max(10, Math.round(t.rate * 0.92));
  if(t.type === 'fire') t.burn = Math.min(0.58, (t.burn || 0.3) + 0.03);
  if(t.type === 'ice') t.slow = Math.min(0.55, (t.slow || 0.28) + 0.03);
  if(t.type === 'poison') t.poison = Math.min(7, (t.poison || 4) + 1);
  return true;
}

function updateTowerUi(){
  if(!selectedTower){
    upgradeBtn.disabled = true;
    upgradeBtn.textContent = 'Selecione uma torre para melhorar';
    towerInfoEl.textContent = 'Sem torre selecionada';
    return;
  }
  const cost = towerUpgradeCost(selectedTower);
  const enough = dinheiro >= cost;
  upgradeBtn.disabled = !enough;
  upgradeBtn.textContent = `⬆️ Melhorar torre (Lv ${selectedTower.level} → ${selectedTower.level+1}) - ${cost}💰`;
  towerInfoEl.textContent = `${selectedTower.label} Lv ${selectedTower.level} | Dano ${selectedTower.dmg} | Alcance ${selectedTower.range} | Cadência ${selectedTower.rate}`;
}

function gameLoop(){
  if(vida<=0){ draw(); ctx.fillStyle='#ff3333'; ctx.font='bold 64px Arial'; ctx.fillText('GAME OVER', 300, 280); return; }

  spawnCooldown--;
  if(spawnLeft>0 && spawnCooldown<=0){
    spawnZombie();
    spawnLeft--;
    spawnCooldown=waveStats(onda).spawnGap;
  }

  if(spawnLeft===0 && zumbis.length===0){
    dinheiro += 30 + onda * 8;
    onda++;
    startWave();
  }

  for(const t of torres){
    t.cd--;
    if(t.cd<=0){
      const alvo = zumbis.find(z=>!z.dead && dist(z,t)<=t.range);
      if(alvo){ tiros.push({x:t.x,y:t.y,target:alvo,dmg:t.dmg,speed:t.projSpeed||5.5,effect:t.type,burn:t.burn,slow:t.slow,poison:t.poison}); t.cd=t.rate; }
    }
  }

  for(const tiro of tiros){
    if(!tiro.target || tiro.target.dead){ tiro.dead=true; continue; }
    const dx=tiro.target.x-tiro.x, dy=tiro.target.y-tiro.y; const d=Math.hypot(dx,dy);
    if(d<tiro.speed+4){
      tiro.target.hp -= tiro.dmg;
      if(tiro.effect === 'fire'){
        tiro.target.burnTicks = 90;
        tiro.target.burnDps = Math.max(tiro.target.burnDps || 0, Math.ceil(tiro.dmg * (tiro.burn || 0.3)));
      } else if(tiro.effect === 'ice'){
        tiro.target.slowTicks = 80;
        tiro.target.slowAmount = Math.max(tiro.target.slowAmount || 0, (tiro.slow || 0.28));
      } else if(tiro.effect === 'poison'){
        tiro.target.poisonTicks = 140;
        tiro.target.poisonDps = Math.max(tiro.target.poisonDps || 0, (tiro.poison || 4));
      }
      tiro.dead=true;
      if(tiro.target.hp<=0){
        tiro.target.dead=true;
        kills++;
        dinheiro+=tiro.target.reward;
      }
    }
    else { tiro.x += dx/d*tiro.speed; tiro.y += dy/d*tiro.speed; }
  }

  for(const z of zumbis){
    if(z.burnTicks>0){ z.hp -= (z.burnDps || 0) / 60; z.burnTicks--; }
    if(z.poisonTicks>0){ z.hp -= (z.poisonDps || 0) / 60; z.poisonTicks--; }
    if(z.slowTicks>0){ z.slowTicks--; } else { z.slowAmount = 0; }
    if(z.hp<=0 && !z.dead){
      z.dead=true;
      kills++;
      dinheiro+=z.reward;
    }
  }

  for(const z of zumbis) updateZombie(z);

  for(const arr of [zumbis,tiros]){
    for(let i=arr.length-1;i>=0;i--) if(arr[i].dead) arr.splice(i,1);
  }

  draw();
  requestAnimationFrame(gameLoop);
}

function drawPath(){
  ctx.strokeStyle='#65462d'; ctx.lineWidth=62; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(path[0].x,path[0].y);
  for(const p of path.slice(1)) ctx.lineTo(p.x,p.y);
  ctx.stroke();
  ctx.strokeStyle='#b58857'; ctx.lineWidth=46; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(path[0].x,path[0].y);
  for(const p of path.slice(1)) ctx.lineTo(p.x,p.y);
  ctx.stroke();
  ctx.strokeStyle='rgba(255,223,173,.22)'; ctx.lineWidth=6;
  ctx.setLineDash([15, 16]);
  ctx.beginPath(); ctx.moveTo(path[0].x,path[0].y);
  for(const p of path.slice(1)) ctx.lineTo(p.x,p.y);
  ctx.stroke();
  ctx.setLineDash([]);
}

function draw(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  const bgGradient = ctx.createLinearGradient(0,0,0,cvs.height);
  bgGradient.addColorStop(0,'#2f6a35');
  bgGradient.addColorStop(1,'#244e29');
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0,0,cvs.width,cvs.height);
  for(let i=0;i<26;i++){
    const x=(i*147)%cvs.width;
    const y=(i*89)%cvs.height;
    ctx.fillStyle='rgba(255,255,255,.05)';
    ctx.fillRect(x,y,2,2);
  }
  drawPath();
  ctx.fillStyle='#d9ffbf';
  ctx.fillRect(910,184,40,72);
  ctx.fillStyle='rgba(217,255,191,.35)';
  ctx.fillRect(900,176,56,88);

  for(const t of torres){
    ctx.fillStyle=(t===selectedTower)?'#9de9ff':t.color;
    ctx.beginPath(); ctx.arc(t.x,t.y,15,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=t.core;
    ctx.beginPath(); ctx.arc(t.x,t.y,8,0,Math.PI*2); ctx.fill();
    if(t===selectedTower){
      ctx.strokeStyle='#e8ff5b'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(t.x,t.y,20,0,Math.PI*2); ctx.stroke();
      ctx.lineWidth=1;
    }
    ctx.strokeStyle='rgba(79,195,247,.2)'; ctx.beginPath(); ctx.arc(t.x,t.y,t.range,0,Math.PI*2); ctx.stroke();
  }

  for(const z of zumbis){
    if(z.poisonTicks>0) ctx.fillStyle='#9cf36f';
    else if(z.burnTicks>0) ctx.fillStyle='#ff9452';
    else if(z.slowTicks>0) ctx.fillStyle='#9ce9ff';
    else ctx.fillStyle='#88ff55';
    ctx.beginPath(); ctx.arc(z.x,z.y,14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#22361a'; ctx.beginPath(); ctx.arc(z.x+4,z.y-3,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#22361a'; ctx.beginPath(); ctx.arc(z.x-5,z.y-2,3.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.fillRect(z.x-16,z.y-24,32,4);
    ctx.fillStyle='#ff4a4a'; ctx.fillRect(z.x-16,z.y-24,32*(z.hp/z.maxHp),4);
  }

  for(const t of tiros){ ctx.fillStyle='#ffe082'; ctx.beginPath(); ctx.arc(t.x,t.y,4,0,Math.PI*2); ctx.fill(); }

  vidaEl.textContent = `❤️ Vida: ${vida}`;
  dinheiroEl.textContent = `💰 Dinheiro: ${dinheiro}`;
  ondaEl.textContent = `🌊 Onda: ${onda} | ☠️ Kills: ${kills} | Restantes: ${spawnLeft + zumbis.length}`;
  updateTowerUi();
}

cvs.addEventListener('click', e=>{
  const r=cvs.getBoundingClientRect();
  const scaleX=cvs.width/r.width, scaleY=cvs.height/r.height;
  const x=(e.clientX-r.left)*scaleX, y=(e.clientY-r.top)*scaleY;

  const clickedTower = torres.find(t=>dist(t,{x,y})<18);
  if(clickedTower){
    selectedTower = clickedTower;
    updateTowerUi();
    return;
  }

  const type = towerTypes[selectedTowerType];
  const buildCost = type.cost;
  if(dinheiro<buildCost) return;
  if(torres.some(t=>dist(t,{x,y})<36)) return;
  const closePath = path.some((p,i)=> i<path.length-1 && pointSegDist({x,y},path[i],path[i+1])<34);
  if(closePath) return;
  const tower={x,y,range:type.range,dmg:type.dmg,rate:type.rate,cd:0,level:1,type:type.key,label:type.name,color:type.color,core:type.core,projSpeed:type.projSpeed};
  if(type.key==='fire') tower.burn = 0.3;
  if(type.key==='ice') tower.slow = 0.28;
  if(type.key==='poison') tower.poison = 4;
  torres.push(tower);
  dinheiro-=buildCost;
  selectedTower = tower;
  updateTowerUi();
});

upgradeBtn.addEventListener('click', ()=>{
  if(selectedTower) upgradeTower(selectedTower);
});

towerCycleBtn.addEventListener('click', ()=>{
  selectedTowerType = (selectedTowerType + 1) % towerTypes.length;
  towerCycleBtn.textContent = `Torre: ${towerTypes[selectedTowerType].name} (${towerTypes[selectedTowerType].cost}💰)`;
});

window.addEventListener('keydown', (e)=>{
  if((e.key === 'u' || e.key === 'U') && selectedTower){
    upgradeTower(selectedTower);
  }
});

function pointSegDist(p,a,b){
  const l2=(b.x-a.x)**2+(b.y-a.y)**2; if(!l2) return dist(p,a);
  let t=((p.x-a.x)*(b.x-a.x)+(p.y-a.y)*(b.y-a.y))/l2; t=Math.max(0,Math.min(1,t));
  return dist(p,{x:a.x+t*(b.x-a.x), y:a.y+t*(b.y-a.y)});
}

startWave();
towerCycleBtn.textContent = `Torre: ${towerTypes[selectedTowerType].name} (${towerTypes[selectedTowerType].cost}💰)`;
gameLoop();
</script>
</body>
</html>
