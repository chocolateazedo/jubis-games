<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Defesa Zumbi VIP</title>
  <desc id="desc">Thumbnail premium em estilo cartoon neon de tower defense com zumbis e torres futuristas.</desc>
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120a34"/>
      <stop offset="55%" stop-color="#23115a"/>
      <stop offset="100%" stop-color="#09061f"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.72" cy="0.18" r="0.42">
      <stop offset="0%" stop-color="#93f5ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#93f5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonPath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6bffea"/>
      <stop offset="40%" stop-color="#5fd4ff"/>
      <stop offset="100%" stop-color="#b470ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f264f"/>
      <stop offset="100%" stop-color="#0f1330"/>
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#6ef7ff" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bgSky)"/>
  <rect width="1200" height="700" fill="url(#moonGlow)"/>

  <g opacity="0.5" fill="#9f8fff">
    <circle cx="108" cy="88" r="3"/>
    <circle cx="210" cy="136" r="2"/>
    <circle cx="356" cy="74" r="3"/>
    <circle cx="920" cy="78" r="3"/>
    <circle cx="1032" cy="152" r="2"/>
    <circle cx="1120" cy="98" r="3"/>
  </g>

  <path d="M0 520 C180 470, 340 560, 520 500 C700 442, 900 560, 1200 490 L1200 700 L0 700 Z" fill="url(#ground)"/>

  <path d="M70 210 H390 V285 H680 V195 H1080 V330 H740 V430 H1040" fill="none" stroke="url(#neonPath)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonBlur)"/>

  <g filter="url(#softGlow)">
    <g transform="translate(260 390)">
      <circle r="58" fill="#77f7ff"/>
      <circle r="35" fill="#213560"/>
      <rect x="-12" y="-86" width="24" height="34" rx="8" fill="#b3feff"/>
    </g>
    <g transform="translate(520 510)">
      <circle r="62" fill="#ff8bff"/>
      <circle r="35" fill="#45245f"/>
      <polygon points="0,-94 16,-62 -16,-62" fill="#ffd2ff"/>
    </g>
    <g transform="translate(740 180)">
      <circle r="60" fill="#8dff8f"/>
      <circle r="34" fill="#1f4d39"/>
      <rect x="-10" y="-84" width="20" height="30" rx="6" fill="#ccffd0"/>
    </g>
  </g>

  <g>
    <g transform="translate(835 520)">
      <rect x="0" y="0" width="84" height="84" rx="16" fill="#77d96e"/>
      <circle cx="24" cy="30" r="8" fill="#244d22"/>
      <circle cx="56" cy="34" r="8" fill="#244d22"/>
      <rect x="28" y="54" width="28" height="8" rx="4" fill="#244d22"/>
    </g>
    <g transform="translate(930 540)">
      <rect x="0" y="0" width="84" height="84" rx="16" fill="#7ee070"/>
      <circle cx="24" cy="30" r="8" fill="#244d22"/>
      <circle cx="56" cy="34" r="8" fill="#244d22"/>
      <rect x="28" y="54" width="28" height="8" rx="4" fill="#244d22"/>
    </g>
    <g transform="translate(1024 560)">
      <rect x="0" y="0" width="84" height="84" rx="16" fill="#89eb75"/>
      <circle cx="24" cy="30" r="8" fill="#244d22"/>
      <circle cx="56" cy="34" r="8" fill="#244d22"/>
      <rect x="28" y="54" width="28" height="8" rx="4" fill="#244d22"/>
    </g>
  </g>

  <text x="72" y="596" fill="#ffffff" font-size="78" font-weight="900" font-family="'Rubik', Arial, sans-serif" letter-spacing="2">DEFESA ZUMBI VIP</text>
  <text x="74" y="644" fill="#80eaff" font-size="34" font-weight="700" font-family="'Rubik', Arial, sans-serif">Tower Defense • Cartoon Neon • Jubis Games</text>
</svg>
