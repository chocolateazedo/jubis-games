<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Defesa da Torre de Zumbi</title>
  <style>
    :root{--bg:#050709;--ui:#dbe3dc}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% -20%,#243129 0%,#101619 45%,#05070a 100%);color:var(--ui);min-height:100vh;display:flex;justify-content:center;padding:clamp(8px,2vw,14px)}
    .game-shell{width:min(100%,1120px);position:relative;padding-top:64px}
    .back{position:absolute;top:10px;left:10px;z-index:99;color:#d8ffbe;text-decoration:none;font-weight:700;background:rgba(5,18,10,.82);padding:8px 10px;border:1px solid rgba(183,255,99,.55);border-radius:12px}
    #hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(98%,1080px);padding:0 56px}
    .hud-chip{background:linear-gradient(180deg,rgba(24,46,37,.9),rgba(12,28,21,.92));border:1px solid rgba(190,255,124,.4);padding:7px 11px;border-radius:999px;font-weight:800;font-size:clamp(12px,1.6vw,15px);white-space:nowrap}
    canvas{display:block;width:100%;aspect-ratio:16/9;max-height:calc(100vh - 180px);height:auto;border-radius:clamp(16px,2vw,28px);border:2px solid rgba(183,255,99,.55);box-shadow:0 16px 48px rgba(0,0,0,.6),0 0 42px rgba(134,255,109,.18) inset;touch-action:manipulation}
    #slotInfo{margin-top:8px;text-align:center;font-weight:700;opacity:.95;padding:0 8px}
    #shopTray{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(98%,980px);z-index:60;background:linear-gradient(180deg,rgba(21,35,28,.95),rgba(12,24,18,.97));border:1px solid rgba(183,255,99,.45);border-radius:22px;padding:12px;display:none}
    #towerBar{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}.tower-option{flex:0 0 132px;background:linear-gradient(180deg,#335f49,#203a2c);border:1px solid rgba(201,255,146,.5);border-radius:14px;padding:10px;cursor:pointer;color:#efffde;text-align:left}
    .xbtn{background:#263d30;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer}
    .panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9990;background:rgba(0,0,0,.72)}
    .card{width:min(92vw,560px);background:linear-gradient(180deg,#193928,#11271c);border:1px solid rgba(156,255,107,.5);border-radius:16px;padding:16px;position:relative}
    .row{display:flex;justify-content:space-between;gap:8px;margin:8px 0} button{background:linear-gradient(180deg,#325d45,#234030);color:#e9ffd8;border:1px solid #9cff6b;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
    .upgrade-close{position:absolute;right:10px;top:10px}

    @media (max-width: 900px){
      .game-shell{padding-top:88px}
      #hud{padding:0 8px}
      .back{top:8px;left:8px;font-size:13px;padding:7px 9px}
      #shopTray{bottom:8px;padding:10px;border-radius:16px}
      #towerBar{gap:8px}
      .tower-option{flex-basis:120px;padding:8px}
    }
    @media (max-width: 640px){
      body{padding:6px}
      .game-shell{padding-top:110px}
      #hud{top:56px;gap:6px}
      .hud-chip{padding:6px 9px;font-size:12px}
      #slotInfo{font-size:13px}
      canvas{max-height:calc(100vh - 220px)}
    }
    @keyframes signDrop{0%{transform:translateY(-260px) scale(.9)}70%{transform:translateY(26px) scale(1.04)}100%{transform:translateY(0) scale(1)}}
  </style>
</head>
<body>
<div class="game-shell">
  <a class="back" href="../../index.php">← Voltar</a>
  <div id="hud"><span id="vida" class="hud-chip"></span><span id="dinheiro" class="hud-chip"></span><span id="onda" class="hud-chip"></span><span id="towerInfo" class="hud-chip">Sem torre selecionada</span></div>
  <canvas id="game" width="960" height="540"></canvas>
  <div id="slotInfo">Toque em um slot <strong>＋</strong> para abrir a loja de torres.</div>
  <div id="shopTray"><div class="row"><span>Escolha uma torre</span><button id="closeShop" class="xbtn">✖</button></div><div id="towerBar"></div></div>
</div>
<div id="upgradePanel" class="panel"><div class="card"><button id="panelClose" class="xbtn upgrade-close">✖</button><h3>🔧 Upgrade da Torre</h3><div id="upgradeContent"></div><div class="row"><button id="panelUpgrade">⬆️ Upar</button><button id="panelSell">💸 Vender</button></div></div></div>
<div id="gameOverPanel" class="panel"></div>
<script>
(()=>{const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');const els={vida:vida,dinheiro:dinheiro,onda:onda,towerInfo:towerInfo,towerBar:towerBar,shopTray:shopTray,closeShop:closeShop,upgradePanel:upgradePanel,upgradeContent:upgradeContent,panelUpgrade:panelUpgrade,panelSell:panelSell,panelClose:panelClose,gameOverPanel:gameOverPanel};
const MAX_TOWER_LEVEL=50;let mode='playing',vidaVal=1000,money=220,wave=1,slotActive=-1,spawn=0,spawned=0,cool=0,sel=null;
const path=[{x:-20,y:275},{x:120,y:240},{x:230,y:300},{x:350,y:215},{x:510,y:270},{x:650,y:190},{x:780,y:295},{x:980,y:250}],slots=[{x:110,y:355},{x:210,y:180},{x:315,y:360},{x:420,y:155},{x:560,y:350},{x:640,y:110},{x:790,y:380},{x:840,y:160}],towers=[],zombies=[],shots=[],fx=[];
const types=[{k:'fire',n:'Fogo',sym:'🔥',c:44,r:125,dmg:12,rt:30,sp:6,col:'#df6038'},{k:'ice',n:'Gelo',sym:'❄',c:46,r:130,dmg:4,rt:32,sp:6,col:'#75b8e8'},{k:'water',n:'Água',sym:'💧',c:38,r:155,dmg:8,rt:17,sp:7,col:'#3f8bc8'},{k:'wind',n:'Vento',sym:'🌀',c:40,r:185,dmg:4,rt:22,sp:6,col:'#c9def1'},{k:'leaf',n:'Folha',sym:'🍃',c:37,r:132,dmg:9,rt:15,sp:7,col:'#6fad67'},{k:'light',n:'Raio',sym:'⚡',c:58,r:170,dmg:38,rt:42,sp:7,col:'#ceb7ff'}];
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
const sfxCooldown={fire:0,ice:0,water:0,wind:0,light:0,hit:0};
function playSfx(kind){if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;if(sfxCooldown[kind]&&now-sfxCooldown[kind]<0.05)return;sfxCooldown[kind]=now;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();o.connect(f);f.connect(g);g.connect(audioCtx.destination);g.gain.value=.0001;const n=audioCtx.currentTime;
if(kind==='fire'){o.type='sawtooth';o.frequency.setValueAtTime(220,n);o.frequency.exponentialRampToValueAtTime(120,n+.14);f.type='bandpass';f.frequency.value=950;g.gain.exponentialRampToValueAtTime(.08,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+.18);o.start(n);o.stop(n+.2);}
if(kind==='ice'){o.type='triangle';o.frequency.setValueAtTime(760,n);o.frequency.exponentialRampToValueAtTime(340,n+.12);f.type='highpass';f.frequency.value=520;g.gain.exponentialRampToValueAtTime(.06,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+.16);o.start(n);o.stop(n+.17);}
if(kind==='water'){o.type='sine';o.frequency.setValueAtTime(390,n);o.frequency.exponentialRampToValueAtTime(160,n+.18);f.type='lowpass';f.frequency.value=1200;g.gain.exponentialRampToValueAtTime(.08,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+.2);o.start(n);o.stop(n+.22);}
if(kind==='wind'){o.type='triangle';o.frequency.setValueAtTime(460,n);o.frequency.exponentialRampToValueAtTime(180,n+.2);f.type='bandpass';f.frequency.value=620;g.gain.exponentialRampToValueAtTime(.06,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+.22);o.start(n);o.stop(n+.24);}
if(kind==='light'){o.type='square';o.frequency.setValueAtTime(1200,n);o.frequency.exponentialRampToValueAtTime(220,n+.08);f.type='highpass';f.frequency.value=680;g.gain.exponentialRampToValueAtTime(.1,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+.1);o.start(n);o.stop(n+.11);}
if(kind==='hit'){o.type='square';o.frequency.setValueAtTime(180,n);o.frequency.exponentialRampToValueAtTime(95,n+.05);f.type='lowpass';f.frequency.value=500;g.gain.exponentialRampToValueAtTime(.05,n+.005);g.gain.exponentialRampToValueAtTime(.0001,n+.08);o.start(n);o.stop(n+.1);}}
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),isBoss=()=>wave%15===0,ws=()=>isBoss()?{amount:1,hp:2500+wave*180,speed:.35,reward:220+wave*8,gap:50}:{amount:12+wave*2,hp:90+wave*16,speed:1+wave*.05,reward:18+wave*4,gap:Math.max(8,28-wave/2)};
function startWave(){const s=ws();spawn=s.amount;spawned=0;cool=1;}startWave();
function spawnZombie(){const s=ws();const boss=isBoss();const runner=!boss&&spawned%3===0;zombies.push({x:path[0].x,y:path[0].y,path,seg:0,isBoss:boss,runner,hp:s.hp*(boss?1:runner?.75:1),maxHp:s.hp*(boss?1:runner?.75:1),speed:s.speed*(boss?1:runner?2.4:1),reward:Math.round(s.reward*(runner?.8:1)),dead:false,step:Math.random()*10,burn:0,slow:0,slowF:1,freeze:0,stun:0,spin:0,hit:0});spawned++;}
function nextStats(t){return{dmg:Math.round((t.dmg+2)*1.05),range:t.range+6,rate:Math.max(8,Math.round(t.rate*.95))};}
function showPanel(t){const cost=20+t.level*18;const nxt=nextStats(t);els.panelUpgrade.textContent=t.level>=MAX_TOWER_LEVEL?'LV máximo':`⬆️ Upar (${cost}💰)`;els.upgradeContent.innerHTML=`<div class='row'><strong>${t.label}</strong><strong>Lv ${t.level}</strong></div><div>Dano: ${t.dmg} ${t.level<MAX_TOWER_LEVEL?`→ ${nxt.dmg}`:''}</div><div>Alcance: ${t.range} ${t.level<MAX_TOWER_LEVEL?`→ ${nxt.range}`:''}</div><div>Cadência: ${t.rate} ${t.level<MAX_TOWER_LEVEL?`→ ${nxt.rate}`:''}</div><div>Venda: ${Math.round(t.total*.7)}💰</div>`;}
function update(){if(mode!=='playing')return;cool--;if(spawn>0&&cool<=0){spawnZombie();spawn--;cool=ws().gap;}if(spawn===0&&!zombies.length){money+=28+wave*7;wave++;startWave();}
for(const t of towers){if(--t.cd<=0){const a=zombies.find(z=>!z.dead&&d(z,t)<=t.range);if(a){if(t.type==='light'){a.hp-=t.dmg;fx.push({type:'lightning',target:a,life:8});playSfx('light');}else shots.push({x:t.x,y:t.y,target:a,dmg:t.dmg,speed:t.sp,e:t.type,life:80});t.cd=t.rate;}}}
for(const p of shots){if(!p.target||p.target.dead){p.dead=1;continue;}const dx=p.target.x-p.x,dy=p.target.y-p.y,dd=Math.hypot(dx,dy);if(dd<p.speed+7){p.target.hp-=p.dmg;p.target.hit=1;playSfx('hit');if(p.e==='fire'){p.target.burn=130;fx.push({type:'fireSpray',x:p.x,y:p.y,tx:p.target.x,ty:p.target.y,life:15});fx.push({type:'fireAura',target:p.target,life:28});playSfx('fire');}if(p.e==='ice'){p.target.freeze=85;p.target.slow=120;p.target.slowF=.05;fx.push({type:'iceSpray',x:p.x,y:p.y,tx:p.target.x,ty:p.target.y,life:15});playSfx('ice');}if(p.e==='water'){p.target.slow=90;p.target.slowF=.55;fx.push({type:'waterWave',x:p.x,y:p.y,tx:p.target.x,ty:p.target.y,life:18});playSfx('water');}if(p.e==='wind'){p.target.stun=18;p.target.spin=30;fx.push({type:'tornado',target:p.target,life:26});playSfx('wind');}if(p.e==='leaf'){fx.push({type:'thorns',x:p.target.x,y:p.target.y,life:20});}p.dead=1;}else{p.x+=dx/dd*p.speed;p.y+=dy/dd*p.speed;if(--p.life<=0)p.dead=1;}}
for(const z of zombies){z.step+=z.runner?.48:.25;z.hit=Math.max(0,z.hit-.2);if(z.burn>0){z.burn--;z.hp-=.28;}if(z.freeze>0)z.freeze--;if(z.slow>0)z.slow--;if(z.stun>0)z.stun--;if(z.spin>0)z.spin--;const n=z.path[z.seg+1];if(!n){z.dead=1;vidaVal-=z.isBoss?vidaVal:Math.max(2,Math.round(z.hp*.22));continue;}const mv=z.stun>0?0:(z.freeze>0?.02:(z.slow>0?z.slowF:1));const v=Math.max(.04,z.speed*mv),dx=n.x-z.x,dy=n.y-z.y,dd=Math.hypot(dx,dy);if(dd<v){z.x=n.x;z.y=n.y;z.seg++;}else{z.x+=dx/dd*v;z.y+=dy/dd*v;}if(z.hp<=0){z.dead=1;money+=z.reward;}}
for(const arr of [zombies,shots])for(let i=arr.length-1;i>=0;i--)if(arr[i].dead)arr.splice(i,1);for(let i=fx.length-1;i>=0;i--){const e=fx[i];if(e.target&&e.target.dead)e.life=0;if(--e.life<=0)fx.splice(i,1);}if(vidaVal<=0)gameOver();hud();}
function dz(z){const w=Math.sin(z.step*.42),bob=Math.sin(z.step*.8)*1.6;ctx.save();ctx.translate(z.x,z.y+bob);if(z.runner)ctx.rotate(-.34);if(z.spin>0)ctx.rotate(z.step*.42);const s=z.isBoss?4.6:(z.runner?1.18:1.58);ctx.scale(s,s);ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,37,z.isBoss?28:19,8,0,0,7);ctx.fill();const body=ctx.createLinearGradient(0,-18,0,30);body.addColorStop(0,'#1f232b');body.addColorStop(1,'#090b0e');ctx.fillStyle=body;ctx.beginPath();ctx.roundRect(-13,-18,26,45,5);ctx.fill();ctx.fillStyle='#0a0d11';ctx.beginPath();ctx.moveTo(-13,-2);ctx.lineTo(-20,8);ctx.lineTo(-13,14);ctx.fill();ctx.moveTo(13,-2);ctx.lineTo(20,6);ctx.lineTo(13,14);ctx.fill();ctx.fillStyle='#141922';ctx.beginPath();ctx.roundRect(-11,25,8,14,4);ctx.roundRect(3,25,8,14,4);ctx.fill();ctx.strokeStyle='#39424c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-7,25);ctx.lineTo(-10+w*2,38);ctx.moveTo(7,25);ctx.lineTo(10-w*2,38);ctx.stroke();ctx.fillStyle='#8ba08e';ctx.beginPath();ctx.roundRect(-16,-43,32,26,12);ctx.fill();ctx.fillStyle='#fbe66b';ctx.shadowBlur=10;ctx.shadowColor='rgba(255,234,92,.55)';ctx.beginPath();ctx.ellipse(-6,-34,4.8,4.1,0,0,7);ctx.ellipse(6,-33,4.8,4.1,0,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#140f08';ctx.beginPath();ctx.arc(-5.8,-34,1.5,0,7);ctx.arc(6.3,-32.9,1.5,0,7);ctx.fill();ctx.fillStyle='#2e1d17';ctx.beginPath();ctx.roundRect(-8,-27,16,8,3);ctx.fill();ctx.fillStyle='#e6dcc5';ctx.fillRect(-7,-26,2,4);ctx.fillRect(-3,-26,2,2);ctx.fillRect(1,-26,2,4);ctx.fillRect(5,-26,2,3);if(z.hit>0){ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(255,0,0,${Math.min(.95,z.hit)})`;ctx.beginPath();ctx.roundRect(-20,-48,40,90,16);ctx.fill();ctx.strokeStyle=`rgba(255,90,90,${Math.min(.95,z.hit)})`;ctx.lineWidth=3;ctx.stroke();ctx.globalCompositeOperation='source-over';}if(z.burn>0){for(let i=0;i<3;i++){const oy=i*11-18;const flame=ctx.createRadialGradient(0,oy,1,0,oy,14+i*3);flame.addColorStop(0,'rgba(255,255,180,.9)');flame.addColorStop(.45,'rgba(255,130,40,.85)');flame.addColorStop(1,'rgba(180,20,10,0)');ctx.fillStyle=flame;ctx.beginPath();ctx.arc((Math.sin(z.step+i)*8),oy,12+i*2,0,7);ctx.fill();}}if(z.freeze>0){ctx.fillStyle='rgba(70,180,255,.32)';ctx.beginPath();ctx.roundRect(-20,-48,40,90,16);ctx.fill();ctx.strokeStyle='rgba(160,235,255,.75)';ctx.lineWidth=1.5;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-13+i*8,-35);ctx.lineTo(-8+i*8,-25);ctx.lineTo(-13+i*8,-15);ctx.stroke();}}ctx.restore();}
function drawTower(t){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(t.x,t.y+18,25,9,0,0,7);ctx.fill();const grd=ctx.createLinearGradient(t.x,t.y-36,t.x,t.y+20);grd.addColorStop(0,'#c79e67');grd.addColorStop(.45,'#6f4f2f');grd.addColorStop(1,'#2d2118');ctx.fillStyle=grd;ctx.beginPath();ctx.roundRect(t.x-20,t.y-10,40,34,10);ctx.fill();ctx.fillStyle='#17181f';ctx.beginPath();ctx.roundRect(t.x-15,t.y-5,30,24,8);ctx.fill();ctx.strokeStyle='rgba(255,231,180,.7)';ctx.lineWidth=2;ctx.strokeRect(t.x-16,t.y-6,32,26);ctx.fillStyle='#0e1520';ctx.beginPath();ctx.roundRect(t.x-11,t.y-33,22,16,6);ctx.fill();ctx.strokeStyle=t.color;ctx.shadowBlur=12;ctx.shadowColor=t.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(t.x,t.y-24,15,0,7);ctx.stroke();ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(t.x,t.y-24,11.5,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.fillText(t.sym,t.x-6,t.y-18);ctx.fillStyle='#f7ffea';ctx.font='bold 11px Arial';ctx.fillText(`Lv${t.level}`,t.x-11,t.y+34);}
function draw(){const g=ctx.createLinearGradient(0,0,0,540);g.addColorStop(0,'#8fd46f');g.addColorStop(.55,'#73bf58');g.addColorStop(1,'#65b44f');ctx.fillStyle=g;ctx.fillRect(0,0,960,540);for(let i=0;i<180;i++){const x=(i*97)%960,y=(i*61)%540;ctx.fillStyle=i%3===0?'rgba(112,180,82,.35)':i%3===1?'rgba(146,214,109,.25)':'rgba(90,160,70,.28)';ctx.beginPath();ctx.ellipse(x,y,12,7,((i*23)%360)*Math.PI/180,0,7);ctx.fill();}ctx.strokeStyle='#b38254';ctx.lineWidth=104;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(const p of path.slice(1))ctx.lineTo(p.x,p.y);ctx.stroke();ctx.strokeStyle='#8f623e';ctx.lineWidth=94;ctx.setLineDash([2,9]);ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(const p of path.slice(1))ctx.lineTo(p.x,p.y);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#d2a574';ctx.lineWidth=72;ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(const p of path.slice(1))ctx.lineTo(p.x,p.y);ctx.stroke();
for(let i=0;i<slots.length;i++){if(towers.some(t=>t.slot===i))continue;const s=slots[i];ctx.fillStyle='rgba(37,58,48,.9)';ctx.beginPath();ctx.arc(s.x,s.y,21,0,7);ctx.fill();ctx.fillStyle='#dbe7ef';ctx.font='bold 22px Arial';ctx.fillText('+',s.x-7,s.y+8);}for(const t of towers)drawTower(t);
for(const p of shots){const pr=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,8);pr.addColorStop(0,p.e==='fire'?'#ffd17b':p.e==='ice'?'#dff6ff':p.e==='water'?'#90e5ff':p.e==='wind'?'#edf7ff':p.e==='leaf'?'#b6ef85':'#efe6ff');pr.addColorStop(1,p.e==='fire'?'#ff5d2e':p.e==='ice'?'#6fc9ff':p.e==='water'?'#2f9ddf':p.e==='wind'?'#97b8d6':p.e==='leaf'?'#4f9f43':'#ab83ff');ctx.fillStyle=pr;ctx.beginPath();ctx.arc(p.x,p.y,5.2,0,7);ctx.fill();}
for(const e of fx){if(e.type==='lightning'&&e.target){ctx.strokeStyle='rgba(210,240,255,.95)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(e.target.x,-40);for(let i=0;i<7;i++){const yy=e.target.y*(i/6),xx=e.target.x+(Math.random()-.5)*14;ctx.lineTo(xx,yy);}ctx.stroke();ctx.strokeStyle='rgba(120,210,255,.55)';ctx.lineWidth=11;ctx.stroke();}if(e.type==='fireSpray'){ctx.strokeStyle='rgba(255,120,40,.9)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.tx,e.ty);ctx.stroke();}if(e.type==='fireAura'&&e.target){ctx.fillStyle='rgba(255,90,30,.34)';ctx.beginPath();ctx.arc(e.target.x,e.target.y-12,20,0,7);ctx.fill();}if(e.type==='iceSpray'){ctx.strokeStyle='rgba(180,235,255,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.tx,e.ty);ctx.stroke();}if(e.type==='waterWave'){ctx.strokeStyle='rgba(120,220,255,.95)';ctx.lineWidth=5;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(e.x,e.y+i*5-4);ctx.quadraticCurveTo((e.x+e.tx)/2,e.y-45+i*8,e.tx,e.ty+i*4);ctx.stroke();}}if(e.type==='tornado'&&e.target){for(let i=0;i<7;i++){ctx.strokeStyle=`rgba(${220-i*18},${240-i*10},255,.9)`;ctx.beginPath();ctx.ellipse(e.target.x,e.target.y-30+i*8,4+i*5,2+i*1.8,e.life*.11+i*.1,0,7);ctx.stroke();}}if(e.type==='thorns'){ctx.strokeStyle='rgba(132,208,88,.9)';ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+Math.cos(a)*18,e.y+Math.sin(a)*18);}ctx.stroke();}}
for(const z of zombies)dz(z);}
function hud(){els.vida.textContent=`❤️ ${Math.max(0,Math.round(vidaVal))}/1000`;els.dinheiro.textContent=`💰 ${money}`;els.onda.textContent=`🌊 Onda ${wave}${isBoss()?' • BOSS':''}`;els.towerInfo.textContent=sel?`${sel.label} Lv ${sel.level}`:'Sem torre selecionada';}
function gameOver(){mode='end';els.gameOverPanel.style.display='flex';els.gameOverPanel.innerHTML=`<div id='sign' style='cursor:pointer;padding:20px 34px;border-radius:18px;background:linear-gradient(180deg,#2a0b0b,#130303);border:3px solid #ffd5a0;color:#fff;text-align:center;box-shadow:0 0 35px rgba(255,0,0,.5),0 18px 42px rgba(0,0,0,.65);animation:signDrop .75s ease-out'><h2 style='font-size:56px;margin:0;color:#ff3d3d;text-shadow:0 0 15px #ff0000'>GAME OVER</h2><p>Toque na placa para reiniciar</p></div>`;document.getElementById('sign').onclick=()=>location.reload();}
cvs.addEventListener('click',e=>{const r=cvs.getBoundingClientRect(),x=(e.clientX-r.left)*960/r.width,y=(e.clientY-r.top)*540/r.height;if(mode!=='playing')return;const t=towers.find(tt=>d(tt,{x,y})<22);if(t){sel=t;els.upgradePanel.style.display='flex';showPanel(t);return;}const i=slots.findIndex((s,ix)=>d(s,{x,y})<24&&!towers.some(t=>t.slot===ix));if(i>=0){slotActive=i;els.shopTray.style.display='block';els.towerBar.innerHTML='';for(const tt of types){const b=document.createElement('button');b.className='tower-option';b.innerHTML=`<strong>${tt.n}</strong><small>${tt.c}💰 • alcance ${tt.r}</small>`;b.onclick=()=>{if(money<tt.c||slotActive<0)return;const s=slots[slotActive];towers.push({x:s.x,y:s.y,slot:slotActive,type:tt.k,sym:tt.sym,label:tt.n,range:tt.r,dmg:tt.dmg,rate:tt.rt,cd:0,sp:tt.sp,level:1,total:tt.c,color:tt.col});money-=tt.c;slotActive=-1;els.shopTray.style.display='none';};els.towerBar.appendChild(b);}return;}els.shopTray.style.display='none';slotActive=-1;});
els.panelUpgrade.onclick=()=>{if(!sel)return;const c=20+sel.level*18;if(sel.level>=MAX_TOWER_LEVEL){showPanel(sel);return;}if(money<c)return;money-=c;sel.level++;sel.total+=c;const n=nextStats(sel);sel.dmg=n.dmg;sel.range=n.range;sel.rate=n.rate;showPanel(sel);};els.panelSell.onclick=()=>{if(!sel)return;money+=Math.round(sel.total*.7);towers.splice(towers.indexOf(sel),1);sel=null;els.upgradePanel.style.display='none';};els.panelClose.onclick=()=>els.upgradePanel.style.display='none';els.closeShop.onclick=()=>{slotActive=-1;els.shopTray.style.display='none';};
(function loop(){update();draw();requestAnimationFrame(loop)})();hud();
})();
</script>
