<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pega Bolinha</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1d2b64 0%, #10172a 55%, #0a0f1d 100%);
      color: #fff;
    }
    a.back { position: fixed; top: 12px; left: 12px; color: #c9b3ff; text-decoration: none; font-weight: 700; z-index: 10; }
    .wrap { width: min(92vw, 760px); text-align: center; }
    h1 { margin: 0 0 10px; }
    p { margin: 0 0 14px; opacity: .9; }
    .hud { display:flex; justify-content:center; gap:16px; font-weight:700; margin-bottom:10px; }
    canvas {
      width: 100%;
      max-width: 760px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,.2);
      background: linear-gradient(180deg, #0f1f3b 0%, #091326 100%);
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
      cursor: crosshair;
    }
    button {
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 700;
      background: #63e;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <a class="back" href="../../">← Voltar</a>
  <div class="wrap">
    <h1>🟣 Pega Bolinha</h1>
    <p>Clique na bolinha o máximo de vezes em 30 segundos.</p>
    <div class="hud">
      <span id="score">Pontos: 0</span>
      <span id="time">Tempo: 30s</span>
      <span id="best">Recorde: 0</span>
    </div>
    <canvas id="game" width="760" height="420" aria-label="Área do jogo"></canvas>
    <div><button id="restart" type="button">Reiniciar</button></div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const bestEl = document.getElementById('best');
    const restartBtn = document.getElementById('restart');

    const BEST_KEY = 'pega-bolinha-best';
    let best = Number(localStorage.getItem(BEST_KEY) || 0);
    let score = 0;
    let timeLeft = 30;
    let running = true;
    let tick = null;

    let ball = { x: 80, y: 80, r: 26 };

    function randomBall() {
      const margin = 30;
      ball.r = 18 + Math.random() * 16;
      ball.x = margin + ball.r + Math.random() * (canvas.width - (margin + ball.r) * 2);
      ball.y = margin + ball.r + Math.random() * (canvas.height - (margin + ball.r) * 2);
    }

    function updateHud() {
      scoreEl.textContent = `Pontos: ${score}`;
      timeEl.textContent = `Tempo: ${timeLeft}s`;
      bestEl.textContent = `Recorde: ${best}`;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#90caf9';
      for (let i = 0; i < 50; i++) {
        const x = (i * 137) % canvas.width;
        const y = (i * 79 + 31) % canvas.height;
        ctx.globalAlpha = 0.08;
        ctx.fillRect(x, y, 4, 4);
      }
      ctx.globalAlpha = 1;

      const grad = ctx.createRadialGradient(ball.x - 6, ball.y - 6, 4, ball.x, ball.y, ball.r + 4);
      grad.addColorStop(0, '#ffc6ff');
      grad.addColorStop(1, '#8a2be2');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,.15)';
      ctx.beginPath();
      ctx.arc(ball.x - ball.r * 0.25, ball.y - ball.r * 0.25, ball.r * 0.35, 0, Math.PI * 2);
      ctx.fill();

      if (!running) {
        ctx.fillStyle = 'rgba(0,0,0,.45)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 40px Arial';
        ctx.fillText('Tempo esgotado!', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '24px Arial';
        ctx.fillText(`Pontuação: ${score}`, canvas.width / 2, canvas.height / 2 + 30);
      }
    }

    function startRound() {
      clearInterval(tick);
      score = 0;
      timeLeft = 30;
      running = true;
      randomBall();
      updateHud();
      draw();

      tick = setInterval(() => {
        timeLeft -= 1;
        if (timeLeft <= 0) {
          timeLeft = 0;
          running = false;
          clearInterval(tick);
          if (score > best) {
            best = score;
            localStorage.setItem(BEST_KEY, String(best));
          }
        }
        updateHud();
        draw();
      }, 1000);
    }

    canvas.addEventListener('click', (ev) => {
      if (!running) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mx = (ev.clientX - rect.left) * scaleX;
      const my = (ev.clientY - rect.top) * scaleY;
      const d = Math.hypot(mx - ball.x, my - ball.y);
      if (d <= ball.r) {
        score += 1;
        randomBall();
        updateHud();
        draw();
      }
    });

    restartBtn.addEventListener('click', startRound);

    updateHud();
    startRound();
  </script>
</body>
</html>
