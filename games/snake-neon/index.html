<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Snake Neon</title>
  <style>
    :root {
      --bg: #070914;
      --panel: #10172d;
      --glow-cyan: #00f6ff;
      --glow-pink: #ff32d6;
      --glow-green: #52ff7f;
      --text: #eaf6ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Rubik", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(0, 246, 255, 0.20), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(255, 50, 214, 0.18), transparent 45%),
        radial-gradient(circle at 50% 100%, rgba(82, 255, 127, 0.16), transparent 38%),
        var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      touch-action: manipulation;
    }

    .shell {
      width: min(100%, 540px);
      background: linear-gradient(170deg, rgba(16, 23, 45, 0.92), rgba(9, 13, 26, 0.96));
      border: 1px solid rgba(0, 246, 255, 0.30);
      border-radius: 20px;
      padding: 1rem;
      box-shadow: 0 0 20px rgba(0, 246, 255, 0.25), 0 0 50px rgba(255, 50, 214, 0.18);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .6rem;
      flex-wrap: wrap;
      margin-bottom: .75rem;
    }

    h1 { margin: 0; font-size: 1.1rem; letter-spacing: .06em; text-transform: uppercase; }
    .hud { display: flex; gap: .5rem; flex-wrap: wrap; }

    .pill {
      font-weight: 700;
      padding: .35rem .65rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255,255,255,.12);
      font-size: .86rem;
    }

    .pill strong { color: var(--glow-cyan); }

    .board-wrap {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(82,255,127,.35);
      background: #04060d;
      box-shadow: inset 0 0 20px rgba(0,0,0,.6);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      image-rendering: pixelated;
      background:
        linear-gradient(rgba(0, 246, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 246, 255, 0.05) 1px, transparent 1px),
        #050914;
      background-size: 6.25% 6.25%, 6.25% 6.25%, auto;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 1rem;
      background: rgba(3, 6, 15, .68);
      backdrop-filter: blur(2px);
    }

    .overlay.hidden { display: none; }

    .btn {
      margin-top: .7rem;
      border: 0;
      border-radius: 10px;
      padding: .7rem 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
      background: linear-gradient(120deg, var(--glow-cyan), var(--glow-pink));
      color: #05080f;
    }

    .controls {
      margin-top: .9rem;
      display: grid;
      gap: .5rem;
      justify-items: center;
    }

    .row { display: flex; gap: .5rem; }

    .ctrl {
      width: 64px;
      height: 56px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 12px;
      background: rgba(255,255,255,.05);
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 700;
    }

    .tips {
      margin: .8rem 0 0;
      font-size: .84rem;
      color: #9bc8d8;
      text-align: center;
    }

    @media (min-width: 740px) {
      .controls { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <h1>Snake Neon</h1>
      <div class="hud">
        <div class="pill">Pontos: <strong id="score">0</strong></div>
        <div class="pill">Recorde: <strong id="best">0</strong></div>
      </div>
    </div>

    <section class="board-wrap">
      <canvas id="game" width="320" height="320" aria-label="Tabuleiro do Snake"></canvas>
      <div class="overlay" id="overlay">
        <div>
          <h2 id="message">Toque em jogar para começar</h2>
          <p>Use setas, WASD ou os botões para mover a cobrinha.</p>
          <button class="btn" id="startBtn">Jogar</button>
        </div>
      </div>
    </section>

    <div class="controls" aria-label="Controles para celular">
      <button class="ctrl" data-dir="up">▲</button>
      <div class="row">
        <button class="ctrl" data-dir="left">◀</button>
        <button class="ctrl" data-dir="down">▼</button>
        <button class="ctrl" data-dir="right">▶</button>
      </div>
    </div>

    <p class="tips">No celular: deslize na tela ou use os botões. No PC: setas ou WASD.</p>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const message = document.getElementById('message');
    const startBtn = document.getElementById('startBtn');

    const GRID = 20;
    const CELL = canvas.width / GRID;

    let snake = [];
    let dir = { x: 1, y: 0 };
    let queuedDir = { x: 1, y: 0 };
    let food = { x: 10, y: 10 };
    let score = 0;
    let running = false;
    let gameLoop = null;

    const bestKey = 'snake_neon_best';
    let best = Number(localStorage.getItem(bestKey) || 0);
    bestEl.textContent = best;

    function resetGame() {
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      queuedDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = score;
      placeFood();
      draw();
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
      } while (snake.some(p => p.x === food.x && p.y === food.y));
    }

    function setDirection(next) {
      if (next.x === -dir.x && next.y === -dir.y) return;
      queuedDir = next;
    }

    function tick() {
      dir = queuedDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      const hitWall = head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID;
      const hitSelf = snake.some(seg => seg.x === head.x && seg.y === head.y);

      if (hitWall || hitSelf) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          localStorage.setItem(bestKey, String(best));
          bestEl.textContent = best;
        }
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.shadowBlur = 14;
      ctx.shadowColor = '#ff32d6';
      ctx.fillStyle = '#ff32d6';
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * CELL, (food.y + 0.5) * CELL, CELL * 0.28, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      snake.forEach((seg, index) => {
        const glow = index === 0 ? '#52ff7f' : '#00f6ff';
        ctx.save();
        ctx.shadowBlur = index === 0 ? 18 : 10;
        ctx.shadowColor = glow;
        ctx.fillStyle = glow;
        ctx.fillRect(seg.x * CELL + 2, seg.y * CELL + 2, CELL - 4, CELL - 4);
        ctx.restore();
      });
    }

    function startGame() {
      resetGame();
      overlay.classList.add('hidden');
      running = true;
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, 110);
    }

    function endGame() {
      running = false;
      clearInterval(gameLoop);
      message.textContent = `Fim de jogo! Pontos: ${score}`;
      startBtn.textContent = 'Jogar de novo';
      overlay.classList.remove('hidden');
    }

    function handleDirName(name) {
      if (name === 'up') setDirection({ x: 0, y: -1 });
      if (name === 'down') setDirection({ x: 0, y: 1 });
      if (name === 'left') setDirection({ x: -1, y: 0 });
      if (name === 'right') setDirection({ x: 1, y: 0 });
    }

    document.addEventListener('keydown', (ev) => {
      const k = ev.key.toLowerCase();
      if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)) ev.preventDefault();
      if (!running && (k === 'enter' || k === ' ')) {
        startGame();
        return;
      }
      if (k === 'arrowup' || k === 'w') handleDirName('up');
      if (k === 'arrowdown' || k === 's') handleDirName('down');
      if (k === 'arrowleft' || k === 'a') handleDirName('left');
      if (k === 'arrowright' || k === 'd') handleDirName('right');
    }, { passive: false });

    document.querySelectorAll('[data-dir]').forEach((btn) => {
      btn.addEventListener('click', () => handleDirName(btn.dataset.dir));
    });

    let sx = 0, sy = 0;
    canvas.addEventListener('touchstart', (ev) => {
      const t = ev.changedTouches[0];
      sx = t.clientX;
      sy = t.clientY;
    }, { passive: true });

    canvas.addEventListener('touchend', (ev) => {
      const t = ev.changedTouches[0];
      const dx = t.clientX - sx;
      const dy = t.clientY - sy;
      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        handleDirName(dx > 0 ? 'right' : 'left');
      } else {
        handleDirName(dy > 0 ? 'down' : 'up');
      }
    }, { passive: true });

    startBtn.addEventListener('click', startGame);
    resetGame();
  </script>
</body>
</html>
