<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375" role="img" aria-label="Bosque VR">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f8fd6"/><stop offset="55%" stop-color="#88c4ee"/><stop offset="100%" stop-color="#dff0fb"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5aa84a"/><stop offset="100%" stop-color="#357a33"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c0"/><stop offset="100%" stop-color="#ffe06a"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eafff0"/><stop offset="100%" stop-color="#7be88f"/>
    </linearGradient>
  </defs>

  <rect width="600" height="375" fill="url(#sky)"/>
  <circle cx="478" cy="78" r="46" fill="url(#sun)"/>
  <rect y="232" width="600" height="143" fill="url(#grass)"/>

  <!-- lago -->
  <ellipse cx="300" cy="312" rx="150" ry="40" fill="#9bd0a0" opacity="0.55"/>
  <ellipse cx="300" cy="312" rx="138" ry="33" fill="#2f7fc4"/>
  <ellipse cx="262" cy="305" rx="40" ry="8" fill="#bfe2f5" opacity="0.6"/>

  <!-- árvores -->
  <g>
    <g transform="translate(95,250)"><rect x="-6" y="0" width="12" height="34" fill="#7a5230"/><circle cx="0" cy="-8" r="34" fill="#3d9140"/><circle cx="-18" cy="6" r="22" fill="#4caf50"/><circle cx="18" cy="6" r="22" fill="#2f7d3a"/></g>
    <g transform="translate(520,252)"><rect x="-6" y="0" width="12" height="34" fill="#7a5230"/><circle cx="0" cy="-8" r="32" fill="#4caf50"/><circle cx="16" cy="6" r="20" fill="#3d9140"/></g>
    <g transform="translate(168,236) scale(.8)"><rect x="-6" y="0" width="12" height="34" fill="#7a5230"/><circle cx="0" cy="-8" r="30" fill="#6abf4f"/></g>
    <g transform="translate(450,236) scale(.8)"><rect x="-6" y="0" width="12" height="34" fill="#7a5230"/><circle cx="0" cy="-8" r="30" fill="#3d9140"/></g>
  </g>

  <!-- óculos VR -->
  <g transform="translate(300,150)" opacity="0.96">
    <rect x="-58" y="-26" width="116" height="52" rx="26" fill="#10241a" stroke="#7be88f" stroke-width="3"/>
    <circle cx="-26" cy="0" r="15" fill="#9be8ff"/><circle cx="26" cy="0" r="15" fill="#9be8ff"/>
  </g>

  <rect x="120" y="40" width="360" height="60" rx="16" fill="rgba(8,24,16,.7)"/>
  <text x="300" y="82" font-family="Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle" fill="url(#title)">🌲 Bosque VR</text>
</svg>
