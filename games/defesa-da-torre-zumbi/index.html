<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Defesa da Torre de Zumbi</title>
  <style>
    :root{--lime:#6f8b5f;--bg:#050709;--card:#13181b;--gold:#ffd76a}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% -20%,#243129 0%,#101619 45%,#05070a 100%);color:#dbe3dc;min-height:100vh;display:flex;justify-content:center;padding:12px}
    .game-shell{width:min(96vw,1040px);position:relative}
    .back{position:absolute;top:10px;left:10px;z-index:99;color:#d8ffbe;text-decoration:none;font-weight:700;background:rgba(5,18,10,.82);padding:8px 10px;border:1px solid rgba(183,255,99,.55);border-radius:12px}
    #hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(94%,960px)}
    .hud-chip{background:linear-gradient(180deg,rgba(24,46,37,.9),rgba(12,28,21,.92));border:1px solid rgba(190,255,124,.4);padding:8px 12px;border-radius:999px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.35);backdrop-filter:blur(4px);animation:hudPulse 3.8s ease-in-out infinite}
    @keyframes hudPulse{0%,100%{box-shadow:0 8px 20px rgba(0,0,0,.35)}50%{box-shadow:0 12px 26px rgba(171,255,116,.28)}}
    canvas{display:block;width:100%;aspect-ratio:16/9;height:auto;border-radius:28px;border:2px solid rgba(183,255,99,.55);box-shadow:0 16px 48px rgba(0,0,0,.6),0 0 42px rgba(134,255,109,.18) inset}
    #slotInfo{margin-top:8px;text-align:center;font-weight:700;opacity:.95}
    #shopTray{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(95%,980px);z-index:60;background:linear-gradient(180deg,rgba(21,35,28,.95),rgba(12,24,18,.97));border:1px solid rgba(183,255,99,.45);border-radius:22px;padding:12px;display:none;box-shadow:0 20px 35px rgba(0,0,0,.55)}
    #shopHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
    #towerBar{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
    .tower-option{flex:0 0 132px;background:linear-gradient(180deg,#335f49,#203a2c);border:1px solid rgba(201,255,146,.5);border-radius:14px;padding:10px;cursor:pointer;color:#efffde;text-align:left}
    .tower-option small{opacity:.85;display:block}
    .tower-option:hover{transform:translateY(-2px)}
    .xbtn{background:#263d30;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:16px}
    .panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9990;background:rgba(0,0,0,.72)}
    .card{width:min(92vw,540px);background:linear-gradient(180deg,#193928,#11271c);border:1px solid rgba(156,255,107,.5);border-radius:16px;padding:16px;box-shadow:0 20px 40px rgba(0,0,0,.55);position:relative}
    .card h3{margin:6px 0 10px 0}
    .row{display:flex;justify-content:space-between;gap:8px;margin:8px 0}
    .stats-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
    .tower-big{font-size:54px;text-align:center;filter:drop-shadow(0 0 8px rgba(184,255,127,.6))}
    button{background:linear-gradient(180deg,#325d45,#234030);color:#e9ffd8;border:1px solid #9cff6b;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
    .upgrade-close{position:absolute;right:10px;top:10px}

    .zombie{
      position:absolute;
      transform:translate(-50%,-50%);
      width:auto;
      height:auto;
      display:block;
      font-size:42px;
      background:none !important;
      border:0 !important;
      border-radius:0 !important;
      box-shadow:none !important;
      filter:drop-shadow(0 0 10px #55ff77);
      animation:zombieWalk .55s infinite ease-in-out;
    }

    .zombie::before{
      content:"";
      position:absolute;
      left:50%;
      bottom:-4px;
      width:42px;
      height:12px;
      transform:translateX(-50%);
      background:#0008;
      border-radius:50%;
      filter:blur(2px);
      z-index:-1;
    }

    .zombie::after{
      display:none !important;
    }

    @keyframes zombieWalk{
      0%,100%{transform:translate(-50%,-50%) rotate(-5deg) translateY(0)}
      50%{transform:translate(-50%,-50%) rotate(5deg) translateY(-5px)}
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <a class="back" href="../../index.php">← Voltar</a>
    <div id="hud"><span id="vida" class="hud-chip"></span><span id="dinheiro" class="hud-chip"></span><span id="onda" class="hud-chip"></span><span id="towerInfo" class="hud-chip">Sem torre selecionada</span></div>
    <canvas id="game" width="960" height="540"></canvas>
    <div id="slotInfo">Toque em um slot <strong>＋</strong> para abrir a loja de torres.</div>

    <div id="shopTray">
      <div id="shopHeader"><span id="shopTitle">Escolha uma torre para construir</span><button id="closeShop" class="xbtn">✖</button></div>
      <div id="towerBar"></div>
    </div>
  </div>

  <div id="upgradePanel" class="panel"><div class="card"><button id="panelClose" class="xbtn upgrade-close">✖</button><h3>🔧 Upgrade da Torre</h3><div id="upgradeContent"></div><div class="row"><button id="panelUpgrade">⬆️ Melhorar</button><button id="panelSell">💸 Vender</button></div></div></div>
  <div id="gameOverPanel" class="panel"><div class="card" style="text-align:center;background:#000"><h2 style="font-size:52px;color:#fff">GAME OVER</h2><button id="restartBtn" style="background:#fff;color:#000;border-color:#fff">Reiniciar</button></div></div>
<script>
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
const vidaEl=document.getElementById('vida'),dinheiroEl=document.getElementById('dinheiro'),ondaEl=document.getElementById('onda'),towerInfo=document.getElementById('towerInfo');
const els={vida:vidaEl,dinheiro:dinheiroEl,onda:ondaEl,towerInfo,towerBar:document.getElementById('towerBar'),slotInfo:document.getElementById('slotInfo'),shopTray:document.getElementById('shopTray'),shopTitle:document.getElementById('shopTitle'),closeShop:document.getElementById('closeShop'),upgradePanel:document.getElementById('upgradePanel'),upgradeContent:document.getElementById('upgradeContent'),panelUpgrade:document.getElementById('panelUpgrade'),panelSell:document.getElementById('panelSell'),panelClose:document.getElementById('panelClose'),gameOverPanel:document.getElementById('gameOverPanel'),restartBtn:document.getElementById('restartBtn')};
els.gameOverPanel.innerHTML=`<div class="card" style="text-align:center"><h2 id="endTitle">Defesa da Torre</h2><p id="endText"></p><button id="backPhases">Voltar para fases</button></div>`;
const phaseStateKey='zombie_td_phase_unlock_v2';
const MAX_PHASES=5,WAVES_PER_PHASE=20,MAX_TOWERS=15,MAX_TOWER_LEVEL=50;
let unlockedPhase=Math.max(1,Math.min(MAX_PHASES,parseInt(localStorage.getItem(phaseStateKey)||'1',10)||1));
let gameState='menu',activePhase=1;
const phaseConfigs=[
{name:'Floresta',theme:'#3f8e4d',base:'#675a45',path:[{x:0,y:260},{x:140,y:260},{x:140,y:140},{x:370,y:140},{x:370,y:360},{x:620,y:360},{x:620,y:220},{x:960,y:220}],slots:[{x:80,y:350},{x:220,y:200},{x:300,y:320},{x:460,y:220},{x:520,y:430},{x:700,y:310},{x:770,y:170},{x:860,y:330}]},
{name:'Pântano',theme:'#4f6a3c',base:'#5a5e46',path:[{x:0,y:320},{x:210,y:320},{x:210,y:180},{x:440,y:180},{x:440,y:420},{x:690,y:420},{x:690,y:250},{x:960,y:250}],slots:[{x:110,y:210},{x:130,y:420},{x:320,y:250},{x:370,y:470},{x:540,y:270},{x:610,y:150},{x:810,y:360},{x:850,y:170}]},
{name:'Cemitério',theme:'#58557c',base:'#59556e',path:[{x:0,y:210},{x:170,y:210},{x:170,y:390},{x:420,y:390},{x:420,y:150},{x:710,y:150},{x:710,y:320},{x:960,y:320}],slots:[{x:100,y:110},{x:100,y:330},{x:280,y:300},{x:360,y:120},{x:550,y:330},{x:610,y:70},{x:820,y:260},{x:860,y:430}]},
{name:'Vulcão',theme:'#7f3f34',base:'#7f4f3a',path:[{x:0,y:300},{x:190,y:300},{x:190,y:120},{x:430,y:120},{x:430,y:350},{x:650,y:350},{x:650,y:180},{x:960,y:180}],slots:[{x:80,y:180},{x:120,y:410},{x:310,y:210},{x:350,y:430},{x:520,y:240},{x:580,y:430},{x:760,y:280},{x:830,y:80}]},
{name:'Castelo Sombrio',theme:'#443b5d',base:'#524a66',path:[{x:0,y:270},{x:150,y:270},{x:150,y:100},{x:400,y:100},{x:400,y:420},{x:670,y:420},{x:670,y:170},{x:960,y:170}],slots:[{x:70,y:130},{x:80,y:390},{x:270,y:180},{x:320,y:470},{x:500,y:210},{x:550,y:350},{x:760,y:260},{x:820,y:430}]}
];
const towerTypes=[{key:'fire',name:'Fogo',cost:42,range:120,dmg:11,rate:30,projSpeed:5,color:'#b64128',core:'#2b0e08'},{key:'ice',name:'Gelo',cost:46,range:118,dmg:0,rate:34,projSpeed:5,color:'#4d86b2',core:'#0a2134'},{key:'water',name:'Água',cost:36,range:150,dmg:7,rate:18,projSpeed:6,color:'#3b76a5',core:'#0b2238'},{key:'wind',name:'Vento',cost:40,range:180,dmg:4,rate:24,projSpeed:5.8,color:'#8a91aa',core:'#262c3e'},{key:'venom',name:'Folha',cost:38,range:125,dmg:9,rate:14,projSpeed:6.8,color:'#4d7f4c',core:'#1a3118'},{key:'light',name:'Raio',cost:56,range:165,dmg:36,rate:40,projSpeed:7,color:'#8c73c5',core:'#2a2044'}];
let path=[],buildSlots=[],vida=1000,dinheiro=180,onda=1,kills=0,gameOver=false,activeSlot=-1,selectedTower=null,spawnLeft=0,spawnedInWave=0,spawnCooldown=0,tick=0;
const torres=[],zumbis=[],tiros=[],fx=[]; const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function waveStats(w){return{amount:w===WAVES_PER_PHASE?1:9+w*2,hp:80+(w-1)*12+(activePhase-1)*35,speed:1+w*.05+(activePhase-1)*.03,spawnGap:Math.max(10,30-w),reward:18+w*4};}
function startWave(){const s=waveStats(onda);spawnLeft=s.amount;spawnedInWave=0;spawnCooldown=1;}
function spawnZombie(){const s=waveStats(onda),isBoss=onda===WAVES_PER_PHASE;const kinds=['normal','fast','tank'];const type=isBoss?'boss':kinds[spawnedInWave%kinds.length];
const mult={normal:1,fast:.8,tank:2.4,boss:16}[type],spd={normal:1,fast:1.7,tank:.66,boss:.28}[type];
zumbis.push({x:path[0].x,y:path[0].y,seg:0,type,isBoss,hp:Math.floor(s.hp*mult),maxHp:Math.floor(s.hp*mult),speed:s.speed*spd,reward:Math.floor(s.reward*mult),dead:false,step:Math.random()*6,hitFlash:0,burnTime:0,slowTime:0,slowFactor:1,freezeTime:0});spawnedInWave++;}
function updateHUD(){els.vida.textContent=`❤️ ${Math.max(0,Math.round(vida))}/1000`;els.dinheiro.textContent=`💰 ${dinheiro}`;els.onda.textContent=`🌊 Onda ${onda}/${WAVES_PER_PHASE} • Fase ${activePhase}`;els.towerInfo.textContent=selectedTower?`${selectedTower.label} Lv ${selectedTower.level}`:'Sem torre selecionada';}
function renderBar(){els.towerBar.innerHTML='';towerTypes.forEach((t)=>{const b=document.createElement('button');b.className='tower-option';b.innerHTML=`<strong>${t.name}</strong><small>${t.cost}💰 • alcance ${t.range}</small>`;b.onclick=()=>buildTowerInSlot(t);els.towerBar.appendChild(b);});}
function openShop(i){activeSlot=i;els.shopTray.style.display='block';renderBar();}
function closeShop(){activeSlot=-1;els.shopTray.style.display='none';}
function buildTowerInSlot(type){if(activeSlot<0||torres.length>=MAX_TOWERS||dinheiro<type.cost)return;if(torres.some(t=>t.slot===activeSlot))return;const s=buildSlots[activeSlot];const t={x:s.x,y:s.y,slot:activeSlot,range:type.range,dmg:type.dmg,rate:type.rate,cd:0,level:1,type:type.key,label:type.name,projSpeed:type.projSpeed,totalCost:type.cost,color:type.color};torres.push(t);dinheiro-=type.cost;selectedTower=t;closeShop();}
function upgradeTower(t){const c=20+t.level*18;if(t.level>=MAX_TOWER_LEVEL||dinheiro<c)return;dinheiro-=c;t.level++;t.totalCost+=c;t.dmg=Math.round((t.dmg+2)*1.05);t.range+=6;t.rate=Math.max(8,Math.round(t.rate*.95));}
function showEnd(win){gameState='end';const ttl=document.getElementById('endTitle'),tx=document.getElementById('endText'),btn=document.getElementById('backPhases');ttl.textContent=win?'Fase concluída!':'Derrota';tx.textContent=win?'Você venceu 20 ondas.':'Sua base caiu.';els.gameOverPanel.style.display='flex';btn.onclick=()=>{els.gameOverPanel.style.display='none';showPhaseMenu();};if(win&&unlockedPhase<MAX_PHASES&&activePhase===unlockedPhase){unlockedPhase++;localStorage.setItem(phaseStateKey,String(unlockedPhase));}}
function startPhase(n){activePhase=n;const ph=phaseConfigs[n-1];path=ph.path;buildSlots=ph.slots;vida=1000;dinheiro=180;onda=1;kills=0;gameOver=false;tick=0;torres.length=0;zumbis.length=0;tiros.length=0;fx.length=0;selectedTower=null;closeShop();els.upgradePanel.style.display='none';gameState='playing';startWave();}
function showPhaseMenu(){gameState='menu';torres.length=zumbis.length=tiros.length=fx.length=0;selectedTower=null;}
function update(){if(gameState!=='playing')return;tick++;spawnCooldown--;if(spawnLeft>0&&spawnCooldown<=0){spawnZombie();spawnLeft--;spawnCooldown=waveStats(onda).spawnGap;}
if(spawnLeft===0&&zumbis.length===0){if(onda>=WAVES_PER_PHASE){showEnd(true);return;}dinheiro+=30+onda*8;onda++;startWave();}
for(const t of torres){t.cd--;if(t.cd<=0){const a=zumbis.find(z=>!z.dead&&dist(z,t)<=t.range);if(a){const b={x:t.x,y:t.y,target:a,dmg:t.dmg,speed:t.projSpeed,effect:t.type};tiros.push(b);if(t.type==='light'){a.hp-=t.dmg;fx.push({type:'light',x:a.x,y:a.y,life:8});}if(t.type==='ice'){a.freezeTime=38;a.slowTime=70;a.slowFactor=.05;}if(t.type==='water'){a.slowTime=90;a.slowFactor=Math.min(a.slowFactor,.55);}if(t.type==='wind'){a.slowTime=100;a.slowFactor=Math.min(a.slowFactor,.62);}if(t.type==='fire'){a.burnTime=120;a.burnDps=.26+t.dmg*0.02;}t.cd=t.rate;}}}
for(const pr of tiros){if(!pr.target||pr.target.dead){pr.dead=true;continue;}const dx=pr.target.x-pr.x,dy=pr.target.y-pr.y,d=Math.hypot(dx,dy);if(d<pr.speed+4){if(pr.effect!=='ice'&&pr.effect!=='light')pr.target.hp-=pr.dmg;if(pr.effect==='fire')pr.target.burnTime=120;pr.dead=true;}else{pr.x+=dx/d*pr.speed;pr.y+=dy/d*pr.speed;}}
for(const z of zumbis){z.step+=.25;z.hitFlash=Math.max(0,z.hitFlash-.2);z.burnTime=Math.max(0,z.burnTime-1);z.slowTime=Math.max(0,z.slowTime-1);z.freezeTime=Math.max(0,z.freezeTime-1);if(z.burnTime>0)z.hp-=z.burnDps||.2;if(z.dead)continue;const nxt=path[z.seg+1];if(!nxt){z.dead=true;vida-=z.isBoss?vida:Math.max(1,Math.round(z.hp));continue;}const mv=z.freezeTime>0?0:(z.slowTime>0?(z.slowFactor||.7):1);const v=Math.max(.1,z.speed*mv);const dx=nxt.x-z.x,dy=nxt.y-z.y,d=Math.hypot(dx,dy);if(d<v){z.x=nxt.x;z.y=nxt.y;z.seg++;}else{z.x+=dx/d*v;z.y+=dy/d*v;}if(z.hp<=0){z.dead=true;kills++;dinheiro+=z.reward;}}
for(const a of [zumbis,tiros])for(let i=a.length-1;i>=0;i--)if(a[i].dead)a.splice(i,1);
if(vida<=0){showEnd(false);}updateHUD();}
function drawZombie(z){const boss=z.isBoss,scale=boss?2.1:1,bob=Math.sin(z.step*2)*2,walk=Math.sin(z.step*2.6);ctx.save();ctx.translate(z.x,z.y+bob);ctx.scale(scale,scale);ctx.rotate(-0.2);if(z.freezeTime>0){ctx.fillStyle='rgba(120,190,255,.2)';ctx.beginPath();ctx.arc(0,-10,26,0,7);ctx.fill();}
if(z.burnTime>0){ctx.strokeStyle='rgba(255,130,40,.8)';ctx.beginPath();ctx.arc(0,-10,22+Math.sin(tick*.5)*3,0,7);ctx.stroke();}
ctx.fillStyle='#355a34';ctx.fillRect(-9,-10,18,24);ctx.fillStyle='#5a6d7e';ctx.fillRect(-10,5,20,10);ctx.fillStyle='#8cbf5f';ctx.beginPath();ctx.arc(0,-18,10,0,7);ctx.fill();ctx.fillStyle='#e3ff9f';ctx.shadowColor='#beff72';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(-4,-20,1.8,0,7);ctx.arc(4,-20,1.8,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#321';ctx.fillRect(-5,-15,10,3);
ctx.strokeStyle='#86b56b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-9,-6);ctx.lineTo(-16+walk*2,1);ctx.moveTo(9,-6);ctx.lineTo(16-walk*2,1);ctx.stroke();ctx.fillStyle='#9ccc7f';ctx.fillRect(-18+walk*2,-1,4,4);ctx.fillRect(14-walk*2,-1,4,4);
ctx.strokeStyle='#4a5870';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-5,15);ctx.lineTo(-6+walk*3,28);ctx.moveTo(5,15);ctx.lineTo(6-walk*3,28);ctx.stroke();ctx.restore();
const w=boss?180:90,x=z.x-w/2,y=z.y-(boss?120:56),pct=Math.max(0,z.hp)/z.maxHp;ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(x,y,w,10);ctx.fillStyle=z.freezeTime>0?'#7ad2ff':'#72b86d';ctx.fillRect(x+1,y+1,(w-2)*pct,8);
if(boss){ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText(`Boss ${Math.round(z.hp)}/${z.maxHp}`,480,24);ctx.fillStyle='rgba(40,0,0,.8)';ctx.fillRect(170,30,620,16);ctx.fillStyle='#db3e3e';ctx.fillRect(172,32,616*pct,12);} }
function draw(){ctx.clearRect(0,0,960,540);if(gameState==='menu'){ctx.fillStyle='#0c1216';ctx.fillRect(0,0,960,540);ctx.fillStyle='#dff';ctx.font='bold 44px Arial';ctx.fillText('Defesa da Torre Zumbi',230,100);ctx.font='22px Arial';ctx.fillText('Selecione uma fase',370,145);for(let i=1;i<=MAX_PHASES;i++){const col=((i-1)%3),row=Math.floor((i-1)/3),x=190+col*200,y=200+row*140,locked=i>unlockedPhase;ctx.fillStyle=locked?'#333':'#2e5a3f';ctx.fillRect(x,y,160,95);ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText(`Fase ${i}`,x+45,y+38);ctx.font='15px Arial';ctx.fillText(phaseConfigs[i-1].name,x+35,y+63);if(locked)ctx.fillText('🔒 Bloqueada',x+32,y+84);}return;}
const ph=phaseConfigs[activePhase-1];ctx.fillStyle=ph.theme;ctx.fillRect(0,0,960,540);ctx.strokeStyle='rgba(0,0,0,.15)';for(let i=0;i<70;i++){ctx.beginPath();ctx.moveTo((i*51)%960,0);ctx.lineTo((i*51)%960,540);ctx.stroke();}
ctx.strokeStyle='#5b3d2c';ctx.lineWidth=90;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(const p of path.slice(1))ctx.lineTo(p.x,p.y);ctx.stroke();ctx.strokeStyle='#b47a4e';ctx.lineWidth=56;ctx.stroke();
ctx.fillStyle=ph.base;ctx.fillRect(825,140,120,145);ctx.fillStyle='#0004';ctx.fillRect(840,200,90,80);
for(let i=0;i<buildSlots.length;i++){const s=buildSlots[i];if(torres.some(t=>t.slot===i))continue;ctx.fillStyle='rgba(35,55,45,.9)';ctx.beginPath();ctx.arc(s.x,s.y,21,0,7);ctx.fill();ctx.fillStyle='#cde';ctx.font='bold 22px Arial';ctx.fillText('+',s.x-7,s.y+8);}for(const t of torres){ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(t.x,t.y,14,0,7);ctx.fill();}
for(const p of tiros){ctx.fillStyle=p.effect==='ice'?'#bfefff':p.effect==='fire'?'#ff8e54':p.effect==='water'?'#67d7ff':p.effect==='wind'?'#f4fdff':p.effect==='venom'?'#a7ff75':'#fff38c';ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();}
for(const z of zumbis)drawZombie(z);
}
function loop(){update();draw();requestAnimationFrame(loop)}
cvs.addEventListener('click',e=>{const r=cvs.getBoundingClientRect(),x=(e.clientX-r.left)*960/r.width,y=(e.clientY-r.top)*540/r.height;if(gameState==='menu'){for(let i=1;i<=MAX_PHASES;i++){const col=((i-1)%3),row=Math.floor((i-1)/3),bx=190+col*200,by=200+row*140;if(x>bx&&x<bx+160&&y>by&&y<by+95&&i<=unlockedPhase)startPhase(i);}return;}if(gameState!=='playing')return;const ct=torres.find(t=>dist(t,{x,y})<18);if(ct){selectedTower=ct;els.upgradePanel.style.display='flex';els.upgradeContent.innerHTML=`<div class='row'><strong>${ct.label}</strong><strong>Nível ${ct.level}</strong></div>`;return;}const si=buildSlots.findIndex((s,i)=>dist(s,{x,y})<24&&!torres.some(t=>t.slot===i));if(si>=0){openShop(si);return;}closeShop();selectedTower=null;});
els.closeShop.onclick=closeShop;els.panelUpgrade.onclick=()=>{if(selectedTower)upgradeTower(selectedTower);};els.panelSell.onclick=()=>{if(!selectedTower)return;dinheiro+=Math.round(selectedTower.totalCost*.7);torres.splice(torres.indexOf(selectedTower),1);selectedTower=null;els.upgradePanel.style.display='none';};els.panelClose.onclick=()=>els.upgradePanel.style.display='none';
showPhaseMenu();updateHUD();loop();
</script>
</body>
</html>
