<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clique de Moedas</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #2a2a60, #121226 60%, #0a0a17);
      color: #fff;
    }
    .card {
      width: min(92vw, 440px);
      background: rgba(20, 20, 40, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 6px; font-size: 1.6rem; }
    p { margin: 0 0 18px; opacity: 0.85; }
    .score {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 18px;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 20px 26px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(180deg, #ffd85d, #f7b600);
      color: #2c1f00;
      transition: transform .06s ease, filter .2s ease;
    }
    button:active { transform: scale(0.97); }
    button:hover { filter: brightness(1.05); }
    .hint { margin-top: 14px; font-size: 0.9rem; opacity: 0.75; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🪙 Clique de Moedas</h1>
    <p>Clique na moeda e veja quantas consegue juntar.</p>
    <div class="score" id="score">Moedas: 0</div>
    <button id="coinButton" type="button">+1 moeda</button>
    <div class="hint">Dica: seu recorde fica salvo no navegador.</div>
  </main>

  <script>
    const scoreEl = document.getElementById('score');
    const coinButton = document.getElementById('coinButton');
    const storageKey = 'clique_de_moedas_score';

    let score = Number(localStorage.getItem(storageKey) || 0);

    function render() {
      scoreEl.textContent = `Moedas: ${score}`;
    }

    coinButton.addEventListener('click', () => {
      score += 1;
      localStorage.setItem(storageKey, String(score));
      render();
    });

    render();
  </script>
</body>
</html>
