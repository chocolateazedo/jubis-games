<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bate Bola Football — Jubis Games</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#0b3d1f,#052612);color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}a{position:fixed;top:12px;left:12px;color:#9dffb3;text-decoration:none;font-weight:700}.wrap{width:min(94vw,760px)}h1{text-align:center;margin:8px 0 14px;color:#e8ffef}.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,.32);padding:10px 12px;border-radius:12px}canvas{width:100%;aspect-ratio:16/9;background:repeating-linear-gradient(90deg,#1f7a3a 0 60px,#1b6d34 60px 120px);border:4px solid #d5ffe0;border-radius:14px;display:block;margin-top:12px;touch-action:none}.buttons{text-align:center;margin-top:12px}button{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:#9dffb3;color:#063b1e}
</style>
</head>
<body>
<a href="../../">← Voltar</a>
<div class="wrap">
  <h1>Bate Bola Football</h1>
  <div class="hud">
    <div>Pontos: <span id="score">0</span></div>
    <div>Vidas: <span id="lives">3</span></div>
    <div>Recorde: <span id="best">0</span></div>
  </div>
  <canvas id="field" width="960" height="540"></canvas>
  <div class="buttons"><button id="restart">Reiniciar</button></div>
</div>
<script>
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),bestEl=document.getElementById('best');
let score=0,lives=3,best=+localStorage.getItem('bate_bola_best')||0;
const paddle={x:24,y:220,w:16,h:100,speed:8};
const ball={x:480,y:270,r:11,vx:6,vy:3};
let up=false,down=false,running=true;
bestEl.textContent=best;
function resetBall(dir=1){ball.x=canvas.width/2;ball.y=canvas.height/2;ball.vx=6*dir;ball.vy=(Math.random()*6)-3}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=6;ctx.setLineDash([18,18]);ctx.beginPath();ctx.moveTo(canvas.width/2,0);ctx.lineTo(canvas.width/2,canvas.height);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#d9ffe5';ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.beginPath();ctx.arc(canvas.width-24,canvas.height/2,68,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=5;ctx.stroke();}
function update(){if(!running)return; if(up)paddle.y-=paddle.speed; if(down)paddle.y+=paddle.speed; paddle.y=Math.max(0,Math.min(canvas.height-paddle.h,paddle.y));
ball.x+=ball.vx; ball.y+=ball.vy;
if(ball.y<ball.r||ball.y>canvas.height-ball.r)ball.vy*=-1;
if(ball.x-ball.r<paddle.x+paddle.w&&ball.y>paddle.y&&ball.y<paddle.y+paddle.h&&ball.vx<0){ball.vx*=-1.04;ball.vy+=((ball.y-(paddle.y+paddle.h/2))/18);score++;scoreEl.textContent=score;}
if(ball.x+ball.r>canvas.width-10){score+=5;scoreEl.textContent=score;resetBall(-1)}
if(ball.x<0){lives--;livesEl.textContent=lives;if(lives<=0){running=false;if(score>best){best=score;localStorage.setItem('bate_bola_best',best);bestEl.textContent=best}setTimeout(()=>alert('Fim de jogo! Pontos: '+score),50);}else resetBall(1)}
const aiY=ball.y-55; paddle.y+=Math.sign(aiY-paddle.y)*1.3;
}
function loop(){update();draw();requestAnimationFrame(loop)}
loop();
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')up=true;if(e.key==='ArrowDown'||e.key==='s')down=true});
document.addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key==='w')up=false;if(e.key==='ArrowDown'||e.key==='s')down=false});
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();const y=(e.clientY-r.top)*(canvas.height/r.height);paddle.y=y-paddle.h/2});
document.getElementById('restart').onclick=()=>{score=0;lives=3;scoreEl.textContent=0;livesEl.textContent=3;running=true;resetBall(1)};
</script>
</body>
</html>
