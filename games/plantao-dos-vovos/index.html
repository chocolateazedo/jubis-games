<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Plantão dos Vovôs</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Rubik', Arial, sans-serif; color: #fff; background: #2c3e2a; }
    canvas { display: block; position: fixed; inset: 0; }
    a.back { position: fixed; top: 10px; left: 10px; z-index: 30; color: #fff; text-decoration: none; font-weight: 800;
             background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 10px; }
    #mute { position: fixed; top: 10px; right: 10px; z-index: 30; border: none; cursor: pointer;
            background: rgba(0,0,0,.45); color: #fff; font-size: 18px; padding: 6px 10px; border-radius: 10px; }
    #hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
           font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,.6); max-width: calc(100vw - 120px); }
    #hud span { background: rgba(0,0,0,.4); padding: 5px 10px; border-radius: 10px; white-space: nowrap; }
    /* controles de toque */
    .touch { display: none; }
    @media (hover: none) and (pointer: coarse) { .touch { display: block; } }
    #joy { position: fixed; left: 24px; bottom: 26px; width: 120px; height: 120px; border-radius: 50%;
           background: rgba(255,255,255,.22); border: 2px solid rgba(255,255,255,.4); z-index: 25; }
    #stick { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px; border-radius: 50%; background: rgba(232,133,59,.85); }
    #act { position: fixed; right: 26px; bottom: 40px; width: 96px; height: 96px; border-radius: 50%; z-index: 25;
           background: rgba(56,160,80,.85); color: #fff; border: none; font-weight: 800; font-size: 16px; }
    /* painel (intro / fim de dia / fim de jogo) */
    #panel { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
             background: rgba(8,14,10,.74); padding: 16px; }
    #panel.hidden { display: none; }
    .card { background: linear-gradient(180deg, #34502f, #233619); color: #fff; border: 2px solid rgba(255,255,255,.18);
            border-radius: 18px; padding: 22px 22px 24px; width: min(94vw, 470px); text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.55); }
    .card h1 { margin: 0 0 6px; font-size: 27px; }
    .card p { margin: 8px 0; opacity: .96; line-height: 1.45; font-size: 15px; }
    .help { text-align: left; background: rgba(0,0,0,.22); border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-size: 14px; line-height: 1.7; }
    .help b { color: #ffd98a; }
    .bigbtn { margin-top: 14px; border: none; border-radius: 12px; padding: 13px 24px; font-weight: 800; font-size: 18px;
              background: #e8853b; color: #fff; cursor: pointer; box-shadow: 0 6px 0 #b9652a; }
    .bigbtn:active { transform: translateY(2px); box-shadow: 0 4px 0 #b9652a; }
  </style>
</head>
<body>
  <a class="back" href="../../">← Voltar</a>
  <button id="mute" type="button" aria-label="Som">🔊</button>
  <div id="hud">
    <span id="time">⏱ 80</span><span id="day">📅 Dia 1</span><span id="goal">🎯 0/6</span><span id="score">⭐ 0</span><span id="best">🏆 0</span><span id="carry">🧺 vazio</span>
  </div>
  <canvas id="game"></canvas>
  <div class="touch">
    <div id="joy"><div id="stick"></div></div>
    <button id="act" type="button">AGIR</button>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <h1 id="pTitle">Plantão dos Vovôs</h1>
      <div id="pBody"></div>
      <button id="pBtn" class="bigbtn" type="button">Começar</button>
    </div>
  </div>

  <script>
    const cv = document.getElementById('game');
    const ctx = cv.getContext('2d');
    function resize() { cv.width = innerWidth; cv.height = innerHeight; }
    addEventListener('resize', resize); resize();

    const BEST_KEY = 'plantao-dos-vovos-best';
    const MUTE_KEY = 'plantao-dos-vovos-muted';
    const DAY_TIME = 80, PATIENCE = 20, RANGE = 78;
    const NEED_EMOJI = { pill: '💊', shot: '💉', food: '🍲', water: '💧', bath: '🚿', sleep: '😴', walk: '🚶', company: '❤️' };
    const NEED_NAME = { pill: 'comprimido', shot: 'vacina', food: 'comida', water: 'água', bath: 'banho', sleep: 'soneca', walk: 'passeio', company: 'companhia' };
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    // dificuldade por dia
    const dayCount = (d) => Math.min(4 + d, 8);          // dia 1 = 5 idosos, cresce até 8
    const dayPatience = (d) => Math.max(12, PATIENCE - (d - 1) * 1.0);
    const dayGoal = (d) => 4 + d * 2;                    // atendimentos para passar de dia

    // ---------- mundo em tiles ----------
    const TS = 44, COLS = 48, ROWS = 36;
    const WORLD_W = COLS * TS, WORLD_H = ROWS * TS;
    const T = { GRASS: 0, PATH: 1, WALL: 2, FLOOR: 3, HEDGE: 4, WATER: 5, FLOWER: 6, TREE: 7 };
    const SOLID = { 2: 1, 4: 1, 5: 1, 7: 1 };
    let map = [];

    // prédio
    const bx = 4, by = 3, bw = 26, bh = 22;
    const midC = bx + 13, midR = by + 11;

    function gen() {
      map = Array.from({ length: ROWS }, () => Array(COLS).fill(T.GRASS));
      // cerca na borda do mundo
      for (let c = 0; c < COLS; c++) { map[0][c] = T.HEDGE; map[ROWS - 1][c] = T.HEDGE; }
      for (let r = 0; r < ROWS; r++) { map[r][0] = T.HEDGE; map[r][COLS - 1] = T.HEDGE; }
      // prédio: piso + paredes
      for (let r = by; r < by + bh; r++) for (let c = bx; c < bx + bw; c++) {
        map[r][c] = (r === by || r === by + bh - 1 || c === bx || c === bx + bw - 1) ? T.WALL : T.FLOOR;
      }
      // divisórias internas
      for (let c = bx; c < bx + bw; c++) map[midR][c] = T.WALL;
      for (let r = by; r <= midR; r++) map[r][midC] = T.WALL;
      for (let r = midR; r < by + bh; r++) map[r][midC] = T.WALL;
      // portas (abre o piso na parede)
      const door = (r, c) => { map[r][c] = T.FLOOR; };
      door(by + 5, midC); door(midR + 5, midC);            // verticais
      door(midR, bx + 6); door(midR, bx + 19);             // horizontais
      door(by + bh - 1, midC); door(by + bh - 1, midC - 1); // entrada sul
      door(by + 8, bx + bw - 1); door(by + 9, bx + bw - 1); // porta lateral leste (saída rápida pro jardim)
      // caminho da entrada até o jardim (à direita)
      for (let r = by + bh; r < by + bh + 4; r++) for (let c = midC - 1; c <= midC; c++) map[r][c] = T.PATH;
      for (let c = midC; c < bx + bw + 14; c++) { map[by + bh + 3][c] = T.PATH; map[by + bh + 4][c] = T.PATH; }
      // caminho curto saindo da porta lateral até os bancos
      for (let c = bx + bw; c <= bx + bw + 6; c++) { map[by + 8][c] = T.PATH; map[by + 9][c] = T.PATH; }
      // lago no jardim
      for (let r = 22; r <= 26; r++) for (let c = 36; c <= 41; c++) map[r][c] = T.WATER;
      // árvores e flores espalhadas (determinístico, fora do prédio/lago)
      const occupied = (r, c) => map[r][c] !== T.GRASS;
      let seed = 7;
      const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
      for (let i = 0; i < 70; i++) {
        const c = 2 + Math.floor(rnd() * (COLS - 4)), r = 2 + Math.floor(rnd() * (ROWS - 4));
        if (occupied(r, c)) continue;
        map[r][c] = rnd() < 0.4 ? T.TREE : T.FLOWER;
      }
    }
    gen();

    // ---------- móveis / detalhes ----------
    const props = [], solidRects = [];
    function P(kind, tc, tr, w, h, solid, flat) {
      const x = tc * TS, y = tr * TS, pw = w * TS, ph = h * TS;
      props.push({ kind, x, y, w: pw, h: ph, flat: !!flat });
      if (solid) solidRects.push({ x: x + 4, y: y + 4, w: pw - 8, h: ph - 8 });
    }
    // Farmácia (cima-esq)
    P('rug', bx + 2, by + 5, 5, 3, false, true); P('cabinet', bx + 1, by + 8, 2, 3, true); P('plant', bx + 10, by + 8, 1, 2, true);
    P('painting', bx + 4, by + 1, 2, 1, false, true);
    // Cozinha (cima-dir)
    P('fridge', bx + 22, by + 7, 2, 3, true); P('table', bx + 16, by + 8, 3, 2, true); P('plant', bx + 14, by + 8, 1, 2, true);
    P('painting', bx + 18, by + 1, 2, 1, false, true);
    // Quarto (baixo-esq) com 2 camas (camas não são sólidas: dá pra deitar o vovô)
    P('bed', bx + 2, by + 15, 3, 4, false); P('bed', bx + 8, by + 15, 3, 4, false);
    P('nightstand', bx + 5, by + 15, 1, 1, true); P('rug', bx + 2, by + 20, 5, 2, false, true); P('plant', bx + 11, by + 20, 1, 2, true);
    P('painting', bx + 3, by + 12, 2, 1, false, true);
    // Quarto/Banho (baixo-dir)
    P('bed', bx + 15, by + 15, 3, 4, false); P('bathtub', bx + 21, by + 19, 3, 2, true);
    P('toilet', bx + 24, by + 20, 1, 1, true); P('sink', bx + 24, by + 14, 1, 1, true); P('plant', bx + 19, by + 20, 1, 2, true);
    // Jardim
    P('bench', 35, 12, 2, 1, true); P('bench', 39, 18, 2, 1, true); P('fountain', 30, 26, 3, 3, true);

    // ---------- estações / idosos ----------
    const px = (c) => (c + 0.5) * TS, py = (r) => (r + 0.5) * TS;
    const stations = [
      { type: 'pill', emoji: '💊', x: px(bx + 3), y: py(by + 3), name: 'Comprimidos' },
      { type: 'shot', emoji: '💉', x: px(bx + 9), y: py(by + 3), name: 'Vacinas' },
      { type: 'food', emoji: '🍲', x: px(bx + 16), y: py(by + 3), name: 'Cozinha' },
      { type: 'water', emoji: '🚰', x: px(bx + 22), y: py(by + 3), name: 'Bebedouro' },
      { type: 'bath', emoji: '🚿', x: px(bx + 22), y: py(by + 18), name: 'Banho' },
    ];
    const bathStation = stations.find((s) => s.type === 'bath'); // chuveiro = destino do banho
    // centro de cada cama (destino da soneca)
    const beds = [[bx + 3, by + 16], [bx + 9, by + 16], [bx + 16, by + 16]].map((b) => ({ x: px(b[0]), y: py(b[1]) + 8 }));
    // destinos de "passear": em frente aos bancos do jardim e à fonte
    const walkSpots = [
      { x: px(36), y: py(13), kind: 'bench' },
      { x: px(40), y: py(19), kind: 'bench' },
      { x: px(31), y: py(29), kind: 'fountain' },
    ];
    // pombos em frente aos bancos (decorativos; os vovôs os alimentam)
    const pigeons = [];
    function makePigeons() {
      pigeons.length = 0;
      const areas = [{ x: px(36), y: py(14) }, { x: px(40), y: py(20) }];
      for (const a of areas) for (let i = 0; i < 3; i++) {
        const hx = a.x + (i - 1) * 26, hy = a.y + (i % 2) * 12;
        pigeons.push({ hx, hy, x: hx, y: hy, phase: i * 1.7, off: (i - 1) * 16 });
      }
    }
    makePigeons();
    const PLAYER_PAL = { skin: '#f1c27d', hair: '#5a3a1a', shirt: '#eef4ff', pants: '#3a4a66' };
    const ELDER_PALS = [
      { skin: '#f1c27d', hair: '#dddddd', shirt: '#b85c5c', pants: '#5a5a5a' },
      { skin: '#e0ac69', hair: '#cfcfcf', shirt: '#5c8db8', pants: '#4a4a4a' },
      { skin: '#c68642', hair: '#e8e8e8', shirt: '#6a9a5a', pants: '#403a30' },
      { skin: '#ffdbac', hair: '#cccccc', shirt: '#9a6ab8', pants: '#444444' },
      { skin: '#8d5524', hair: '#eeeeee', shirt: '#c2a23a', pants: '#3a3a3a' },
    ];
    // lugares onde os idosos ficam (nas camas + bancos do jardim). Até 8 por dia.
    // As camas não são sólidas, então dá pra chegar perto e interagir.
    const ELDER_SPOTS = [
      [bx + 3, by + 16], [bx + 9, by + 16], [bx + 16, by + 16], [36, 12], [40, 18],
      [33, 8], [44, 10], [33, 30],
    ];
    let elders = [];
    function makeElders(count) {
      elders = ELDER_SPOTS.slice(0, count).map((s, i) => {
        const x = px(s[0]), y = py(s[1]);
        return {
          x, y, homeX: x, homeY: y, pal: ELDER_PALS[i % ELDER_PALS.length], dir: 0,
          idle: Math.random() * 6, need: null, patience: 0, maxPat: PATIENCE, cooldown: 2 + i * 0.5, happy: 0, sad: 0,
          escorting: false, busy: 0, busyKind: null, walkKind: null, feedTimer: 0, returning: false,
        };
      });
    }

    const player = { x: px(bx + 6), y: py(by + 19), r: 16, carry: null, escort: null, moving: false, dir: 0, walkPhase: 0, pal: PLAYER_PAL };
    const cam = { x: 0, y: 0 };
    let state = 'intro'; // intro | playing | dayclear | over
    let day, score, timeLeft, spawnTimer, served, dayServed, goal, curPat, toastMsg, toastT, time, floaters, particles;
    let panelAction = null;

    let best = Number(localStorage.getItem(BEST_KEY) || 0);
    let muted = localStorage.getItem(MUTE_KEY) === '1';

    // ---------- painel ----------
    const panel = document.getElementById('panel');
    const pTitle = document.getElementById('pTitle');
    const pBody = document.getElementById('pBody');
    const pBtn = document.getElementById('pBtn');
    function showPanel(title, bodyHTML, btnLabel, action) {
      pTitle.innerHTML = title; pBody.innerHTML = bodyHTML; pBtn.textContent = btnLabel;
      panelAction = action; panel.classList.remove('hidden');
    }
    function hidePanel() { panel.classList.add('hidden'); }
    pBtn.addEventListener('click', () => { A(); goFullscreen(); if (panelAction) panelAction(); });

    function showIntro() {
      state = 'intro';
      showPanel('🧓 Plantão dos Vovôs',
        `<p>Você é o <b>cuidador</b> da casa de repouso! Os vovôs vão pedir coisas — leve o certo a tempo.</p>
         <div class="help">
           <b>💊</b> remédio &nbsp; <b>💉</b> vacina &nbsp; <b>🍲</b> comida &nbsp; <b>💧</b> água<br>
           🧺 Esses 4: pegue na <b>estação</b> certa e leve até quem pediu.<br>
           <b>🚿</b> Banho: <b>leve o vovô até o chuveiro</b>.<br>
           <b>😴</b> Soneca: <b>leve o vovô até a cama</b>.<br>
           <b>🚶</b> Passeio: <b>leve o vovô lá fora</b> (banco ou fonte) — no banco ele dá comida aos pombos! 🐦<br>
           <b>❤️</b> Companhia: é só chegar perto.<br>
           🚪 Dica: a <b>porta lateral</b> é um atalho pro jardim.<br>
           🕹️ Mover: <b>setas/WASD</b> ou o direcional.<br>
           👉 Agir / pegar / soltar: botão <b>AGIR</b>, <b>E</b>, espaço ou Enter.
         </div>
         <p>Atenda a meta de atendimentos de cada dia para avançar. Boa sorte! 🌻</p>`,
        '▶ Começar plantão', startGame);
    }

    function startGame() { day = 0; score = 0; served = 0; startDay(1); }

    function startDay(d) {
      day = d; goal = dayGoal(d); curPat = dayPatience(d);
      timeLeft = DAY_TIME; spawnTimer = 2.5; dayServed = 0;
      time = 0; toastMsg = ''; toastT = 0; floaters = []; particles = [];
      player.x = px(bx + 6); player.y = py(by + 19); player.carry = null; player.escort = null; player.dir = 0; player.walkPhase = 0;
      makeElders(dayCount(d));
      hidePanel(); state = 'playing';
      toast('Dia ' + d + ' — atenda ' + goal + ' vovôs!');
      updateHud();
    }

    function endDay() {
      if (score > best) { best = score; localStorage.setItem(BEST_KEY, String(best)); }
      if (dayServed >= goal) {
        state = 'dayclear'; sndDayWin();
        showPanel('Dia ' + day + ' concluído! 🎉',
          `<p>Atendimentos: <b>${dayServed}</b> (meta: ${goal})</p>
           <p>⭐ Pontos: <b>${score}</b> &nbsp; 🏆 Recorde: <b>${best}</b></p>
           <p>O Dia ${day + 1} vai ter mais vovôs e menos paciência. Pronto?</p>`,
          'Próximo dia →', () => startDay(day + 1));
      } else {
        state = 'over'; sndEnd();
        showPanel('Fim da carreira 😴',
          `<p>Você não bateu a meta do Dia ${day} (fez ${dayServed} de ${goal}).</p>
           <p>📅 Chegou ao <b>Dia ${day}</b> &nbsp; ⭐ Pontos: <b>${score}</b></p>
           <p>🏆 Recorde: <b>${best}</b></p>`,
          '↻ Jogar de novo', () => startGame());
      }
    }

    function updateHud() {
      const timeEl = document.getElementById('time');
      timeEl.textContent = '⏱ ' + Math.ceil(timeLeft);
      timeEl.style.color = (state === 'playing' && timeLeft <= 15) ? '#ffd24a' : '#fff';
      document.getElementById('day').textContent = '📅 Dia ' + day;
      const goalEl = document.getElementById('goal');
      goalEl.textContent = '🎯 ' + dayServed + '/' + goal;
      goalEl.style.color = dayServed >= goal ? '#7fe39a' : '#fff';
      document.getElementById('score').textContent = '⭐ ' + score;
      document.getElementById('best').textContent = '🏆 ' + best;
      document.getElementById('carry').textContent = player.carry ? ('🧺 ' + NEED_EMOJI[player.carry]) : '🧺 vazio';
    }
    function toast(m) { toastMsg = m; toastT = 1.6; }
    function floater(x, y, txt, color) { floaters.push({ x, y, txt, color, life: 1.1 }); }
    function burst(x, y, color, n) {
      for (let i = 0; i < (n || 10); i++) {
        const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 120;
        particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: 0.5 + Math.random() * 0.4, color });
      }
    }

    // ---------- som ----------
    let actx;
    function A() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (actx.state === 'suspended') actx.resume(); return actx; }
    function beep(freq, dur, type, vol, slideTo) {
      if (muted) return;
      const c = A(); if (!c) return; const t = c.currentTime;
      const o = c.createOscillator(); o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      const g = c.createGain(); g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
    }
    const sndPickup = () => beep(520, 0.08, 'square', 0.18, 760);
    const sndDeliver = () => { beep(660, 0.1, 'triangle', 0.2); setTimeout(() => beep(990, 0.13, 'triangle', 0.2), 90); };
    const sndFail = () => beep(220, 0.28, 'sawtooth', 0.22, 80);
    const sndEnd = () => { beep(523, 0.18, 'triangle', 0.22); setTimeout(() => beep(392, 0.3, 'triangle', 0.22), 160); };
    const sndDayWin = () => { beep(523, 0.12, 'triangle', 0.22); setTimeout(() => beep(659, 0.12, 'triangle', 0.22), 120); setTimeout(() => beep(784, 0.2, 'triangle', 0.22), 240); };

    const muteBtn = document.getElementById('mute');
    function paintMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
    paintMute();
    muteBtn.addEventListener('click', () => { muted = !muted; localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); paintMute(); if (!muted) A(); });

    // ---------- input ----------
    const keys = {};
    let fsDone = false;
    function goFullscreen() { if (fsDone) return; fsDone = true; const el = document.documentElement; const fn = el.requestFullscreen || el.webkitRequestFullscreen; if (fn) try { fn.call(el); } catch (e) {} }
    addEventListener('keydown', (e) => {
      keys[e.code] = true; A();
      if (['KeyE', 'Space', 'Enter'].includes(e.code)) {
        if (state === 'playing') { action(); } else if (panelAction) { goFullscreen(); A(); panelAction(); }
        e.preventDefault();
      }
    });
    addEventListener('keyup', (e) => { keys[e.code] = false; });

    const joy = { x: 0, y: 0, id: null, cx: 0, cy: 0 };
    const joyEl = document.getElementById('joy'), stickEl = document.getElementById('stick');
    joyEl.addEventListener('touchstart', (e) => {
      A(); goFullscreen(); const t = e.changedTouches[0]; joy.id = t.identifier;
      const r = joyEl.getBoundingClientRect(); joy.cx = r.left + r.width / 2; joy.cy = r.top + r.height / 2; e.preventDefault();
    }, { passive: false });
    addEventListener('touchmove', (e) => {
      for (const t of e.changedTouches) if (t.identifier === joy.id) {
        joy.x = clamp((t.clientX - joy.cx) / 50, -1, 1); joy.y = clamp((t.clientY - joy.cy) / 50, -1, 1);
        stickEl.style.transform = `translate(${joy.x * 32}px,${joy.y * 32}px)`;
      }
    }, { passive: false });
    addEventListener('touchend', (e) => {
      for (const t of e.changedTouches) if (t.identifier === joy.id) { joy.id = null; joy.x = joy.y = 0; stickEl.style.transform = ''; }
    });
    document.getElementById('act').addEventListener('touchstart', (e) => { A(); action(); e.preventDefault(); }, { passive: false });

    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    function award(x, y) {
      score += 10; served++; dayServed++;
      floater(x, y - 42, '+10', '#1e8f3a'); burst(x, y - 20, '#ffe08a', 12); sndDeliver();
      if (score > best) { best = score; localStorage.setItem(BEST_KEY, String(best)); }
    }
    function nearestBed() { let b = null, bd = 1e9; for (const k of beds) { const d = dist(player, k); if (d < bd) { bd = d; b = k; } } return { bed: b, d: bd }; }
    function nearestWalk() { let s = null, sd = 1e9; for (const k of walkSpots) { const d = dist(player, k); if (d < sd) { sd = d; s = k; } } return { spot: s, d: sd }; }
    function dropEscort(e, dx, dy, dur, walkKind) {
      e.escorting = false; player.escort = null;
      e.x = dx; e.y = dy; e.busy = dur; e.busyKind = e.need; e.walkKind = walkKind || null; e.feedTimer = 0; e.happy = 1;
      award(dx, dy); e.need = null; e.cooldown = 3; updateHud();
    }

    function action() {
      if (state !== 'playing') return;

      // já está levando um vovô? tenta deixá-lo no destino certo
      if (player.escort) {
        const e = player.escort;
        if (e.need === 'bath') {
          if (dist(player, bathStation) < RANGE) dropEscort(e, bathStation.x, bathStation.y, 1.8);
          else toast('Leve o vovô até o chuveiro 🚿');
          return;
        }
        if (e.need === 'sleep') {
          const nb = nearestBed();
          if (nb.bed && nb.d < RANGE) dropEscort(e, nb.bed.x, nb.bed.y, 2.2);
          else toast('Leve o vovô até a cama 🛏️');
          return;
        }
        if (e.need === 'walk') {
          const nw = nearestWalk();
          if (nw.spot && nw.d < RANGE) dropEscort(e, nw.spot.x, nw.spot.y, 4.5, nw.spot.kind);
          else toast('Leve pra passear: um banco ou a fonte lá fora 🚶');
          return;
        }
      }

      // idoso próximo que está pedindo (e que não esteja já ocupado)
      let target = null, td = 1e9;
      for (const e of elders) {
        if (!e.need || e.escorting || e.busy > 0 || e.returning) continue;
        const d = dist(player, e); if (d < RANGE && d < td) { td = d; target = e; }
      }
      if (target) {
        if (target.need === 'company') { target.happy = 1; award(target.x, target.y); target.need = null; target.cooldown = 2; updateHud(); return; }
        if (target.need === 'bath' || target.need === 'sleep' || target.need === 'walk') {
          target.escorting = true; player.escort = target; sndPickup();
          toast(target.need === 'bath' ? 'Levando ao chuveiro 🚿' : target.need === 'sleep' ? 'Levando para dormir 😴' : 'Levando pra passear 🚶');
          return;
        }
        if (player.carry === target.need) { target.happy = 1; player.carry = null; award(target.x, target.y); target.need = null; target.cooldown = 2; updateHud(); return; }
      }

      // pegar item numa estação (banho não é item: é destino)
      let st = null, sd = 1e9;
      for (const s of stations) { if (s.type === 'bath') continue; const d = dist(player, s); if (d < RANGE && d < sd) { sd = d; st = s; } }
      if (st) { player.carry = st.type; sndPickup(); toast('Pegou ' + st.emoji); updateHud(); return; }

      if (target) toast('Precisa de ' + NEED_EMOJI[target.need] + ' ' + NEED_NAME[target.need]);
    }

    function spawnInterval() {
      const base = 4.4 - (1 - timeLeft / DAY_TIME) * 2.4; // acelera ao longo do dia
      return Math.max(1.1, base - (day - 1) * 0.35);      // e acelera a cada dia
    }
    function randNeed() { const p = ['pill', 'shot', 'food', 'water', 'bath', 'sleep', 'walk', 'company']; return p[Math.floor(Math.random() * p.length)]; }

    function collide() {
      const r = player.r;
      const c0 = Math.floor((player.x - r) / TS), c1 = Math.floor((player.x + r) / TS);
      const r0 = Math.floor((player.y - r) / TS), r1 = Math.floor((player.y + r) / TS);
      for (let rr = r0; rr <= r1; rr++) for (let cc = c0; cc <= c1; cc++) {
        if (rr < 0 || cc < 0 || rr >= ROWS || cc >= COLS || !SOLID[map[rr][cc]]) continue;
        const wx = cc * TS, wy = rr * TS;
        const nx = clamp(player.x, wx, wx + TS), ny = clamp(player.y, wy, wy + TS);
        const dx = player.x - nx, dy = player.y - ny, d2 = dx * dx + dy * dy;
        if (d2 < r * r && d2 > 1e-6) { const d = Math.sqrt(d2); player.x = nx + dx / d * r; player.y = ny + dy / d * r; }
      }
      // móveis sólidos
      for (const w of solidRects) {
        const nx = clamp(player.x, w.x, w.x + w.w), ny = clamp(player.y, w.y, w.y + w.h);
        const dx = player.x - nx, dy = player.y - ny, d2 = dx * dx + dy * dy;
        if (d2 < r * r && d2 > 1e-6) { const d = Math.sqrt(d2); player.x = nx + dx / d * r; player.y = ny + dy / d * r; }
      }
    }

    function update(dt) {
      time += dt;
      let mx = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0) + joy.x;
      let my = (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0) - (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0) + joy.y;
      const len = Math.hypot(mx, my); player.moving = len > 0.1;
      if (len > 1) { mx /= len; my /= len; }
      if (player.moving) {
        player.dir = Math.abs(mx) > Math.abs(my) ? (mx > 0 ? 3 : 2) : (my > 0 ? 0 : 1); // 0=baixo 1=cima 2=esq 3=dir
        player.walkPhase += dt * 11;
      }
      const SPEED = 190;
      player.x = clamp(player.x + mx * SPEED * dt, 8, WORLD_W - 8); collide();
      player.y = clamp(player.y + my * SPEED * dt, 8, WORLD_H - 8); collide();

      for (const e of elders) {
        e.idle += dt;
        if (e.happy > 0) e.happy -= dt; if (e.sad > 0) e.sad -= dt;
        // sendo levado pelo cuidador: segue-o (paciência pausada)
        if (e.escorting) {
          const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) || 1;
          if (d > 36) { const step = Math.min(d - 36, 230 * dt); e.x += dx / d * step; e.y += dy / d * step; }
          e.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 3 : 2) : (dy > 0 ? 0 : 1);
          continue;
        }
        // no chuveiro / deitado na cama / passeando (no banco joga comida pros pombos)
        if (e.busy > 0) {
          e.busy -= dt;
          if (e.busyKind === 'walk' && e.walkKind === 'bench') {
            e.feedTimer -= dt;
            if (e.feedTimer <= 0) { e.feedTimer = 0.5; particles.push({ x: e.x + 10, y: e.y - 8, vx: 30 + Math.random() * 40, vy: -70 - Math.random() * 30, life: 1.0, color: '#caa46a' }); }
          }
          if (e.busy <= 0) e.returning = true;
          continue;
        }
        // voltando para o lugar de origem
        if (e.returning) {
          const dx = e.homeX - e.x, dy = e.homeY - e.y, d = Math.hypot(dx, dy) || 1;
          if (d > 4) { const step = Math.min(d, 190 * dt); e.x += dx / d * step; e.y += dy / d * step; e.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 3 : 2) : (dy > 0 ? 0 : 1); }
          else { e.x = e.homeX; e.y = e.homeY; e.returning = false; }
          continue;
        }
        // parado no lugar: olha pro cuidador quando ele chega perto
        const dx = player.x - e.x, dy = player.y - e.y;
        if (dx * dx + dy * dy < 150 * 150) e.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 3 : 2) : (dy > 0 ? 0 : 1);
        if (e.need) { e.patience -= dt; if (e.patience <= 0) { e.need = null; e.cooldown = 3; e.sad = 1.4; score = Math.max(0, score - 5); floater(e.x, e.y - 42, '-5', '#e03b3b'); sndFail(); updateHud(); } }
        else if (e.cooldown > 0) e.cooldown -= dt;
      }
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        const active = elders.filter((e) => e.need).length; // no máximo 2 pedidos ao mesmo tempo
        if (active < 2) {
          const idle = elders.filter((e) => !e.need && e.cooldown <= 0 && !e.escorting && e.busy <= 0 && !e.returning);
          if (idle.length) { const e = idle[Math.floor(Math.random() * idle.length)]; e.need = randNeed(); e.patience = curPat; e.maxPat = curPat; }
        }
        spawnTimer = spawnInterval();
      }
      for (let i = floaters.length - 1; i >= 0; i--) { const f = floaters[i]; f.y -= 34 * dt; f.life -= dt; if (f.life <= 0) floaters.splice(i, 1); }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt; p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      // pombos: aproximam-se de quem alimenta no banco; senão voltam ao lugar
      for (const p of pigeons) {
        let feeder = null, fd = 1e9;
        for (const e of elders) if (e.busy > 0 && e.busyKind === 'walk' && e.walkKind === 'bench') {
          const d = Math.hypot(p.hx - e.x, p.hy - e.y); if (d < 150 && d < fd) { fd = d; feeder = e; }
        }
        const tx = feeder ? feeder.x + p.off : p.hx;
        const ty = feeder ? feeder.y + 26 : p.hy;
        p.x += (tx - p.x) * Math.min(1, dt * 3);
        p.y += (ty - p.y) * Math.min(1, dt * 3);
        p.phase += dt * (feeder ? 9 : 3);
      }
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; endDay(); }
      if (toastT > 0) toastT -= dt;
      updateHud();
    }

    // ---------- desenho ----------
    function emoji(ch, x, y, size) { ctx.fillStyle = '#1a1a1a'; ctx.font = size + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ch, x, y); }
    function shadow(x, y, r) { ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.beginPath(); ctx.ellipse(x, y + 15, r, r * 0.45, 0, 0, 7); ctx.fill(); }
    function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }

    // boneco desenhado, 4 direções + caminhada (dir: 0=baixo 1=cima 2=esq 3=dir)
    function drawChar(x, y, dir, phase, pal, moving) {
      const sw = moving ? Math.sin(phase) * 4 : 0;
      const sway = moving ? sw * 0.5 : Math.sin(phase) * 1.3; // braço respira parado
      ctx.fillStyle = pal.pants; rr(x - 7, y + 8 - sw, 6, 11, 3); rr(x + 1, y + 8 + sw, 6, 11, 3);
      ctx.fillStyle = pal.shirt; rr(x - 12, y - 4 + sway, 5, 13, 3); rr(x + 7, y - 4 - sway, 5, 13, 3);
      ctx.fillStyle = pal.shirt; rr(x - 9, y - 6, 18, 17, 6);
      ctx.fillStyle = pal.skin; ctx.beginPath(); ctx.arc(x, y - 13, 9, 0, 7); ctx.fill();
      ctx.fillStyle = pal.hair;
      if (dir === 1) { ctx.beginPath(); ctx.arc(x, y - 13, 9, 0, 7); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(x, y - 15, 9, Math.PI, 2 * Math.PI); ctx.fill(); ctx.fillRect(x - 9, y - 15, 18, 3); }
      if (dir !== 1) {
        ctx.fillStyle = '#222'; const off = dir === 2 ? -3 : dir === 3 ? 3 : 0;
        ctx.beginPath(); ctx.arc(x - 3 + off, y - 11, 1.7, 0, 7); ctx.arc(x + 3 + off, y - 11, 1.7, 0, 7); ctx.fill();
      }
    }

    function drawProp(p) {
      const x = p.x - cam.x, y = p.y - cam.y, w = p.w, h = p.h;
      switch (p.kind) {
        case 'rug': ctx.fillStyle = '#b65b5b'; rr(x, y, w, h, 10); ctx.fillStyle = '#d98a8a'; rr(x + 8, y + 8, w - 16, h - 16, 8); break;
        case 'bed': ctx.fillStyle = '#7a5230'; rr(x, y, w, h, 6); ctx.fillStyle = '#f4ece0'; rr(x + 4, y + 4, w - 8, h - 8, 6); ctx.fillStyle = '#cfe3ff'; rr(x + 6, y + 6, w - 12, h * 0.34, 6); ctx.fillStyle = '#9fc0ec'; rr(x + 6, y + h * 0.44, w - 12, h * 0.5, 6); break;
        case 'nightstand': ctx.fillStyle = '#8a5a2b'; rr(x, y, w, h, 4); emoji('💡', x + w / 2, y + h / 2, 18); break;
        case 'plant': ctx.fillStyle = '#7a4a22'; rr(x + w * 0.25, y + h * 0.55, w * 0.5, h * 0.4, 4); ctx.fillStyle = '#2e8b3a'; ctx.beginPath(); ctx.arc(x + w / 2, y + h * 0.38, w * 0.42, 0, 7); ctx.fill(); break;
        case 'painting': ctx.fillStyle = '#caa46a'; rr(x, y, w, h, 3); ctx.fillStyle = '#7ec0ee'; rr(x + 3, y + 3, w - 6, h - 6, 2); emoji('🖼️', x + w / 2, y + h / 2, 18); break;
        case 'table': ctx.fillStyle = '#9c6b3f'; rr(x, y, w, h, 6); ctx.fillStyle = '#b5824f'; rr(x + 5, y + 5, w - 10, h - 10, 4); emoji('🍽️', x + w / 2, y + h / 2, 18); break;
        case 'fridge': ctx.fillStyle = '#eef3f7'; rr(x, y, w, h, 6); ctx.strokeStyle = '#b9c2cc'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 4, y + h * 0.42); ctx.lineTo(x + w - 4, y + h * 0.42); ctx.stroke(); break;
        case 'cabinet': ctx.fillStyle = '#a9763f'; rr(x, y, w, h, 5); ctx.fillStyle = '#8a5a2b'; rr(x + 5, y + 5, w - 10, h / 2 - 8, 3); rr(x + 5, y + h / 2 + 3, w - 10, h / 2 - 8, 3); break;
        case 'bathtub': ctx.fillStyle = '#dfe9f0'; rr(x, y, w, h, 14); ctx.fillStyle = '#bfe0f5'; rr(x + 6, y + 6, w - 12, h - 12, 12); break;
        case 'toilet': ctx.fillStyle = '#ffffff'; rr(x, y, w, h, 8); ctx.fillStyle = '#dde6ec'; rr(x + 4, y + 4, w - 8, h * 0.5, 8); break;
        case 'sink': ctx.fillStyle = '#eef3f7'; rr(x, y, w, h, 8); emoji('🚰', x + w / 2, y + h / 2, 18); break;
        case 'bench': ctx.fillStyle = '#9c6b3f'; rr(x, y, w, h, 5); ctx.fillStyle = '#7a5230'; ctx.fillRect(x, y + h * 0.4, w, 3); break;
        case 'fountain': ctx.fillStyle = '#9aa0a6'; rr(x, y, w, h, 14); ctx.fillStyle = '#4aa3d6'; ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, w * 0.32, 0, 7); ctx.fill(); emoji('⛲', x + w / 2, y + h / 2, 24); break;
      }
    }

    function drawTile(t, sx, sy, c, r) {
      const alt = (c + r) % 2;
      if (t === T.GRASS || t === T.FLOWER || t === T.TREE) { ctx.fillStyle = alt ? '#6cae4a' : '#74b850'; ctx.fillRect(sx, sy, TS, TS); }
      else if (t === T.PATH) { ctx.fillStyle = alt ? '#cdab6f' : '#d4b577'; ctx.fillRect(sx, sy, TS, TS); }
      else if (t === T.FLOOR) { ctx.fillStyle = alt ? '#e7d2a4' : '#efdcb2'; ctx.fillRect(sx, sy, TS, TS); }
      else if (t === T.WALL) { ctx.fillStyle = '#8a7c5a'; ctx.fillRect(sx, sy, TS, TS); ctx.fillStyle = '#9c8e68'; ctx.fillRect(sx + 2, sy + 2, TS - 4, 6); }
      else if (t === T.HEDGE) { ctx.fillStyle = '#74b850'; ctx.fillRect(sx, sy, TS, TS); ctx.fillStyle = '#2f7d34'; ctx.beginPath(); ctx.roundRect(sx + 1, sy + 1, TS - 2, TS - 2, 8); ctx.fill(); }
      else if (t === T.WATER) { ctx.fillStyle = '#3f9fd6'; ctx.fillRect(sx, sy, TS, TS); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx + 6, sy + 14 + Math.sin(time * 2 + c) * 2); ctx.lineTo(sx + TS - 6, sy + 14); ctx.stroke(); }
      if (t === T.FLOWER) { ctx.fillStyle = ['#ff6b9d', '#ffd166', '#fff'][(c + r) % 3]; ctx.beginPath(); ctx.arc(sx + TS / 2, sy + TS / 2, 5, 0, 7); ctx.fill(); }
      if (t === T.TREE) { ctx.fillStyle = '#6b4a2a'; ctx.fillRect(sx + TS / 2 - 4, sy + TS - 16, 8, 14); ctx.fillStyle = '#2e8b3a'; ctx.beginPath(); ctx.arc(sx + TS / 2, sy + TS / 2 - 2, 16, 0, 7); ctx.fill(); }
    }

    function drawPigeon(p) {
      const x = p.x - cam.x, y = p.y - cam.y;
      const peck = Math.sin(p.phase) > 0.5 ? 3 : 0; // abaixa a cabeça pra bicar
      ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(x, y + 5, 7, 3, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#8a93a3'; ctx.beginPath(); ctx.ellipse(x, y, 7, 5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#9aa3b3'; ctx.beginPath(); ctx.arc(x + 6, y - 4 + peck, 3.2, 0, 7); ctx.fill();
      ctx.fillStyle = '#e0a050'; ctx.beginPath(); ctx.moveTo(x + 9, y - 4 + peck); ctx.lineTo(x + 12, y - 3 + peck); ctx.lineTo(x + 9, y - 2 + peck); ctx.fill();
    }

    // seta na borda da tela apontando pra quem precisa de ajuda fora do campo de visão
    function drawOffscreenArrows() {
      const ccx = cam.x + cv.width / 2, ccy = cam.y + cv.height / 2, m = 56;
      for (const e of elders) {
        if (!e.need || e.escorting) continue;
        const sx0 = e.x - cam.x, sy0 = e.y - cam.y;
        if (sx0 > 44 && sx0 < cv.width - 44 && sy0 > 84 && sy0 < cv.height - 44) continue; // já está visível
        const ang = Math.atan2(e.y - ccy, e.x - ccx);
        const ex = clamp(sx0, m, cv.width - m), ey = clamp(sy0, m + 30, cv.height - m);
        const f = clamp(e.patience / e.maxPat, 0, 1);
        const col = f > 0.5 ? '#41c264' : f > 0.25 ? '#e8b13b' : '#e0533b';
        ctx.save(); ctx.translate(ex, ey); ctx.rotate(ang);
        ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(26, 0); ctx.lineTo(10, -10); ctx.lineTo(10, 10); ctx.closePath(); ctx.fill();
        ctx.restore();
        ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.beginPath(); ctx.arc(ex, ey, 17, 0, 7); ctx.fill();
        ctx.lineWidth = 2.5; ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(ex, ey, 17, 0, 7); ctx.stroke();
        emoji(NEED_EMOJI[e.need], ex, ey, 20);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      const c0 = Math.floor(cam.x / TS), c1 = Math.ceil((cam.x + cv.width) / TS);
      const r0 = Math.floor(cam.y / TS), r1 = Math.ceil((cam.y + cv.height) / TS);
      for (let r = r0; r < r1; r++) for (let c = c0; c < c1; c++) {
        if (r < 0 || c < 0 || r >= ROWS || c >= COLS) continue;
        drawTile(map[r][c], c * TS - cam.x, r * TS - cam.y, c, r);
      }

      // móveis (planos primeiro, depois os com volume)
      for (const p of props) if (p.flat) drawProp(p);
      for (const p of props) if (!p.flat) drawProp(p);

      for (const s of stations) {
        const x = s.x - cam.x, y = s.y - cam.y;
        ctx.fillStyle = '#fff7e6'; ctx.beginPath(); ctx.roundRect(x - 32, y - 30, 64, 46, 10); ctx.fill();
        emoji(s.emoji, x, y - 8, 30);
        ctx.fillStyle = '#5b4327'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center'; ctx.fillText(s.name, x, y + 22);
      }

      const drawn = [...elders.map((e) => ({ o: e, t: 'e' })), ...pigeons.map((p) => ({ o: p, t: 'g' })), { o: player, t: 'p' }].sort((a, b) => a.o.y - b.o.y);
      for (const it of drawn) {
        const e = it.o, x = e.x - cam.x;
        if (it.t === 'g') { drawPigeon(it.o); continue; }
        if (it.t === 'e') {
          const y = e.y - cam.y;
          shadow(x, y, 15);
          if (e.busy > 0 && e.busyKind === 'sleep') {
            ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 2); drawChar(0, 0, 0, 0, e.pal, false); ctx.restore();
            emoji('😴', x + 20, y - 22, 20);
          } else {
            drawChar(x, y, e.dir, e.idle * 3, e.pal, e.escorting || e.returning);
            if (e.busy > 0 && e.busyKind === 'bath') emoji('💦', x, y - 34, 22);
            if (e.busy > 0 && e.busyKind === 'walk' && e.walkKind === 'bench') emoji('🍞', x, y - 34, 20);
          }
          if (e.happy > 0) { ctx.globalAlpha = Math.min(1, e.happy); emoji('😊', x + 22, y - 24 - (1 - e.happy) * 10, 22); ctx.globalAlpha = 1; }
          if (e.sad > 0) { ctx.globalAlpha = Math.min(1, e.sad); emoji('💢', x + 22, y - 24 - (1.4 - e.sad) * 10, 22); ctx.globalAlpha = 1; }
          if (e.need && !e.escorting) {
            const pulse = 1 + Math.sin(time * 6) * 0.06;
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(x - 24, y - 66, 48, 38, 10); ctx.fill();
            ctx.beginPath(); ctx.moveTo(x - 6, y - 30); ctx.lineTo(x + 6, y - 30); ctx.lineTo(x, y - 20); ctx.fill();
            emoji(NEED_EMOJI[e.need], x, y - 48, 26 * pulse);
            const f = clamp(e.patience / e.maxPat, 0, 1);
            ctx.fillStyle = '#00000022'; ctx.fillRect(x - 22, y - 74, 44, 6);
            ctx.fillStyle = f > 0.5 ? '#41c264' : f > 0.25 ? '#e8b13b' : '#e0533b'; ctx.fillRect(x - 22, y - 74, 44 * f, 6);
          }
        } else {
          const y = e.y - cam.y;
          shadow(x, y, 15);
          drawChar(x, y, player.dir, player.walkPhase, player.pal, player.moving);
          if (player.carry) emoji(NEED_EMOJI[player.carry], x, y - 34, 26);
        }
      }

      // partículas (suco visual ao atender)
      for (const p of particles) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2)); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x - cam.x, p.y - cam.y, 3, 0, 7); ctx.fill(); }
      ctx.globalAlpha = 1;

      for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.life); ctx.fillStyle = f.color; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center'; ctx.fillText(f.txt, f.x - cam.x, f.y - cam.y); ctx.globalAlpha = 1; }

      if (state === 'playing') drawOffscreenArrows();

      if (toastT > 0) {
        ctx.globalAlpha = Math.min(1, toastT);
        ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.beginPath(); ctx.roundRect(cv.width / 2 - 170, 50, 340, 34, 10); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(toastMsg, cv.width / 2, 67);
        ctx.globalAlpha = 1;
      }
    }

    let last = 0;
    function loop(now) {
      const dt = last ? Math.min((now - last) / 1000, 0.05) : 0; last = now;
      if (state === 'playing') update(dt);
      cam.x = clamp(player.x - cv.width / 2, 0, Math.max(0, WORLD_W - cv.width));
      cam.y = clamp(player.y - cv.height / 2, 0, Math.max(0, WORLD_H - cv.height));
      draw();
      requestAnimationFrame(loop);
    }

    // cena inicial congelada por trás do painel de abertura
    day = 1; score = 0; served = 0; dayServed = 0; goal = dayGoal(1); curPat = PATIENCE;
    timeLeft = DAY_TIME; time = 0; toastT = 0; floaters = []; particles = [];
    makeElders(dayCount(1));
    updateHud();
    showIntro();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
