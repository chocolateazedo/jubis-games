<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Velha</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #222a68, #0d1028 60%);
      color: #fff;
    }
    .card {
      width: min(92vw, 420px);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      text-align: center;
    }
    .back {
      position: fixed;
      top: 12px;
      left: 12px;
      color: #b8d9ff;
      text-decoration: none;
      font-weight: 700;
    }
    h1 { margin-top: 4px; font-size: 1.6rem; }
    .status { margin: 10px 0 14px; font-weight: 700; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    button.cell {
      aspect-ratio: 1;
      border: 0;
      border-radius: 12px;
      background: #11183f;
      color: #fff;
      font-size: 2.4rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .05s ease, background .2s ease;
    }
    button.cell:hover { background: #1a2560; }
    button.cell:active { transform: scale(0.98); }
    .actions { margin-top: 14px; }
    .reset {
      border: 0;
      border-radius: 10px;
      background: #40e0d0;
      color: #111;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <a class="back" href="../../">← Voltar</a>
  <main class="card">
    <h1>Jogo da Velha</h1>
    <p class="status" id="status">Vez do jogador X</p>
    <div class="board" id="board" aria-label="Tabuleiro 3 por 3"></div>
    <div class="actions">
      <button class="reset" id="reset">Reiniciar</button>
    </div>
  </main>

  <script>
    const board = document.getElementById('board');
    const statusText = document.getElementById('status');
    const resetBtn = document.getElementById('reset');

    let current = 'X';
    let gameOver = false;
    const cells = Array(9).fill('');
    const wins = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    function render() {
      board.innerHTML = '';
      cells.forEach((value, i) => {
        const btn = document.createElement('button');
        btn.className = 'cell';
        btn.type = 'button';
        btn.textContent = value;
        btn.setAttribute('aria-label', `Casa ${i + 1}`);
        btn.addEventListener('click', () => play(i));
        board.appendChild(btn);
      });
    }

    function checkWinner() {
      for (const [a,b,c] of wins) {
        if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) return cells[a];
      }
      return cells.every(Boolean) ? 'draw' : null;
    }

    function play(index) {
      if (gameOver || cells[index]) return;
      cells[index] = current;
      const result = checkWinner();

      if (result === 'draw') {
        statusText.textContent = 'Empate!';
        gameOver = true;
      } else if (result) {
        statusText.textContent = `Jogador ${result} venceu!`;
        gameOver = true;
      } else {
        current = current === 'X' ? 'O' : 'X';
        statusText.textContent = `Vez do jogador ${current}`;
      }
      render();
    }

    resetBtn.addEventListener('click', () => {
      cells.fill('');
      current = 'X';
      gameOver = false;
      statusText.textContent = 'Vez do jogador X';
      render();
    });

    render();
  </script>
</body>
</html>
