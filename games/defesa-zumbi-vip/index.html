<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>Defesa Zumbi VIP — Jubis Games</title>
  <style>
    :root{--bg:#050815;--panel:rgba(11,19,44,.86);--line:rgba(103,233,255,.5);--cyan:#58f4ff;--pink:#ff63d5;--gold:#ffd56b}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 20% 5%,#3a67c2,#090f28 60%,#040611);font-family:Inter,system-ui,sans-serif;color:#fff}
    .back{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:99;background:rgba(0,0,0,.45);padding:.38rem .62rem;border-radius:10px;border:1px solid #7fd9ff;color:#ddf5ff;text-decoration:none}
    .screen{height:100dvh;padding:calc(44px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 28px rgba(0,0,0,.45),inset 0 0 48px rgba(141,106,255,.16)}
    #menu{margin:auto;max-width:1000px;padding:18px}.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
    .world{padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.24);background:linear-gradient(150deg,rgba(30,54,110,.86),rgba(42,21,76,.76));color:#fff;cursor:pointer;text-align:left}
    .hidden{display:none!important}
    .hud{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
    .hud-item{padding:10px;border-radius:12px;background:linear-gradient(160deg,rgba(15,29,67,.92),rgba(50,22,78,.88));border:1px solid rgba(136,231,255,.56);text-align:center;box-shadow:0 0 24px rgba(83,239,255,.18),inset 0 0 18px rgba(255,255,255,.06)}
    .hud-item b{display:block;color:#9edfff;font-size:.74rem}.hud-item span{font-size:1.06rem;text-shadow:0 0 8px var(--cyan)}
    #bossHud{display:flex;align-items:center;gap:8px}.boss-bar{height:10px;flex:1;background:rgba(0,0,0,.55);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.35)}.boss-fill{height:100%;width:0%;background:linear-gradient(90deg,#ff446d,#ff95aa)}
    .main{display:flex;min-height:0;flex:1}.map{position:relative;flex:1}
    canvas{width:100%;height:100%;display:block;border-radius:15px;border:1px solid var(--line);background:#111;box-shadow:0 0 30px rgba(83,239,255,.17)}
    .fx{position:absolute;inset:auto 12px 12px auto;font-size:.75rem;background:rgba(0,0,0,.4);padding:6px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.3)}
    .shop{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));gap:8px;overflow-x:auto;padding:2px 2px 5px}
    .tower{padding:10px;border-radius:13px;border:1px solid rgba(255,255,255,.22);background:linear-gradient(140deg,rgba(41,22,79,.92),rgba(11,39,78,.92));cursor:pointer;text-align:left;min-height:102px}
    .tower.active{border-color:var(--gold);box-shadow:0 0 16px rgba(255,212,106,.52)}
    .status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.status .box{pointer-events:auto;padding:16px;max-width:420px}
    @media (max-width:960px){.hud{grid-template-columns:repeat(2,minmax(0,1fr))}#bossHud{grid-column:1/-1}.shop{grid-template-columns:repeat(7,220px)}.main{min-height:46dvh}}
  </style>
</head>
<body>
<a class="back" href="../../">← Voltar</a>
<main class="screen">
  <section id="menu" class="card"><h1 style="margin:.1rem 0;text-align:center;text-shadow:0 0 18px var(--cyan)">Defesa Zumbi VIP</h1><p style="text-align:center">Estilo cartoon premium inspirado na referência <code>2ca166e5-d4cc-4855-ae66-a0b3e18ed420</code>.</p><div id="worlds" class="worlds"></div></section>
  <section id="game" class="hidden" style="display:flex;flex-direction:column;gap:10px;height:100%">
    <header class="hud"><div class="hud-item"><b>❤️ Vida</b><span id="life">100</span></div><div class="hud-item"><b>💰 Dinheiro</b><span id="money">300</span></div><div class="hud-item"><b>🌊 Onda</b><span id="wave">1/10</span></div><div class="hud-item"><b>🏰 Torres</b><span id="qt">0</span></div><div id="bossHud" class="hud-item hidden"><b>👹 Chefão</b><div class="boss-bar"><div id="bossFill" class="boss-fill"></div></div></div></header>
    <div class="main"><div class="map"><canvas id="cv"></canvas><div class="fx">Upgrade: duplo toque na torre</div></div></div>
    <footer id="shop" class="shop"></footer>
  </section>
  <div id="status" class="status"></div>
</main>
<script>
(()=>{const worlds=[{n:'Floresta Sombria',c1:'#1a4d35',c2:'#0c281b',path:'#c4a571'},{n:'Caverna Tóxica',c1:'#475e1f',c2:'#1e2b0f',path:'#b99b67'},{n:'Vila Assombrada',c1:'#543748',c2:'#241824',path:'#c59c7d'}];
const towers=[{id:'gelo',n:'Torre de Gelo',preco:95,alc:160,dano:12,rate:54,c:'#97f3ff',slow:85,s:'square'},{id:'veneno',n:'Torre de Veneno',preco:115,alc:152,dano:9,rate:40,c:'#8fff61',dot:130,s:'sawtooth'},{id:'vento',n:'Torre de Vento',preco:108,alc:168,dano:8,rate:34,c:'#e8f8ff',push:1,s:'triangle'},{id:'eletrica',n:'Torre Elétrica',preco:150,alc:158,dano:15,rate:50,c:'#bca2ff',chain:4,s:'square'},{id:'fogo',n:'Torre de Fogo',preco:135,alc:144,dano:15,rate:40,c:'#ff9162',burn:110,s:'sine'},{id:'agua',n:'Torre de Água',preco:122,alc:156,dano:11,rate:38,c:'#63bcff',splash:60,slow:40,s:'triangle'},{id:'explosiva',n:'Torre Explosiva',preco:170,alc:145,dano:26,rate:68,c:'#ffd66c',splash:74,blast:true,s:'sawtooth'}];
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');let S,dpr=1;const ac=new (window.AudioContext||window.webkitAudioContext)();
function tone(f=400,t=.08,v=.03,type='triangle'){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t);o.start();o.stop(ac.currentTime+t)}
function resize(){dpr=Math.max(1,Math.min(2,devicePixelRatio||1));cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)} addEventListener('resize',resize);
function pathPts(){const w=cv.clientWidth,h=cv.clientHeight,m=36;return [[m,h*.16],[w*.34,h*.16],[w*.34,h*.36],[w*.72,h*.36],[w*.72,h*.20],[w-m,h*.20],[w-m,h*.56],[w*.18,h*.56],[w*.18,h*.84],[w*.92,h*.84]]}
function start(world){$('menu').classList.add('hidden');$('game').classList.remove('hidden');resize();S={world,life:100,money:360,w:1,maxW:10,towers:[],shots:[],z:[],p:[],spawn:0,tick:0,boss:false,over:false,sel:null,path:pathPts()};loop()}
function spawn(boss=false){const hp=boss?1800:88+S.w*20;S.z.push({x:S.path[0][0],y:S.path[0][1],i:1,hp,max:hp,spd:boss?.32:.58+S.w*.03,size:boss?58:24,boss,slow:0,po:0,burn:0})}
function update(){if(S.over)return;S.path=pathPts();S.tick++;if(S.spawn--<=0){if(S.w===S.maxW&&!S.boss&&S.tick>1200){spawn(true);S.boss=true;$('bossHud').classList.remove('hidden')}else spawn(false);S.spawn=Math.max(24,75-S.w*4)}if(S.tick%760===0&&S.w<S.maxW)S.w++;
for(const z of S.z){const t=S.path[z.i];if(!t){S.life-=z.boss?24:8;z.hp=0;continue}const sp=z.slow>0?z.spd*.5:z.spd;const dx=t[0]-z.x,dy=t[1]-z.y,d=Math.hypot(dx,dy);if(d<4)z.i++;else{z.x+=dx/d*sp;z.y+=dy/d*sp}z.slow=Math.max(0,z.slow-1);if(z.po>0){z.hp-=.24;z.po--}if(z.burn>0){z.hp-=.4;z.burn--}}
for(const t of S.towers){if(t.cd-->0)continue;const target=S.z.find(z=>z.hp>0&&Math.hypot(z.x-t.x,z.y-t.y)<t.tp.alc);if(!target)continue;t.cd=t.tp.rate-Math.min(18,(t.lv-1)*4);S.shots.push({x:t.x,y:t.y,trg:target,t});tone(240+t.lv*35,.05,.03,t.tp.s)}
for(const s of S.shots){if(!s.trg||s.trg.hp<=0){s.dead=1;continue}const dx=s.trg.x-s.x,dy=s.trg.y-s.y,d=Math.hypot(dx,dy);if(d<11){impact(s);s.dead=1}else{s.x+=dx/d*5.4;s.y+=dy/d*5.4}}
S.p.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.015;p.l--});S.p=S.p.filter(p=>p.l>0);S.shots=S.shots.filter(s=>!s.dead);S.z=S.z.filter(z=>{if(z.hp<=0){S.money+=z.boss?140:14;if(z.boss){S.over=true;end('Vitória VIP','Chefão final derrotado!')}return false}return true});if(S.life<=0&&!S.over){S.over=true;end('Game Over','Os zumbis invadiram sua base.') }}
function impact(s){const t=s.t.tp,lv=s.t.lv,d=t.dano+lv*2,z=s.trg;z.hp-=d;if(t.slow)z.slow=t.slow;if(t.dot)z.po=t.dot;if(t.burn)z.burn=t.burn;if(t.push&&z.i>1)z.i-=0.18;if(t.chain){let prev=z;for(let c=0;c<t.chain;c++){const nx=S.z.find(a=>a!==prev&&Math.hypot(a.x-prev.x,a.y-prev.y)<110&&a.hp>0);if(!nx)break;nx.hp-=d*.52;for(let i=0;i<10;i++)S.p.push({x:prev.x,y:prev.y,vx:(nx.x-prev.x)/20+(Math.random()-.5),vy:(nx.y-prev.y)/20+(Math.random()-.5),l:16,c:'#cab8ff'});prev=nx}}if(t.splash){for(const a of S.z){const dist=Math.hypot(a.x-z.x,a.y-z.y);if(dist<t.splash)a.hp-=d*(1-dist/t.splash)*.9}}for(let i=0;i<24;i++)S.p.push({x:z.x,y:z.y,vx:(Math.random()-.5)*3.5,vy:(Math.random()-.5)*3.5,l:28,c:t.c});if(t.blast)tone(100,.18,.08,'square')}
function drawBG(){const g=ctx.createLinearGradient(0,0,0,cv.clientHeight);g.addColorStop(0,S.world.c1);g.addColorStop(1,S.world.c2);ctx.fillStyle=g;ctx.fillRect(0,0,cv.clientWidth,cv.clientHeight);ctx.lineWidth=48;ctx.strokeStyle=S.world.path;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowBlur=24;ctx.shadowColor='rgba(0,0,0,.46)';ctx.beginPath();S.path.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='rgba(248,220,176,.68)';ctx.lineWidth=4;ctx.setLineDash([6,10]);ctx.beginPath();S.path.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.setLineDash([])}
function draw(){drawBG();S.towers.forEach(t=>{ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(t.x+8,t.y+22,20,9,0,0,6.28);ctx.fill();ctx.strokeStyle=t.tp.c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(t.x,t.y,18,0,6.28);ctx.stroke();ctx.fillStyle=t.tp.c;ctx.globalAlpha=.38;ctx.beginPath();ctx.arc(t.x,t.y,13+Math.sin((S.tick+t.x)*.05)*1.5,0,6.28);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillText('★'.repeat(t.lv),t.x-10,t.y+4)});
S.shots.forEach(s=>{ctx.fillStyle=s.t.tp.c;ctx.shadowColor=s.t.tp.c;ctx.shadowBlur=15;ctx.beginPath();ctx.arc(s.x,s.y,5,0,6.28);ctx.fill();ctx.shadowBlur=0});
S.z.forEach(z=>{const bob=Math.sin((S.tick+z.x)*.18)*2;ctx.fillStyle='rgba(0,0,0,.42)';ctx.beginPath();ctx.ellipse(z.x+5,z.y+z.size*.8,z.size*.56,z.size*.22,0,0,6.28);ctx.fill();ctx.fillStyle=z.boss?'#a11f38':'#5fc96f';ctx.beginPath();ctx.roundRect(z.x-z.size/2,z.y-z.size/2+bob,z.size,z.size,10);ctx.fill();ctx.fillStyle='#2a1320';ctx.fillRect(z.x-z.size/2,z.y-z.size/2-10,z.size,7);ctx.fillStyle=z.boss?'#ff4a79':'#74ff98';ctx.fillRect(z.x-z.size/2,z.y-z.size/2-10,Math.max(0,z.hp/z.max)*z.size,7)});
S.p.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l/28);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3);ctx.globalAlpha=1});const b=S.z.find(z=>z.boss);$('bossFill').style.width=b?Math.max(0,(b.hp/b.max)*100)+'%':'0%';}
function ui(){$('life').textContent=Math.max(0,Math.floor(S.life));$('money').textContent=Math.floor(S.money);$('wave').textContent=`${S.w}/${S.maxW}`;$('qt').textContent=S.towers.length;}
function loop(){if(!S)return;update();draw();ui();requestAnimationFrame(loop)}
function end(t,m){$('status').innerHTML=`<div class="box card"><h2>${t}</h2><p>${m}</p><button onclick="location.reload()">Reiniciar</button></div>`}
cv.addEventListener('pointerdown',e=>{if(!S||S.over)return;ac.resume();const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;const existing=S.towers.find(t=>Math.hypot(t.x-x,t.y-y)<26);if(existing){if(e.detail===2&&S.money>=existing.up&&existing.lv<5){S.money-=existing.up;existing.lv++;existing.up=Math.floor(existing.up*1.45);tone(620,.08,.05)}return}const tp=towers.find(t=>t.id===S.sel);if(!tp||S.money<tp.preco)return;if(S.path.some(p=>Math.hypot(p[0]-x,p[1]-y)<66))return;S.money-=tp.preco;S.towers.push({x,y,lv:1,tp,cd:0,up:72})});
const wb=$('worlds');worlds.forEach((w,i)=>{const b=document.createElement('button');b.className='world';b.innerHTML=`<strong>${w.n}</strong><small>Mundo ${i+1} • chefão final</small>`;b.onclick=()=>start(w);wb.appendChild(b)});
const shop=$('shop');towers.forEach(tp=>{const c=document.createElement('button');c.className='tower';c.innerHTML=`<strong>${tp.n}</strong><small>💰${tp.preco} • 🎯${tp.alc}</small><small>⚔️${tp.dano} • efeito único</small>`;c.onclick=()=>{S&&(S.sel=tp.id);[...shop.children].forEach(x=>x.classList.remove('active'));c.classList.add('active')};shop.appendChild(c)})
})();
</script>
</body>
</html>
