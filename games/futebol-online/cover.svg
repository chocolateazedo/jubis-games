<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375" role="img" aria-label="Futebol Online">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eafff0"/>
      <stop offset="100%" stop-color="#6db2ff"/>
    </linearGradient>
  </defs>

  <!-- campo com listras -->
  <rect width="600" height="375" fill="#2f9b43"/>
  <g fill="#36a94c">
    <rect x="0" y="0" width="75" height="375"/>
    <rect x="150" y="0" width="75" height="375"/>
    <rect x="300" y="0" width="75" height="375"/>
    <rect x="450" y="0" width="75" height="375"/>
  </g>

  <!-- linhas do campo -->
  <g fill="none" stroke="rgba(255,255,255,.85)" stroke-width="4">
    <rect x="20" y="20" width="560" height="335"/>
    <line x1="300" y1="20" x2="300" y2="355"/>
    <circle cx="300" cy="187" r="58"/>
    <rect x="20" y="112" width="70" height="150"/>
    <rect x="510" y="112" width="70" height="150"/>
  </g>
  <circle cx="300" cy="187" r="5" fill="#fff"/>

  <!-- jogadores -->
  <g>
    <ellipse cx="210" cy="150" rx="20" ry="11" fill="rgba(0,0,0,.25)"/>
    <circle cx="210" cy="142" r="22" fill="#2f6df0" stroke="#1b3f96" stroke-width="3"/>
    <circle cx="222" cy="142" r="8" fill="#f1c27d"/>
    <ellipse cx="360" cy="232" rx="20" ry="11" fill="rgba(0,0,0,.25)"/>
    <circle cx="360" cy="224" r="22" fill="#e03b3b" stroke="#8f2020" stroke-width="3"/>
    <circle cx="348" cy="224" r="8" fill="#f1c27d"/>
  </g>

  <!-- bola -->
  <ellipse cx="288" cy="196" rx="13" ry="7" fill="rgba(0,0,0,.3)"/>
  <circle cx="288" cy="187" r="14" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="288" cy="187" r="4.5" fill="#222"/>

  <!-- título -->
  <rect x="60" y="300" width="480" height="58" rx="16" fill="rgba(8,20,34,.8)"/>
  <text x="300" y="340" font-family="Arial, sans-serif" font-size="38" font-weight="800"
        text-anchor="middle" fill="url(#title)">⚽ Futebol Online</text>
</svg>
